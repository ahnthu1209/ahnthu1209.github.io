<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#18140f">
  <meta name="description" content="Khám phá phòng rửa ảnh film Solina trong không gian 3D với ánh đèn vàng ấm.">
  <title>Phòng tối Solina · Trải nghiệm 3D</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="preload" href="./phong-toi-gallery.webp" as="image">
  <link rel="stylesheet" href="./avatar.css?v=7">
  <script type="module" src="./viewer.js?v=7"></script>
</head>
<body>
  <main>
    <header class="heading">
      <div class="signature">SOLINA</div>
      <h1>Phòng tối</h1>
    </header>
    <section class="experience" aria-label="Mô hình phòng tối Solina">
      <div class="stage" id="stage">
        <img class="poster" src="./phong-toi-gallery.webp" alt="Phòng rửa ảnh với dãy khay dưới ánh đèn vàng">
        <div class="view" id="view" role="region" aria-label="Khung nhìn 3D. Dùng phím mũi tên lên xuống để di chuyển, trái phải để nhìn quanh." tabindex="0"></div>
        <div class="reveal" id="reveal">
          <button class="enter" id="enter" type="button">Bước vào phòng 3D</button>
          <p class="status" id="status" role="status"></p>
        </div>
        <button class="fullscreen" id="fullscreen" type="button" aria-label="Xem toàn màn hình" title="Toàn màn hình" hidden>
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></svg>
        </button>
        <p class="print-cue" id="print-cue" role="status" hidden></p>
        <img id="fallback-print" class="fallback-print" alt="Ảnh đang được tráng" hidden>
      </div>
      <div class="controls" id="controls" hidden>
        <div class="tour">
          <button class="play" id="play" type="button">Phát hành trình</button>
          <div class="scrub">
            <input id="progress" type="range" min="0" max="1000" value="0" aria-label="Vị trí dọc lối đi">
            <span id="time" aria-hidden="true">0:00 / 0:10</span>
          </div>
        </div>
        <div class="positions" aria-label="Chọn góc nhìn">
          <button type="button" class="position" data-spot="entry" aria-pressed="true">Lối vào</button>
          <button type="button" class="position" data-spot="trays" aria-pressed="false">Khay rửa</button>
          <button type="button" class="position" data-spot="prints" aria-pressed="false">Dây phơi</button>
        </div>
      </div>
      <p class="hint" id="hint" hidden>Kéo để nhìn quanh. Di chuyển bằng thanh hành trình hoặc phím ↑ ↓.</p>
      <section id="portrait-panel" class="portrait-panel" aria-label="Rửa ảnh chân dung" hidden>
        <div id="portrait-intro">
          <h2>Rửa ảnh của bạn</h2>
          <p>Chọn một ảnh chân dung. Phòng tối sẽ tách nền và đặt ảnh vào mẫu bạn chọn.</p>
          <input id="portrait-file" type="file" accept="image/jpeg,image/png,image/webp" aria-label="Tải ảnh chân dung">
        </div>
        <h2 id="choose-title" tabindex="-1" hidden>Chọn phong cách</h2>
        <div class="choices-wrap" id="choices-wrap" hidden>
          <div class="frame-choices" id="frame-choices" role="group" aria-label="Bảy mẫu ảnh Solina"></div>
          <div class="preview-column">
            <canvas id="portrait-preview" width="1000" height="1000" role="img" aria-label="Xem trước ảnh theo mẫu đã chọn"></canvas>
            <details class="adjustments" id="adjustments">
              <summary>Căn lại chân dung</summary>
              <label>Ngang <input id="adjust-x" type="range" min="-.25" max=".25" step=".005" value="0"></label>
              <label>Dọc <input id="adjust-y" type="range" min="-.25" max=".45" step=".005" value="0"></label>
              <label>Thu phóng <input id="adjust-zoom" type="range" min=".55" max="1.65" step=".01" value="1"></label>
            </details>
            <button id="wash-photo" class="enter" type="button">Rửa ảnh</button>
          </div>
        </div>
        <p id="portrait-status" role="status"></p>
        <div class="avatar-actions">
          <p id="result-number" hidden></p>
          <a id="download-photo" class="enter" download hidden>Tải ảnh PNG</a>
          <button id="restart-photo" type="button" hidden>Chọn ảnh khác</button>
          <button id="resume-photo" type="button" hidden>Tiếp tục rửa ảnh</button>
          <button id="retry-number" type="button" hidden>Thử lại</button>
        </div>
      </section>
      <noscript><p class="hint">Bật JavaScript để khám phá mô hình 3D.</p></noscript>
    </section>
  </main>
</body>
</html>
