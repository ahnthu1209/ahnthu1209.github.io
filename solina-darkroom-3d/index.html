<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#18140f">
  <meta name="description" content="Mở cổng và bước vào phòng rửa ảnh Solina trong không gian 3D.">
  <title>Phòng rửa ảnh Solina · Trải nghiệm 3D</title>
  <link rel="preload" href="./cong/loi-vao.webp" as="image">
  <link rel="preload" href="./cong/canh-cong.webp" as="image">
  <link rel="stylesheet" href="./style.css?v=12">
  <link rel="stylesheet" href="./avatar.css?v=11">
  <script type="module" src="./viewer.js?v=13"></script>
</head>
<body>
  <main class="experience" aria-label="Phòng rửa ảnh Solina">
    <div class="stage" id="stage">
      <img class="poster" src="./phong-toi-gallery.webp" alt="">
      <div class="view" id="view" role="region" aria-label="Phòng 3D. Dùng phím mũi tên để nhìn quanh hoặc di chuyển." tabindex="0" inert></div>
      <p class="print-cue" id="print-cue" role="status" hidden></p>
      <span class="fallback-clip" id="fallback-clip" aria-hidden="true" hidden></span>
      <img id="fallback-print" class="fallback-print" alt="Tờ ảnh đang được tráng" hidden>
    </div>

    <div class="controls" id="controls" aria-label="Điều khiển góc nhìn" hidden>
      <div class="positions" aria-label="Chọn góc nhìn">
        <button type="button" data-spot="entry" aria-pressed="true">Lối vào</button>
        <button type="button" data-spot="trays" aria-pressed="false">Khay rửa</button>
        <button type="button" data-spot="prints" aria-pressed="false">Dây phơi</button>
      </div>
      <button id="play" type="button">Phát hành trình</button>
      <div class="scrub" hidden>
        <input id="progress" type="range" min="0" max="1000" value="0" aria-label="Vị trí dọc lối đi">
        <span id="time" aria-hidden="true"></span>
      </div>
    </div>
    <button class="fullscreen" id="fullscreen" type="button" aria-label="Xem toàn màn hình" title="Toàn màn hình" hidden>
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></svg>
    </button>

    <section id="portrait-panel" class="portrait-panel" aria-label="Rửa ảnh chân dung" hidden>
      <div id="portrait-intro">
        <h1>Phòng rửa ảnh Solina</h1>
        <label class="upload-button">Tải ảnh chân dung
          <input id="portrait-file" type="file" accept="image/jpeg,image/png,image/webp" aria-label="Tải ảnh chân dung">
        </label>
      </div>
      <h2 id="choose-title" tabindex="-1" hidden>Chọn phong cách</h2>
      <div class="choices-wrap" id="choices-wrap" hidden>
        <div class="frame-choices" id="frame-choices" role="group" aria-label="Bảy mẫu ảnh Solina"></div>
        <p id="selected-style" class="selected-style" hidden></p>
        <div class="preview-column">
          <canvas id="portrait-preview" width="1000" height="1000" role="img" aria-label="Xem trước ảnh theo mẫu đã chọn"></canvas>
          <details class="adjustments" id="adjustments">
            <summary>Căn lại chân dung</summary>
            <label>Ngang <input id="adjust-x" type="range" min="-.25" max=".25" step=".005" value="0"></label>
            <label>Dọc <input id="adjust-y" type="range" min="-.25" max=".45" step=".005" value="0"></label>
            <label>Thu phóng <input id="adjust-zoom" type="range" min=".55" max="1.65" step=".01" value="1"></label>
            <div class="edge-editor">
              <button id="erase-edge" type="button" aria-pressed="false">Xóa nền sót</button>
              <button id="undo-edge" type="button" disabled>Hoàn tác</button>
            </div>
            <small id="erase-hint" hidden>Kéo nhẹ trên phần nền còn sót trong ảnh xem trước.</small>
          </details>
          <button id="wash-photo" class="enter" type="button">Rửa ảnh</button>
        </div>
      </div>
      <p id="portrait-status" role="status"></p>
      <p id="result-number" hidden></p>
      <div class="result-caption" id="caption-box" hidden>
        <p id="result-caption"></p>
        <button id="copy-caption" type="button">Sao chép caption</button>
      </div>
      <div class="avatar-actions">
        <a id="download-photo" class="enter" download hidden>Tải ảnh PNG</a>
        <button id="restart-photo" type="button" hidden>Chọn ảnh khác</button>
        <button id="resume-photo" type="button" hidden>Tiếp tục rửa ảnh</button>
        <button id="retry-number" type="button" hidden>Thử lại</button>
      </div>
    </section>

    <div class="gate" id="gate">
      <div class="gate-scene" aria-hidden="true">
        <img class="gate-picture" src="./cong/loi-vao.webp" alt="">
        <span class="gate-leaf"></span>
        <img class="gate-plants" src="./cong/cay-truoc-cong.webp" alt="">
      </div>
      <button class="gate-trigger" id="enter" type="button">
        <span>Mở cổng</span>
      </button>
      <p class="status" id="status" role="status"></p>
      <noscript><p class="status">Bật JavaScript để bước vào Phòng tối Solina.</p></noscript>
    </div>
  </main>
</body>
</html>
