.mcq-option.correct{border-color:#269b75;background:#eaf9f1;color:#17694e}

.mcq-option.wrong{border-color:#d66e53;background:#fff0e8;color:#ae3e28}

.mcq-option.dim{opacity:.65}
.mcq-answer-footer{padding:0 23px 22px}

.mcq-feedback.wrong{background:#fff4eb;border-color:#f3d8c0;color:#8a4e27}
.mcq-feedback strong{font-size:14px}
.mcq-feedback .source{display:block;margin-top:4px;font-size:12px}
.mcq-feedback .source a,.mcq-feedback .source button{color:inherit}
.mcq-bottom{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;margin-top:17px}
.mcq-bottom .btn{min-width:160px}
.mcq-mini{color:#877b72;font-size:12px}

.mcq-result p{color:#776e69;max-width:520px;margin:0 auto 24px}
.mcq-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.mcq-note{font-size:12px;color:#867a70;max-width:920px;margin:16px auto 0;line-height:1.85}

 jiān bǎ zhè piān xiǎo shuō fānyì chéng yīng wén.","vi":"Tôi đã dành hai ngày để dịch cuốn tiểu thuyết này sang tiếng Anh.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0453","page":45,"kind":"note","vi":"Câu 4"},{"id":"r0454","page":45,"kind":"prompt","cn":"我常常把晚饭吃在饭店里。","py":"wǒ cháng cháng bǎ wǎn fàn chī zài fàn diàn lǐ.","vi":"Câu trong đề cần sửa."},{"id":"r0455","page":45,"kind":"answer","cn":"我常常在饭店里吃晚饭。","py":"wǒ cháng cháng zài fàn diàn lǐ chī wǎn fàn.","vi":"Tôi thường ăn tối ở nhà hàng.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0456","page":45,"kind":"note","vi":"Câu 5"},{"id":"r0457","page":45,"kind":"prompt","cn":"我挂新买的画儿在宿舍的墙上。","py":"wǒ guà xīn mǎi de huàér zài sù shě de qiáng shàng.","vi":"Câu trong đề cần sửa."},{"id":"r0458","page":45,"kind":"answer","cn":"我把新买的画儿挂在宿舍的墙上。","py":"wǒ bǎ xīn mǎi de huàér guà zài sù shě de qiáng shàng.","vi":"Tôi treo bức tranh mới mua lên tường ký túc xá.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0459","page":45,"kind":"note","vi":"Câu 6"},{"id":"r0460","page":45,"kind":"prompt","cn":"我已经寄那张照片给妈妈了。","py":"wǒ yǐ jīng jì nà zhāng zhào piàn gěi mā mā le.","vi":"Câu trong đề cần sửa."},{"id":"r0461","page":45,"kind":"answer","cn":"我已经把那张照片寄给妈妈了。","py":"wǒ yǐ jīng bǎ nà zhāng zhào piàn jì gěi mā mā le.","vi":"Tôi đã gửi bức ảnh ấy cho mẹ rồi.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0462","page":46,"kind":"note","vi":"Tình huống 1"},{"id":"r0463","page":46,"kind":"prompt","cn":"你买了一幅画，想挂在屋子里，你怎么和家人商量挂在什么地方？","py":"nǐ mǎi le yī fú huà， xiǎng guà zài wū zǐ lǐ， nǐ zěn me hé jiā rén shāng liàng guà zài shén me de fāng？","vi":"Yêu cầu: dùng 把 nói theo tình huống."},{"id":"r0464","page":46,"kind":"answer","cn":"你觉得我们把这幅画挂在哪儿比较好？","py":"nǐ jué de wǒ men bǎ zhè fú huàguà zài nǎ ér bǐ jiào hǎo？","vi":"Bạn mua một bức tranh, muốn treo trong nhà. Bạn hỏi người nhà: Mọi người thấy chúng ta treo tranh ở đâu thì đẹp?","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0465","page":46,"kind":"note","vi":"Tình huống 2"},{"id":"r0466","page":46,"kind":"prompt","cn":"你想借你同学的手机用一下，怎么对他说？","py":"nǐ xiǎng jiè nǐ tóng xué de shǒu jīyòngyī xià， zěn me duì tā shuō？","vi":"Yêu cầu: dùng 把 nói theo tình huống."},{"id":"r0467","page":46,"kind":"answer","cn":"你能把手机借给我用一下吗？","py":"nǐ néng bǎ shǒu jījiè gěi wǒ yòngyī xià ma？","vi":"Bạn muốn mượn điện thoại của bạn học: Bạn có thể cho tôi mượn điện thoại dùng một lát không?","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0468","page":46,"kind":"note","vi":"Tình huống 3"},{"id":"r0469","page":46,"kind":"prompt","cn":"你在旅馆，要去住的房间，让服务员搬箱子到房间去。","py":"nǐ zài lǚ guǎn， yào qù zhù de fángjiān， ràng fú wù yuán bānxiāng zǐ dào fángjiān qù.","vi":"Yêu cầu: dùng 把 nói theo tình huống."},{"id":"r0470","page":46,"kind":"answer","cn":"请帮我把箱子搬到房间里去。","py":"qǐng bāng wǒ bǎ xiāng zǐ bāndào fángjiān lǐ qù.","vi":"Bạn ở khách sạn, nhờ nhân viên: Làm ơn giúp tôi chuyển vali vào phòng.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0471","page":46,"kind":"note","vi":"Tình huống 4"},{"id":"r0472","page":46,"kind":"prompt","cn":"你想买一个手机，让营业员拿给你看看。","py":"nǐ xiǎng mǎi yī gè shǒu jī， ràng yíng yè yuán nágěi nǐ kàn kàn.","vi":"Yêu cầu: dùng 把 nói theo tình huống."},{"id":"r0473","page":46,"kind":"answer","cn":"请把那个手机拿给我看看。","py":"qǐng bǎ nà gè shǒu jīnágěi wǒ kàn kàn.","vi":"Bạn muốn mua điện thoại: Phiền anh/chị đưa chiếc điện thoại kia cho tôi xem.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0474","page":46,"kind":"note","vi":"Tình huống 5"},{"id":"r0475","page":46,"kind":"prompt","cn":"玛丽要去医院看安娜，你想请玛丽带一束鲜花儿给她。","py":"mǎ lì yào qù yī yuàn kàn ān nà， nǐ xiǎng qǐng mǎ lì dài yī shù xiān huā ér gěi tā.","vi":"Yêu cầu: dùng 把 nói theo tình huống."},{"id":"r0476","page":46,"kind":"answer","cn":"玛丽，请你把这束鲜花带给安娜，好吗？","py":"mǎ lì， qǐng nǐ bǎ zhè shù xiān huā dài gěi ān nà， hǎo ma？","vi":"Mary đến bệnh viện thăm Anna: Mary, bạn mang bó hoa này cho Anna giúp tôi nhé?","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0477","page":46,"kind":"note","vi":"Tình huống 6"},{"id":"r0478","page":46,"kind":"prompt","cn":"在出租车里，你告诉司机在你的宿舍门口停车。","py":"zài chū zū chē lǐ， nǐ gào sù sī jīzài nǐ de sù shě mén kǒu tíng chē.","vi":"Yêu cầu: dùng 把 nói theo tình huống."},{"id":"r0479","page":46,"kind":"answer","cn":"师傅，请把车停在我宿舍门口。","py":"shī fù， qǐng bǎ chē tíng zài wǒ sù shě mén kǒu.","vi":"Bạn đang đi taxi: Bác tài, xin hãy dừng xe ở cửa ký túc xá của tôi.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0480","page":47,"kind":"note","vi":"1. Quay video đọc và dịch trước 3 bài khóa (trang 50–52, 55, 57)."},{"id":"r0481","page":47,"kind":"note","vi":"2. Làm toàn bộ bài tập trong slide, viết tay hoặc đánh máy, sau đó quay video đọc bài."},{"id":"r0482","page":47,"kind":"note","vi":"3. Quay video duet trả lời các câu hỏi TikTok."},{"id":"r0483","page":47,"kind":"note","vi":"Đã kèm lời giải các bài tập trên trang 34–46 và lời giải đọc hiểu ở các trang 53, 54, 56, 58, 60 trong tài liệu này; những yêu cầu quay video là nhiệm vụ thực hành cá nhân."},{"id":"r0484","page":48,"kind":"content","cn":"第二讲：课文＋翻译＋HSKK四级","py":"dìèr jiǎng： kè wén＋fānyì＋HSKK sì jí","vi":"Buổi thứ hai: Bài khóa, luyện dịch và HSKK cấp 4."},{"id":"r0485","page":49,"kind":"content","cn":"第一部分：课文","py":"dìyī bù fēn： kè wén","vi":"Phần thứ nhất: Bài khóa."},{"id":"r0486","page":50,"kind":"content","cn":"（一）我们把教室布置成了会场。","py":"（yī） wǒ men bǎ jiào shì bù zhìchéng le huì chǎng.","vi":"(I) Chúng tôi trang trí phòng học thành hội trường."},{"id":"r0487","page":50,"kind":"content","cn":"圣诞节和新年快到了，我们班准备在圣诞节前举行一个联欢晚会，请老师们也来参加。","py":"shèng dàn jié hé xīn nián kuài dào le， wǒ men bānzhǔn bèi zài shèng dàn jié qián jǔ xíng yī gè lián huān wǎn huì， qǐng lǎo shī men yě lái cān jiā.","vi":"Giáng sinh và năm mới sắp đến, lớp chúng tôi định tổ chức một buổi liên hoan trước Giáng sinh, đồng thời mời các thầy cô đến tham dự."},{"id":"r0488","page":50,"kind":"content","cn":"晚会上我们要唱中文歌，用汉语讲故事，表演节目，品尝各国的特色菜。","py":"wǎn huì shàng wǒ men yào chàng zhōng wén gē， yònghàn yǔ jiǎng gù shì， biǎo yǎn jié mù， pǐn cháng gè guó de tèsè cài.","vi":"Trong buổi liên hoan, chúng tôi sẽ hát các bài hát tiếng Trung, kể chuyện bằng tiếng Hán, biểu diễn các tiết mục và thưởng thức món ăn đặc trưng của các nước."},{"id":"r0489","page":50,"kind":"content","cn":"班长要求我们那天把自己亲手做的菜带到晚会上来，让大家品尝。","py":"bānzhǎng yào qiú wǒ men nà tiān bǎ zì jǐ qīn shǒu zuò de cài dài dào wǎn huì shàng lái， ràng dà jiā pǐn cháng.","vi":"Lớp trưởng yêu cầu hôm đó mỗi người mang món ăn do chính mình nấu đến liên hoan để mọi người cùng nếm thử."},{"id":"r0490","page":50,"kind":"content","cn":"玛丽说：“我们最好借一个大教室，把它布置成会场。”","py":"mǎ lì shuō：“wǒ men zuì hǎo jiè yī gè dà jiào shì， bǎ tā bù zhìchéng huì chǎng.”","vi":"Mary nói: “Tốt nhất chúng ta nên mượn một phòng học lớn rồi bố trí thành hội trường.”"},{"id":"r0491","page":50,"kind":"content","cn":"前天，我们找到管理员，告诉了她借教室的事，她答应把那个大教室借给我们。","py":"qián tiān， wǒ men zhǎodào guǎn lǐ yuán， gào sù le tā jiè jiào shì de shì， tā dá yīng bǎ nà gè dà jiào shì jiè gěi wǒ men.","vi":"Hôm kia, chúng tôi tìm gặp người quản lý để trình bày việc mượn phòng học. Cô ấy đã đồng ý cho chúng tôi mượn phòng học lớn đó."},{"id":"r0492","page":50,"kind":"content","cn":"昨天下午服务员把教室打扫了一下儿，把门和窗户也都擦得干干净净的。","py":"zuótiān xià wǔ fú wù yuán bǎ jiào shì dǎ sǎole yī xià ér， bǎ mén hé chuāng hù yě dōu cā dé gàn gàn jìng jìng de.","vi":"Chiều hôm qua, nhân viên phục vụ đã dọn dẹp lớp học, lau cả cửa ra vào lẫn cửa sổ sạch sẽ tinh tươm."},{"id":"r0493","page":51,"kind":"content","cn":"我们把桌子摆成了一个大圆圈，爱德华把“圣诞——新年快乐”几个大字贴在了黑板上。","py":"wǒ men bǎ zhuō zǐ bǎi chéng le yī gè dà yuán quān， ài dé huá bǎ “shèng dàn——xīn nián kuài lè” jǐ gè dà zì tiē zài le hēi bǎnshàng.","vi":"Chúng tôi xếp các bàn thành một vòng tròn lớn. Edward dán dòng chữ lớn “Giáng sinh – Chúc mừng năm mới” lên bảng đen."},{"id":"r0494","page":51,"kind":"content","cn":"李美英说，晚会上她要和几个同学唱歌、跳舞，所以把音响也搬到教室里来了。","py":"lǐ měi yīng shuō， wǎn huì shàng tā yào hé jǐ gè tóng xué chàng gē, tiào wǔ， suǒ yǐ bǎ yīn xiǎng yě bāndào jiào shì lǐ lái le.","vi":"Lý Mỹ Anh nói rằng tại buổi liên hoan cô ấy sẽ hát và nhảy cùng một vài bạn học, vì thế cô ấy cũng chuyển thiết bị âm thanh vào lớp."},{"id":"r0495","page":51,"kind":"content","cn":"爱德华昨天从商店买回来一棵圣诞树，我们把它摆在了教室的前边，用彩灯和彩带把它装饰得非常漂亮。","py":"ài dé huá zuótiān cóng shāng diàn mǎi huí lái yī kē shèng dàn shù， wǒ men bǎ tā bǎi zài le jiào shì de qián biān， yòngcǎi dēnghé cǎi dài bǎ tā zhuāng shì dé fēi cháng piào liàng.","vi":"Hôm qua Edward mua về một cây thông Giáng sinh từ cửa hàng. Chúng tôi đặt nó ở phía trước lớp, trang trí rất đẹp bằng đèn màu và những dải ruy băng."},{"id":"r0496","page":51,"kind":"content","cn":"安娜是我们班最小的同学，她的生日正好是十二月二十五号，所以同学们还为她准备了一份生日礼物和一个生日蛋糕。","py":"ān nà shìwǒ men bānzuì xiǎo de tóng xué， tā de shēng rì zhèng hǎo shìshí èr yuè èr shí wǔ hào， suǒ yǐ tóng xué men hái wèi tā zhǔn bèi le yī fèn shēng rì lǐwùhé yī gè shēng rì dàn gāo.","vi":"Anna là bạn nhỏ tuổi nhất lớp; sinh nhật của cô ấy đúng ngày 25 tháng 12, vì vậy các bạn đã chuẩn bị cả quà sinh nhật lẫn bánh sinh nhật cho cô ấy."},{"id":"r0497","page":51,"kind":"content","cn":"但是我们还没把这事告诉她，我们想，到晚会上再把生日礼物拿出来送给她，给她一个惊喜，让她在中国过一个快乐的生日。","py":"dàn shìwǒ men hái méi bǎ zhè shì gào sù tā， wǒ men xiǎng， dào wǎn huì shàng zài bǎ shēng rì lǐwùnáchū lái sòng gěi tā， gěi tā yī gè jīng xǐ， ràng tā zài zhōng guó guò yī gè kuài lè de shēng rì.","vi":"Nhưng chúng tôi vẫn chưa nói cho Anna biết. Chúng tôi định tới buổi liên hoan mới mang quà ra tặng, tạo bất ngờ để cô ấy có một sinh nhật vui vẻ tại Trung Quốc."},{"id":"r0498","page":52,"kind":"content","cn":"我们把教室布置好以后，请老师来看了看，老师高兴地说：“你们把教室布置得真漂亮！”","py":"wǒ men bǎ jiào shì bù zhìhǎo yǐ hòu， qǐng lǎo shī lái kàn le kàn， lǎo shī gāo xìng de shuō：“nǐ men bǎ jiào shì bù zhìdé zhēn piào liàng！”","vi":"Sau khi trang trí lớp xong, chúng tôi mời giáo viên đến xem. Thầy/cô vui vẻ nói: “Các em trang trí lớp đẹp thật đấy!”"},{"id":"r0499","page":52,"kind":"content","cn":"为了开好这个联欢会，同学们都认真地做了准备。","py":"wèi le kāi hǎo zhè gè lián huān huì， tóng xué men dōu rèn zhēn de zuò le zhǔn bèi.","vi":"Để tổ chức thật tốt buổi liên hoan này, tất cả học sinh đều chuẩn bị rất nghiêm túc."},{"id":"r0500","page":52,"kind":"content","cn":"明天晚上六点钟，我们的晚会就要开始了，欢迎大家来参加。","py":"míng tiān wǎn shàng liù diǎnzhōng， wǒ men de wǎn huì jiù yào kāi shǐ le， huān yíng dà jiā lái cān jiā.","vi":"Buổi liên hoan sẽ bắt đầu lúc 6 giờ tối ngày mai, rất hoan nghênh mọi người đến tham dự."},{"id":"r0501","page":53,"kind":"prompt","cn":"读课文并回答下面的问题。","py":"dú kè wén bìng huí dá xià miàn de wèn tí.","vi":"Đọc bài khóa và trả lời các câu hỏi sau."},{"id":"r0502","page":53,"kind":"note","vi":"Câu 1"},{"id":"r0503","page":53,"kind":"prompt","cn":"圣诞节和新年快到了，他们班准备干什么？联欢晚会有什么活动？","py":"shèng dàn jié hé xīn nián kuài dào le， tā men bānzhǔn bèi gàn shén me？ lián huān wǎn huì yǒu shén me huódòng？","vi":"Giáng sinh và năm mới sắp đến, lớp họ định làm gì? Buổi liên hoan có hoạt động gì?"},{"id":"r0504","page":53,"kind":"answer","cn":"他们打算举行一个联欢晚会。活动有：唱中文歌、用汉语讲故事、表演节目、品尝各国的特色菜。","py":"tā men dǎ suàn jǔ xíng yī gè lián huān wǎn huì. huódòng yǒu： chàng zhōng wén gē, yònghàn yǔ jiǎng gù shì, biǎo yǎn jié mù, pǐn cháng gè guó de tèsè cài.","vi":"Họ định tổ chức liên hoan, hát tiếng Trung, kể chuyện bằng tiếng Hán, biểu diễn và thưởng thức món ăn đặc trưng các nước.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0505","page":53,"kind":"note","vi":"Câu 2"},{"id":"r0506","page":53,"kind":"prompt","cn":"玛丽有什么建议？","py":"mǎ lì yǒu shén me jiàn yì？","vi":"Mary đề xuất gì?"},{"id":"r0507","page":53,"kind":"answer","cn":"玛丽建议借一个大教室，把它布置成会场。","py":"mǎ lì jiàn yì jiè yī gè dà jiào shì， bǎ tā bù zhìchéng huì chǎng.","vi":"Cô ấy đề nghị mượn một lớp lớn và bố trí thành hội trường.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0508","page":53,"kind":"note","vi":"Câu 3"},{"id":"r0509","page":53,"kind":"prompt","cn":"李美英为什么要把音响搬到教室里来？","py":"lǐ měi yīng wèi shén me yào bǎ yīn xiǎng bāndào jiào shì lǐ lái？","vi":"Vì sao Lý Mỹ Anh chuyển loa vào phòng?"},{"id":"r0510","page":53,"kind":"answer","cn":"因为她要和几个同学唱歌、跳舞。","py":"yīn wèi tā yào hé jǐ gè tóng xué chàng gē, tiào wǔ.","vi":"Vì cô ấy sẽ hát, nhảy cùng một vài bạn.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0511","page":53,"kind":"note","vi":"Câu 4"},{"id":"r0512","page":53,"kind":"prompt","cn":"爱德华买了什么树？他们怎么装饰那棵树的？","py":"ài dé huá mǎi le shén me shù？ tā men zěn me zhuāng shì nà kē shù de？","vi":"Edward mua cây gì? Họ trang trí thế nào?"},{"id":"r0513","page":53,"kind":"answer","cn":"爱德华买了一棵圣诞树。他们把它摆在教室前边，用彩灯和彩带把它装饰得很漂亮。","py":"ài dé huá mǎi le yī kē shèng dàn shù. tā men bǎ tā bǎi zài jiào shì qián biān， yòngcǎi dēnghé cǎi dài bǎ tā zhuāng shì dé hěn piào liàng.","vi":"Anh ấy mua cây thông Noel, họ đặt trước lớp rồi trang trí bằng đèn màu và ruy băng.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0514","page":54,"kind":"note","vi":"Câu 5"},{"id":"r0515","page":54,"kind":"prompt","cn":"安娜的生日是几月几号？他们打算给她什么惊喜？","py":"ān nà de shēng rì shìjǐ yuè jǐ hào？ tā men dǎ suàn gěi tā shén me jīng xǐ？","vi":"Sinh nhật Anna ngày mấy? Mọi người định gây bất ngờ gì?"},{"id":"r0516","page":54,"kind":"answer","cn":"安娜的生日是十二月二十五号。同学们给她准备了一份生日礼物和一个蛋糕，打算在晚会上送给她。","py":"ān nà de shēng rì shìshí èr yuè èr shí wǔ hào. tóng xué men gěi tā zhǔn bèi le yī fèn shēng rì lǐwùhé yī gè dàn gāo， dǎ suàn zài wǎn huì shàng sòng gěi tā.","vi":"Ngày 25/12; các bạn định tặng quà và bánh sinh nhật ở buổi liên hoan.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0517","page":54,"kind":"note","vi":"Câu 6"},{"id":"r0518","page":54,"kind":"prompt","cn":"老师觉得他们布置得怎么样？","py":"lǎo shī jué de tā men bù zhìdé zěn me yàng？","vi":"Giáo viên thấy họ trang trí thế nào?"},{"id":"r0519","page":54,"kind":"answer","cn":"老师觉得他们把教室布置得真漂亮。","py":"lǎo shī jué de tā men bǎ jiào shì bù zhìdé zhēn piào liàng.","vi":"Thầy/cô thấy lớp được trang trí rất đẹp.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0520","page":54,"kind":"note","vi":"Câu 7"},{"id":"r0521","page":54,"kind":"prompt","cn":"晚会几点开始？","py":"wǎn huì jǐ diǎnkāi shǐ？","vi":"Buổi liên hoan bắt đầu lúc mấy giờ?"},{"id":"r0522","page":54,"kind":"answer","cn":"晚会明天晚上六点钟开始。","py":"wǎn huì míng tiān wǎn shàng liù diǎnzhōng kāi shǐ.","vi":"6 giờ tối ngày mai.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0523","page":55,"kind":"content","cn":"（二）把对联贴在大门两边。","py":"（èr） bǎ duì lián tiē zài dà mén liǎng biān.","vi":"(II) Dán câu đối ở hai bên cửa chính."},{"id":"r0524","page":55,"kind":"content","cn":"（春节前，王老师和夫人高老师也在布置他们的家。）","py":"（chūn jié qián， wáng lǎo shī hé fū rén gāo lǎo shī yě zài bù zhìtā men de jiā.）","vi":"(Trước Tết, thầy Vương và vợ là cô Cao cũng đang trang trí nhà.)"},{"id":"r0525","page":55,"kind":"content","cn":"高老师：哎，这幅画挂在什么地方比较好？","py":"gāo lǎo shī： āi， zhè fú huàguà zài shén me de fāngbǐ jiào hǎo？","vi":"Cô Cao: Này, treo bức tranh này ở đâu thì đẹp hơn nhỉ?"},{"id":"r0526","page":55,"kind":"content","cn":"王老师：我想把它挂在中间。对了，小林还没把水仙花送来吧？","py":"wáng lǎo shī： wǒ xiǎng bǎ tā guà zài zhōng jiān. duì le， xiǎo lín hái méi bǎ shuǐ xiān huā sòng lái ba？","vi":"Thầy Vương: Tôi muốn treo nó ở giữa. À đúng rồi, Tiểu Lâm vẫn chưa mang hoa thủy tiên đến phải không?"},{"id":"r0527","page":55,"kind":"content","cn":"高老师：已经送来了，我把它摆在卧室里了。你来看，开得可好了。","py":"gāo lǎo shī： yǐ jīng sòng lái le， wǒ bǎ tā bǎi zài wò shì lǐ le. nǐ lái kàn， kāi dé kě hǎo le.","vi":"Cô Cao: Mang tới rồi, tôi đặt trong phòng ngủ. Ông đến xem đi, hoa nở đẹp lắm."},{"id":"r0528","page":55,"kind":"content","cn":"王老师：把它摆在客厅里比较好。我把“福”字贴在门上吧。","py":"wáng lǎo shī： bǎ tā bǎi zài kè tīng lǐ bǐ jiào hǎo. wǒ bǎ “fú” zì tiē zài mén shàng ba.","vi":"Thầy Vương: Đặt trong phòng khách thì đẹp hơn. Để tôi dán chữ “Phúc” lên cửa nhé."},{"id":"r0529","page":55,"kind":"content","cn":"高老师：把你写的对联也贴上去吧。","py":"gāo lǎo shī： bǎ nǐ xiě de duì lián yě tiē shàng qù ba.","vi":"Cô Cao: Dán cả đôi câu đối ông viết lên nữa đi."},{"id":"r0530","page":55,"kind":"content","cn":"（读对联）“新年新春吉祥，百行百业……”","py":"（dú duì lián）“xīn nián xīn chūn jí xiáng， bǎi háng bǎi yè……”","vi":"(Đọc câu đối): “Năm mới xuân mới cát tường, trăm ngành trăm nghề…”"},{"id":"r0531","page":55,"kind":"content","cn":"你是不是把“兴”字也写成“旺”字了？","py":"nǐ shìbù shìbǎ “xìng” zì yě xiě chéng “wàng” zì le？","vi":"Có phải ông đã viết nhầm chữ “兴” (hưng) thành chữ “旺” (vượng) rồi không?"},{"id":"r0532","page":55,"kind":"content","cn":"王老师：哦，可不是嘛，写错了。","py":"wáng lǎo shī： ó， kě bù shìma， xiě cuò le.","vi":"Thầy Vương: Ồ, đúng thật, tôi viết sai rồi."},{"id":"r0533","page":55,"kind":"content","cn":"应该是“新年新春吉祥，百行百业兴旺”。","py":"yīng gāi shì“xīn nián xīn chūn jí xiáng， bǎi háng bǎi yè xīng wàng”.","vi":"Phải là: “Tân niên tân xuân cát tường, bách hành bách nghiệp hưng vượng”."},{"id":"r0534","page":56,"kind":"note","vi":"Câu 1"},{"id":"r0535","page":56,"kind":"prompt","cn":"春节前，王老师和夫人要布置什么地方？","py":"chūn jié qián， wáng lǎo shī hé fū rén yào bù zhìshén me de fāng？","vi":"Trước Tết hai vợ chồng thầy Vương trang trí nơi nào?"},{"id":"r0536","page":56,"kind":"answer","cn":"春节前，王老师和夫人高老师要布置他们的家。","py":"chūn jié qián， wáng lǎo shī hé fū rén gāo lǎo shī yào bù zhìtā men de jiā.","vi":"Họ trang trí nhà mình.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0537","page":56,"kind":"note","vi":"Câu 2"},{"id":"r0538","page":56,"kind":"prompt","cn":"王老师想把那幅画挂在哪里？","py":"wáng lǎo shī xiǎng bǎ nà fú huàguà zài nǎ lǐ？","vi":"Thầy Vương muốn treo tranh ở đâu?"},{"id":"r0539","page":56,"kind":"answer","cn":"王老师想把那幅画挂在中间。","py":"wáng lǎo shī xiǎng bǎ nà fú huàguà zài zhōng jiān.","vi":"Ở chính giữa.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0540","page":56,"kind":"note","vi":"Câu 3"},{"id":"r0541","page":56,"kind":"prompt","cn":"高老师把水仙花摆在哪里？王老师觉得把水仙花摆在哪里好？","py":"gāo lǎo shī bǎ shuǐ xiān huā bǎi zài nǎ lǐ？ wáng lǎo shī jué de bǎ shuǐ xiān huā bǎi zài nǎ lǐ hǎo？","vi":"Cô Cao đặt hoa ở đâu? Thầy Vương thấy nên đặt ở đâu?"},{"id":"r0542","page":56,"kind":"answer","cn":"高老师把水仙花摆在卧室里。王老师觉得摆在客厅里比较好。","py":"gāo lǎo shī bǎ shuǐ xiān huā bǎi zài wò shì lǐ. wáng lǎo shī jué de bǎi zài kè tīng lǐ bǐ jiào hǎo.","vi":"Cô Cao đặt ở phòng ngủ; thầy Vương thấy phòng khách tốt hơn.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0543","page":56,"kind":"note","vi":"Câu 4"},{"id":"r0544","page":56,"kind":"prompt","cn":"他们打算在门上贴什么？","py":"tā men dǎ suàn zài mén shàng tiē shén me？","vi":"Họ định dán gì lên cửa?"},{"id":"r0545","page":56,"kind":"answer","cn":"他们打算在门上贴对联和“福”字。","py":"tā men dǎ suàn zài mén shàng tiē duì lián hé “fú” zì.","vi":"Câu đối và chữ Phúc.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0546","page":56,"kind":"note","vi":"Câu 5"},{"id":"r0547","page":56,"kind":"prompt","cn":"王老师把对联写错了什么字？","py":"wáng lǎo shī bǎ duì lián xiě cuò le shén me zì？","vi":"Thầy Vương viết nhầm chữ nào?"},{"id":"r0548","page":56,"kind":"answer","cn":"王老师把“兴”字写成了“旺”字。","py":"wáng lǎo shī bǎ “xìng” zì xiě chéng le “wàng” zì.","vi":"Viết chữ 兴 thành 旺.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0549","page":57,"kind":"content","cn":"（三）为什么把“福”字倒着贴在门上呢？","py":"（sān） wèi shén me bǎ “fú” zì dào zhe tiē zài mén shàng ne？","vi":"(III) Tại sao lại dán ngược chữ “Phúc” lên cửa?"},{"id":"r0550","page":57,"kind":"content","cn":"（麦克看见王老师家门上贴着对联，就问田芳……）","py":"（mài kè kàn jiàn wáng lǎo shī jiā mén shàng tiē zhe duì lián， jiù wèn tián fāng……）","vi":"(Mike thấy câu đối dán trên cửa nhà thầy Vương, liền hỏi Điền Phương…)"},{"id":"r0551","page":57,"kind":"content","cn":"麦克：田芳，这就是你说的对联吗？","py":"mài kè： tián fāng， zhè jiù shìnǐ shuō de duì lián ma？","vi":"Mike: Điền Phương, đây chính là câu đối mà bạn từng nói phải không?"},{"id":"r0552","page":57,"kind":"content","cn":"田芳：是啊。","py":"tián fāng： shìa.","vi":"Điền Phương: Đúng vậy."},{"id":"r0553","page":57,"kind":"content","cn":"麦克：门上这个字怎么念？","py":"mài kè： mén shàng zhè gè zì zěn me niàn？","vi":"Mike: Chữ này trên cửa đọc thế nào?"},{"id":"r0554","page":57,"kind":"content","cn":"田芳：你仔细看看，认识不认识？","py":"tián fāng： nǐ zǐ xì kàn kàn， rèn shí bù rèn shí？","vi":"Điền Phương: Bạn nhìn kỹ xem, có nhận ra không?"},{"id":"r0555","page":57,"kind":"content","cn":"麦克：没学过。","py":"mài kè： méi xué guò.","vi":"Mike: Tôi chưa học chữ này."},{"id":"r0556","page":57,"kind":"content","cn":"田芳：这不是幸福的“福”字吗？","py":"tián fāng： zhè bù shìxìng fú de “fú” zì ma？","vi":"Điền Phương: Đây chẳng phải chữ “Phúc” trong từ “hạnh phúc” sao?"},{"id":"r0557","page":57,"kind":"content","cn":"过春节的时候，差不多家家都贴“福”字。","py":"guò chūn jié de shí hou， chà bù duō jiā jiā dōu tiē “fú” zì.","vi":"Dịp Tết Nguyên đán, hầu như nhà nào cũng dán chữ “Phúc”."},{"id":"r0558","page":57,"kind":"content","cn":"麦克：这是幸福的“福”字？为什么把“福”字倒着贴在门上呢？","py":"mài kè： zhè shìxìng fú de “fú” zì？ wèi shén me bǎ “fú” zì dào zhe tiē zài mén shàng ne？","vi":"Mike: Đây là chữ “Phúc” trong “hạnh phúc” ư? Tại sao lại dán ngược lên cửa?"},{"id":"r0559","page":57,"kind":"content","cn":"田芳：这样，人们一看见就会说“福倒了”，听声音就是“福到了”。","py":"tián fāng： zhè yàng， rén men yī kàn jiàn jiù huì shuō “fú dào le”， tīng shēng yīn jiù shì“fú dào le”.","vi":"Điền Phương: Như vậy khi thấy, người ta sẽ nói “Phúc bị đảo ngược”, nghe đồng âm thành “Phúc đã đến”."},{"id":"r0560","page":57,"kind":"content","cn":"麦克：哦，那我也去买一些“福”字来，把它倒着贴在门上、床上、桌子上、椅子上、沙发上、冰箱上、洗衣机上、空调上……等着幸福来找我。","py":"mài kè： ó， nà wǒ yě qù mǎi yī xiē “fú” zì lái， bǎ tā dào zhe tiē zài mén shàng, chuáng shàng, zhuō zǐ shàng, yǐ zǐ shàng, shā fā shàng, bīng xiāng shàng, xǐ yī jīshàng, kōngdiào shàng……děng zhe xìng fú lái zhǎowǒ.","vi":"Mike: Ồ, thế tôi cũng đi mua một ít chữ “Phúc”, dán ngược trên cửa, giường, bàn, ghế, sofa, tủ lạnh, máy giặt, điều hòa… rồi chờ hạnh phúc tìm tới tôi."},{"id":"r0561","page":57,"kind":"note","vi":"Giải thích văn hóa: 倒 (dào, đảo ngược) đồng âm với 到 (dào, đến), vì vậy “福倒了” gợi âm “福到了”, mang ý nghĩa phúc lành đã tới."},{"id":"r0562","page":58,"kind":"note","vi":"Câu 1"},{"id":"r0563","page":58,"kind":"prompt","cn":"门上贴的是什么字？","py":"mén shàng tiē de shìshén me zì？","vi":"Dán chữ gì trên cửa?"},{"id":"r0564","page":58,"kind":"answer","cn":"门上贴的是“福”字。","py":"mén shàng tiē de shì“fú” zì.","vi":"Chữ Phúc.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0565","page":58,"kind":"note","vi":"Câu 2"},{"id":"r0566","page":58,"kind":"prompt","cn":"麦克为什么不会念门上贴的“福”字？","py":"mài kè wèi shén me bù huì niàn mén shàng tiē de “fú” zì？","vi":"Vì sao Mike không đọc được chữ Phúc trên cửa?"},{"id":"r0567","page":58,"kind":"answer","cn":"因为他没学过这个字，而且“福”字是倒着贴的。","py":"yīn wèi tā méi xué guò zhè gè zì， ér qiě “fú” zì shìdào zhe tiē de.","vi":"Vì anh ấy chưa học chữ này, lại thấy chữ bị dán ngược.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0568","page":58,"kind":"note","vi":"Câu 3"},{"id":"r0569","page":58,"kind":"prompt","cn":"为什么人们把“福”字倒着贴呢？","py":"wèi shén me rén men bǎ “fú” zì dào zhe tiē ne？","vi":"Vì sao người ta dán ngược chữ Phúc?"},{"id":"r0570","page":58,"kind":"answer","cn":"因为“福倒了”和“福到了”听起来一样，表示幸福和好运到了。","py":"yīn wèi “fú dào le” hé “fú dào le” tīng qǐ lái yī yàng， biǎo shìxìng fú hé hǎo yùn dào le.","vi":"Vì hai cụm “Phúc đảo” và “Phúc đến” đồng âm, biểu thị phúc lành đã đến.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0571","page":58,"kind":"note","vi":"Câu 4"},{"id":"r0572","page":58,"kind":"prompt","cn":"听田芳解释后麦克打算干什么？","py":"tīng tián fāng jiě shì hòu mài kè dǎ suàn gàn shén me？","vi":"Sau khi nghe giải thích, Mike định làm gì?"},{"id":"r0573","page":58,"kind":"answer","cn":"麦克打算买一些“福”字来，把它倒着贴在门上、床上、桌子上、椅子上、沙发上、冰箱上、洗衣机上和空调上。","py":"mài kè dǎ suàn mǎi yī xiē “fú” zì lái， bǎ tā dào zhe tiē zài mén shàng, chuáng shàng, zhuō zǐ shàng, yǐ zǐ shàng, shā fā shàng, bīng xiāng shàng, xǐ yī jīshàng hé kōngdiào shàng.","vi":"Mua chữ Phúc rồi dán ngược lên rất nhiều đồ vật trong nhà.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0574","page":59,"kind":"content","cn":"爸爸带着三岁的儿子坐火车去看奶奶。","py":"bàbàdài zhe sān suì de ér zǐ zuò huǒchē qù kàn nǎi nǎi.","vi":"Bố đưa con trai ba tuổi đi tàu hỏa thăm bà nội."},{"id":"r0575","page":59,"kind":"content","cn":"在火车上，儿子喜欢把头伸到窗外去。","py":"zài huǒchē shàng， ér zǐ xǐ huān bǎ tóu shēn dào chuāng wài qù.","vi":"Trên tàu, cậu bé thích thò đầu ra ngoài cửa sổ."},{"id":"r0576","page":59,"kind":"content","cn":"爸爸对他说：“儿子，小心点儿，别把头伸到窗外去。”","py":"bàbàduì tā shuō：“ér zǐ， xiǎo xīn diǎnér， bié bǎ tóu shēn dào chuāng wài qù.”","vi":"Bố nói: “Con trai, cẩn thận một chút, đừng thò đầu ra ngoài cửa sổ.”"},{"id":"r0577","page":59,"kind":"content","cn":"可是男孩不听爸爸的话，还是把头伸到窗外。","py":"kě shìnán hái bù tīng bàbàde huà， hái shìbǎ tóu shēn dào chuāng wài.","vi":"Nhưng cậu bé không nghe lời, vẫn cứ thò đầu ra ngoài."},{"id":"r0578","page":59,"kind":"content","cn":"这时爸爸悄悄地把儿子的帽子摘了下来，放在自己身后，然后对他说：“你看，风把你的帽子刮跑了。”","py":"zhè shí bàbàqiāo qiāo de bǎ ér zǐ de mào zǐ zhāi le xià lái， fàngzài zì jǐ shēn hòu， rán hòu duì tā shuō：“nǐ kàn， fēng bǎ nǐ de mào zǐ guā pǎo le.”","vi":"Lúc ấy, bố lặng lẽ tháo mũ của con đặt sau lưng mình rồi nói: “Con nhìn kìa, gió thổi bay mũ con rồi.”"},{"id":"r0579","page":59,"kind":"content","cn":"儿子急得哭了，哭着要他的帽子。","py":"ér zǐ jí dé kū le， kū zhe yào tā de mào zǐ.","vi":"Cậu bé cuống lên khóc, vừa khóc vừa đòi mũ."},{"id":"r0580","page":59,"kind":"content","cn":"爸爸说：“好，你对着窗口吹一口气，帽子就回来了。”","py":"bàbàshuō：“hǎo， nǐ duì zhe chuāng kǒu chuī yī kǒu qì， mào zǐ jiù huí lái le.”","vi":"Bố nói: “Được rồi, con thổi một hơi về phía cửa sổ thì chiếc mũ sẽ quay lại.”"},{"id":"r0581","page":59,"kind":"content","cn":"儿子就对着窗口吹了一口气，爸爸很快把帽子戴到他的头上。","py":"ér zǐ jiù duì zhe chuāng kǒu chuī le yī kǒu qì， bàbàhěn kuài bǎ mào zǐ dài dào tā de tóu shàng.","vi":"Cậu bé thổi một hơi về phía cửa sổ; bố nhanh chóng đội mũ lại lên đầu con."},{"id":"r0582","page":59,"kind":"content","cn":"儿子笑了，他想，这太有意思了，就一下子把爸爸的帽子摘了下来，扔到车窗外边去了，然后高兴地对爸爸说：“爸爸，快！现在该你吹气了。”","py":"ér zǐ xiào le， tā xiǎng， zhè tài yǒu yì si le， jiù yī xià zǐ bǎ bàbàde mào zǐ zhāi le xià lái， rēng dào chē chuāng wài biān qù le， rán hòu gāo xìng de duì bàbàshuō：“bàbà， kuài！ xiàn zài gāi nǐ chuī qì le.”","vi":"Cậu bé cười, nghĩ chuyện này thật thú vị. Thế là cậu tháo ngay mũ của bố, ném ra ngoài cửa sổ tàu, rồi vui vẻ nói: “Bố, nhanh lên! Bây giờ đến lượt bố thổi đấy!”"},{"id":"r0583","page":60,"kind":"note","vi":"Câu 1"},{"id":"r0584","page":60,"kind":"prompt","cn":"爸爸劝儿子什么？为什么？","py":"bàbàquàn ér zǐ shén me？ wèi shén me？","vi":"Bố khuyên con điều gì và tại sao?"},{"id":"r0585","page":60,"kind":"answer","cn":"爸爸劝儿子不要把头伸到窗外去，因为这样很危险。","py":"bàbàquàn ér zǐ bù yào bǎ tóu shēn dào chuāng wài qù， yīn wèi zhè yàng hěn wēi xiǎn.","vi":"Đừng thò đầu ra ngoài cửa sổ vì rất nguy hiểm.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0586","page":60,"kind":"note","vi":"Câu 2"},{"id":"r0587","page":60,"kind":"prompt","cn":"儿子听爸爸的话吗？","py":"ér zǐ tīng bàbàde huà ma？","vi":"Con có nghe lời bố không?"},{"id":"r0588","page":60,"kind":"answer","cn":"没有，儿子没有听爸爸的话，还是把头伸到窗外。","py":"méi yǒu， ér zǐ méi yǒu tīng bàbàde huà， hái shìbǎ tóu shēn dào chuāng wài.","vi":"Không, cậu bé vẫn thò đầu ra ngoài.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0589","page":60,"kind":"note","vi":"Câu 3"},{"id":"r0590","page":60,"kind":"prompt","cn":"为什么爸爸把儿子的帽子摘下来？结果呢？","py":"wèi shén me bàbàbǎ ér zǐ de mào zǐ zhāi xià lái？ jié guǒ ne？","vi":"Vì sao bố tháo mũ của con? Kết quả?"},{"id":"r0591","page":60,"kind":"answer","cn":"爸爸想让儿子不要把头伸到窗外，就悄悄地摘下他的帽子。结果儿子把爸爸的帽子扔到窗外了。","py":"bàbàxiǎng ràng ér zǐ bù yào bǎ tóu shēn dào chuāng wài， jiù qiāo qiāo de zhāi xià tā de mào zǐ. jié guǒ ér zǐ bǎ bàbàde mào zǐ rēng dào chuāng wài le.","vi":"Bố muốn dạy con không thò đầu ra ngoài; cuối cùng con lại ném mũ của bố ra ngoài.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0592","page":60,"kind":"note","vi":"Câu 4"},{"id":"r0593","page":60,"kind":"prompt","cn":"通过上面的短文可见儿子的性格怎么样？","py":"tōng guò shàng miàn de duǎnwén kě jiàn ér zǐ de xìng gézěn me yàng？","vi":"Qua truyện, tính cách đứa con thế nào?"},{"id":"r0594","page":60,"kind":"answer","cn":"儿子很调皮，也很天真。他相信吹一口气就能让帽子回来。","py":"ér zǐ hěn diào pí， yě hěn tiān zhēn. tā xiāngxìn chuī yī kǒu qì jiù néng ràng mào zǐ huí lái.","vi":"Tinh nghịch và ngây thơ, tin rằng thổi hơi là mũ sẽ quay lại.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0595","page":61,"kind":"content","cn":"第二部分：翻译","py":"dìèr bù fēn： fānyì","vi":"Phần thứ hai: Luyện dịch."},{"id":"r0596","page":62,"kind":"content","cn":"各","py":"gè","vi":"mỗi, từng, các","vocab":true},{"id":"r0597","page":62,"kind":"content","cn":"指在某个范围内的所有个体，用在名词或量词前。","py":"zhǐ zài mǒu gè fàn wéi nèi de suǒ yǒu gè tǐ， yòngzài míng cí huò liàng cí qián.","vi":"Chỉ tất cả các cá thể trong một phạm vi; đặt trước danh từ hoặc lượng từ."},{"id":"r0598","page":62,"kind":"content","cn":"请各位快上车，我们马上就要出发了。","py":"qǐng gè wèi kuài shàng chē， wǒ men mǎ shàng jiù yào chū fā le.","vi":"Mời mọi người lên xe nhanh, chúng ta sắp xuất phát rồi."},{"id":"r0599","page":62,"kind":"content","cn":"一点儿也不／没……","py":"yī diǎnér yě bù／méi……","vi":"Một chút cũng không…; hoàn toàn không…"},{"id":"r0600","page":62,"kind":"content","cn":"我对这个工作一点儿也不了解。","py":"wǒ duì zhè gè gōng zuò yī diǎnér yě bù le jiě.","vi":"Tôi hoàn toàn không hiểu gì về công việc này."},{"id":"r0601","page":62,"kind":"content","cn":"你说的这件事我一点儿也不知道。","py":"nǐ shuō de zhè jiàn shì wǒ yī diǎnér yě bù zhī dào.","vi":"Tôi hoàn toàn không biết chuyện bạn nói."},{"id":"r0602","page":63,"kind":"content","cn":"动词＋着＋动词＋着：表示一个动作正在进行时，另一个动作接着发生。","py":"dòng cí＋zhe＋dòng cí＋zhe： biǎo shìyī gè dòng zuò zhèng zài jìn xíng shí， lìng yī gè dòng zuò jiē zhe fā shēng.","vi":"Động từ + 着 + động từ + 着: Khi một hành động đang diễn ra thì có thêm sự việc xảy ra tiếp theo."},{"id":"r0603","page":63,"kind":"content","cn":"小孩子哭着笑着就睡着了。","py":"xiǎo hái zi kū zhe xiào zhe jiù shuì zhe le.","vi":"Đứa trẻ vừa khóc vừa cười rồi ngủ thiếp đi."},{"id":"r0604","page":63,"kind":"content","cn":"他说着说着突然笑了起来。","py":"tā shuō zhe shuō zhe tū rán xiào le qǐ lái.","vi":"Anh ấy đang nói thì đột nhiên bật cười."},{"id":"r0605","page":63,"kind":"content","cn":"用得着","py":"yòngdezháo","vi":"cần dùng đến, còn sử dụng được","vocab":true},{"id":"r0606","page":63,"kind":"content","cn":"需要，有用。否定式“用不着”，表示不需要，不用。","py":"xū yào， yǒu yòng. fǒu dìng shì “yòngbù zhe”， biǎo shìbù xū yào， bù yòng.","vi":"Có nhu cầu/còn có ích. Dạng phủ định 用不着 nghĩa là không cần, không phải dùng."},{"id":"r0607","page":63,"kind":"content","cn":"这些书我已经用不着了，如果你用得着的话就送给你吧。","py":"zhè xiē shū wǒ yǐ jīng yòngbù zhe le， rú guǒ nǐ yòngdé zhe de huà jiù sòng gěi nǐ ba.","vi":"Những quyển sách này tôi không cần nữa. Nếu bạn cần thì tôi tặng bạn."},{"id":"r0608","page":63,"kind":"content","cn":"家里太乱了，用不着的东西卖了吧。","py":"jiā lǐ tài luàn le， yòngbù zhe de dōng .","vi":"Ngày nào tôi cũng dùng máy tính, vì máy tính rất hữu ích cho học tập và công việc.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0730","page":75,"kind":"answer","cn":"首先，我用电脑学习汉语，比如看视频、听录音和查生词。","py":"shǒu xiān， wǒ yòngdiàn nǎo xué xí hàn yǔ， bǐ rú kàn shì pín, tīng lù yīn hé chá shēng cí.","vi":"Trước hết, tôi dùng máy tính học tiếng Trung, chẳng hạn xem video, nghe ghi âm và tra từ mới.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0731","page":75,"kind":"answer","cn":"如果遇到不认识的汉字，我就上网查一下，还会把重要的词写在本子上。","py":"rú guǒ yù dào bù rèn shí de hàn zì， wǒ jiù shàng wǎng chá yī xià， hái huì bǎ zhòng yào de cí xiě zài běnzǐ shàng.","vi":"Nếu gặp chữ Hán không biết, tôi lên mạng tra rồi viết từ quan trọng vào vở.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0732","page":75,"kind":"answer","cn":"其次，我也用电脑工作，写文章、做表格，还会做一些视频。","py":"qí cì， wǒ yě yòngdiàn nǎo gōng zuò， xiě wén zhāng, zuò biǎo gé， hái huì zuò yī xiē shì pín.","vi":"Tiếp theo, tôi cũng dùng máy tính làm việc, viết bài, làm bảng và dựng một số video.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0733","page":75,"kind":"answer","cn":"有时候，我会跟朋友在网上聊天，或者看看电影，听听音乐。","py":"yǒu shí hou， wǒ huì gēn péng you zài wǎng shàng liáo tiān， huò zhě kàn kàn diàn yǐng， tīng tīng yīn lè.","vi":"Đôi lúc tôi trò chuyện với bạn bè qua mạng, hoặc xem phim, nghe nhạc.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0734","page":75,"kind":"answer","cn":"但是，我觉得不能一直看电脑，因为对眼睛不好。","py":"dàn shì， wǒ jué de bù néng yī zhí kàn diàn nǎo， yīn wèi duì yǎnjīng bù hǎo.","vi":"Nhưng tôi nghĩ không nên nhìn máy tính liên tục vì không tốt cho mắt.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0735","page":75,"kind":"answer","cn":"所以我每天都会安排好时间，工作以后也要休息一下。","py":"suǒ yǐ wǒ měi tiān dōu huì ān pái hǎo shí jiān， gōng zuò yǐ hòu yě yào xiū xīyī xià.","vi":"Vì thế ngày nào tôi cũng sắp xếp thời gian hợp lý và nghỉ ngơi sau khi làm việc.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0736","page":75,"kind":"answer","cn":"总的来说，电脑让我的生活方便了很多。","py":"zǒngde lái shuō， diàn nǎo ràng wǒ de shēng huófāngbiàn le hěn duō.","vi":"Tóm lại, máy tính khiến cuộc sống của tôi thuận tiện hơn rất nhiều.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0737","page":76,"kind":"note","vi":"ĐỀ GỐC — Đoạn 1: Trong các ngày lễ ở Việt Nam, tôi thích nhất là Tết. Tết là thời gian để tất cả mọi người sum họp bên nhau. Mọi người sẽ được nghỉ khoảng một tuần, người lớn không phải đi làm, trẻ nhỏ cũng không phải đi học."},{"id":"r0738","page":76,"kind":"note","vi":"ĐỀ GỐC — Đoạn 2: Trước khi nghỉ Tết, người người nhà nhà đều đi chợ, đi siêu thị, chuẩn bị nhiều thứ và trang trí nhà cửa. Bố tôi thường trồng nhiều hoa ở trong sân. Mẹ cũng thường mua quần áo mới cho chúng tôi."},{"id":"r0739","page":76,"kind":"note","vi":"ĐỀ GỐC — Đoạn 3: Đường phố trang trí vô cùng đẹp. Ngày Tết, cả nhà cùng nhau đến nhà họ hàng chúc Tết, ăn cơm, nói chuyện. Trẻ con được nhận tiền mừng tuổi. Không khí vô cùng náo nhiệt."},{"id":"r0740","page":76,"kind":"content","cn":"团聚","py":"tuánjù","vi":"sum họp","vocab":true},{"id":"r0741","page":76,"kind":"content","cn":"拜年","py":"bàinián","vi":"chúc Tết","vocab":true},{"id":"r0742","page":76,"kind":"content","cn":"亲戚","py":"qīnqi","vi":"họ hàng","vocab":true},{"id":"r0743","page":76,"kind":"content","cn":"压岁钱","py":"yāsuìqián","vi":"tiền mừng tuổi/lì xì","vocab":true},{"id":"r0744","page":76,"kind":"note","vi":"Bản dịch đầy đủ — Đoạn 1"},{"id":"r0745","page":76,"kind":"answer","cn":"在越南的各种节日中，我最喜欢春节。","py":"zài yuè nán de gè zhǒng jié rì zhōng， wǒ zuì xǐ huān chūn jié.","vi":"Trong các ngày lễ ở Việt Nam, tôi thích Tết nhất.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0746","page":76,"kind":"answer","cn":"春节是大家团聚在一起的时候。","py":"chūn jié shìdà jiā tuán jù zài yī qǐ de shí hou.","vi":"Tết là thời gian mọi người sum họp bên nhau.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0747","page":76,"kind":"answer","cn":"人们一般可以休息一个星期左右，大人不用上班，小孩子也不用上学。","py":"rén men yī bān kě yǐ xiū xīyī gè xīng qī zuǒ yòu， dà rén bù yòngshàng bān， xiǎo hái zi yě bù yòngshàng xué.","vi":"Mọi người thường nghỉ khoảng một tuần; người lớn không đi làm, trẻ nhỏ không đi học.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0748","page":76,"kind":"note","vi":"Bản dịch đầy đủ — Đoạn 2"},{"id":"r0749","page":76,"kind":"answer","cn":"过春节以前，家家户户都去市场和超市买东西，准备很多东西，还把家里布置得很漂亮。","py":"guò chūn jié yǐ qián， jiā jiā hù hù dōu qù shì chǎng hé chāo shì mǎi dōng xi， zhǔn bèi hěn duō dōng xi， hái bǎ jiā lǐ bù zhìdé hěn piào liàng.","vi":"Trước Tết, nhà nhà đi chợ, siêu thị mua sắm, chuẩn bị nhiều thứ và trang trí nhà cửa rất đẹp.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0750","page":76,"kind":"answer","cn":"爸爸常常在院子里种很多花。","py":"bàbàcháng cháng zài yuàn zǐ lǐ zhǒng hěn duō huā.","vi":"Bố thường trồng nhiều hoa trong sân.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0751","page":76,"kind":"answer","cn":"妈妈也常常给我们买新衣服。","py":"mā mā yě cháng cháng gěi wǒ men mǎi xīn yī fú.","vi":"Mẹ cũng thường mua quần áo mới cho chúng tôi.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0752","page":76,"kind":"note","vi":"Bản dịch đầy đủ — Đoạn 3"},{"id":"r0753","page":76,"kind":"answer","cn":"街道上也布置得非常漂亮。","py":"jiē dào shàng yě bù zhìdé fēi cháng piào liàng.","vi":"Đường phố cũng được trang trí rất đẹp.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0754","page":76,"kind":"answer","cn":"春节的时候，我们一家人一起去亲戚家拜年、吃饭、聊天。","py":"chūn jié de shí hou， wǒ men yī jiā rén yī qǐ qù qīn qī jiā bài nián, chī fàn, liáo tiān.","vi":"Ngày Tết, cả gia đình đến thăm họ hàng chúc Tết, ăn cơm và trò chuyện.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0755","page":76,"kind":"answer","cn":"孩子们可以收到压岁钱。","py":"hái zǐ men kě yǐ shōu dào yā suì qián.","vi":"Trẻ con có thể nhận tiền mừng tuổi.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0756","page":76,"kind":"answer","cn":"到处都非常热闹。","py":"dào chù dōu fēi cháng rènào.","vi":"Khắp nơi đều vô cùng náo nhiệt.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0757","page":77,"kind":"prompt","cn":"回答问题后，叙述课文一。","py":"huí dá wèn tí hòu， xù shù kè wén yī.","vi":"Sau khi trả lời câu hỏi, hãy kể lại bài khóa 1."},{"id":"r0758","page":77,"kind":"note","vi":"Các ý gốc: Giáng sinh + năm mới → tiệc liên hoan và hoạt động; mượn lớp → hội trường; Lý Mỹ Anh → loa; Edward → cây thông, đèn màu, ruy băng và chữ dán; sinh nhật Anna → bất ngờ; thầy/cô nhận xét; 6 giờ."},{"id":"r0759","page":77,"kind":"note","vi":"Bài kể lại mẫu, đúng thứ tự gợi ý"},{"id":"r0760","page":77,"kind":"answer","cn":"圣诞节和新年快到了，我们班准备举行一个联欢晚会。","py":"shèng dàn jié hé xīn nián kuài dào le， wǒ men bānzhǔn bèi jǔ xíng yī gè lián huān wǎn huì.","vi":"Giáng sinh và năm mới sắp đến, lớp chúng tôi chuẩn bị tổ chức liên hoan.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0761","page":77,"kind":"answer","cn":"晚会上，我们要唱中文歌、讲故事、表演节目，还要品尝各国特色菜。","py":"wǎn huì shàng， wǒ men yào chàng zhōng wén gē, jiǎng gù shì, biǎo yǎn jié mù， hái yào pǐn cháng gè guó tèsè cài.","vi":"Trong buổi liên hoan, chúng tôi hát tiếng Trung, kể chuyện, biểu diễn và thưởng thức các món đặc trưng của nhiều nước.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0762","page":77,"kind":"answer","cn":"玛丽建议借一个大教室，把它布置成会场。","py":"mǎ lì jiàn yì jiè yī gè dà jiào shì， bǎ tā bù zhìchéng huì chǎng.","vi":"Mary đề nghị mượn một lớp học lớn để biến thành hội trường.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0763","page":77,"kind":"answer","cn":"李美英要唱歌和跳舞，所以把音响搬到了教室。","py":"lǐ měi yīng yào chàng gē hé tiào wǔ， suǒ yǐ bǎ yīn xiǎng bāndào le jiào shì.","vi":"Lý Mỹ Anh muốn hát và nhảy, nên chuyển loa vào lớp.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0764","page":77,"kind":"answer","cn":"爱德华买了一棵圣诞树，我们用彩灯和彩带装饰它，还在黑板上贴了“圣诞——新年快乐”。","py":"ài dé huá mǎi le yī kē shèng dàn shù， wǒ men yòngcǎi dēnghé cǎi dài zhuāng shì tā， hái zài hēi bǎnshàng tiē le “shèng dàn——xīn nián kuài lè”.","vi":"Edward mua cây thông Noel, chúng tôi dùng đèn màu, ruy băng để trang trí, đồng thời dán chữ Giáng sinh – Chúc mừng năm mới lên bảng.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0765","page":77,"kind":"answer","cn":"十二月二十五号也是安娜的生日，我们准备送给她礼物和蛋糕，给她一个惊喜。","py":"shí èr yuè èr shí wǔ hào yě shìān nà de shēng rì， wǒ men zhǔn bèi sòng gěi tā lǐwùhé dàn gāo， gěi tā yī gè jīng xǐ.","vi":"Ngày 25/12 cũng là sinh nhật Anna, chúng tôi chuẩn bị quà, bánh sinh nhật để tạo bất ngờ.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0766","page":77,"kind":"answer","cn":"老师来看了以后，说我们把教室布置得真漂亮。","py":"lǎo shī lái kàn le yǐ hòu， shuō wǒ men bǎ jiào shì bù zhìdé zhēn piào liàng.","vi":"Sau khi xem, thầy/cô khen chúng tôi trang trí lớp thật đẹp.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0767","page":77,"kind":"answer","cn":"晚会明天晚上六点开始。","py":"wǎn huì míng tiān wǎn shàng liù diǎnkāi shǐ.","vi":"Buổi liên hoan bắt đầu lúc 6 giờ tối ngày mai.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0768","page":78,"kind":"prompt","cn":"回答问题后，叙述课文二。","py":"huí dá wèn tí hòu， xù shù kè wén èr.","vi":"Sau khi trả lời câu hỏi, kể lại bài khóa 2."},{"id":"r0769","page":78,"kind":"note","vi":"Các ý gốc: Trước Tết, vợ chồng thầy Vương trang trí nhà; bức tranh → giữa; hoa thủy tiên → phòng ngủ rồi cân nhắc phòng khách; chữ Phúc → cửa; câu đối “新年新春吉祥，百行百业兴旺” → cửa."},{"id":"r0770","page":78,"kind":"note","vi":"Bài kể lại mẫu, đúng thứ tự"},{"id":"r0771","page":78,"kind":"answer","cn":"春节快到了，王老师和夫人高老师在家里做准备。","py":"chūn jié kuài dào le， wáng lǎo shī hé fū rén gāo lǎo shī zài jiā lǐ zuò zhǔn bèi.","vi":"Tết sắp đến, thầy Vương và vợ là cô Cao chuẩn bị nhà cửa.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0772","page":78,"kind":"answer","cn":"高老师问一幅画挂在哪儿比较好，王老师想把它挂在中间。","py":"gāo lǎo shī wèn yī fú huàguà zài nǎ ér bǐ jiào hǎo， wáng lǎo shī xiǎng bǎ tā guà zài zhōng jiān.","vi":"Cô Cao hỏi treo tranh ở đâu đẹp; thầy Vương muốn treo ở giữa.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0773","page":78,"kind":"answer","cn":"小林把水仙花送来了，高老师把花摆在卧室里，王老师觉得摆在客厅里更好。","py":"xiǎo lín bǎ shuǐ xiān huā sòng lái le， gāo lǎo shī bǎ huā bǎi zài wò shì lǐ， wáng lǎo shī jué de bǎi zài kè tīng lǐ gèng hǎo.","vi":"Tiểu Lâm đã mang hoa thủy tiên tới. Cô Cao đặt trong phòng ngủ, còn thầy Vương thấy nên đặt phòng khách.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0774","page":78,"kind":"answer","cn":"王老师准备把“福”字贴在门上，高老师请他把对联也贴上去。","py":"wáng lǎo shī zhǔn bèi bǎ “fú” zì tiē zài mén shàng， gāo lǎo shī qǐng tā bǎ duì lián yě tiē shàng qù.","vi":"Thầy Vương chuẩn bị dán chữ Phúc lên cửa; cô Cao còn đề nghị dán cả câu đối.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0775","page":78,"kind":"answer","cn":"王老师一开始写错了一个字，后来改成了“新年新春吉祥，百行百业兴旺”。","py":"wáng lǎo shī yī kāi shǐ xiě cuò le yī gè zì， hòu lái gǎichéng le “xīn nián xīn chūn jí xiáng， bǎi háng bǎi yè xīng wàng”.","vi":"Ban đầu thầy Vương viết nhầm một chữ, sau đó sửa thành câu đối “Tân niên tân xuân cát tường, bách hành bách nghiệp hưng vượng”.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0776","page":79,"kind":"prompt","cn":"回答问题后，叙述课文三。","py":"huí dá wèn tí hòu， xù shù kè wén sān.","vi":"Sau khi trả lời câu hỏi, kể lại bài khóa 3."},{"id":"r0777","page":79,"kind":"note","vi":"Các ý gốc: Mike thắc mắc chữ trên cửa; chữ Phúc dán ngược → đồng âm nghe như “Phúc đến”; Mike mua chữ Phúc và dán lên các đồ vật."},{"id":"r0778","page":79,"kind":"note","vi":"Bài kể lại mẫu, đúng thứ tự"},{"id":"r0779","page":79,"kind":"answer","cn":"麦克看到王老师家门上的对联，还看到一个倒着贴的“福”字。","py":"mài kè kàn dào wáng lǎo shī jiā mén shàng de duì lián， hái kàn dào yī gè dào zhe tiē de “fú” zì.","vi":"Mike thấy câu đối và một chữ Phúc dán ngược trên cửa nhà thầy Vương.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0780","page":79,"kind":"answer","cn":"他不认识这个字，就问田芳怎么念。","py":"tā bù rèn shí zhè gè zì， jiù wèn tián fāng zěn me niàn.","vi":"Anh ấy không nhận ra chữ này nên hỏi Điền Phương cách đọc.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0781","page":79,"kind":"answer","cn":"田芳告诉他，这就是幸福的“福”字。","py":"tián fāng gào sù tā， zhè jiù shìxìng fú de “fú” zì.","vi":"Điền Phương bảo đây là chữ Phúc trong hạnh phúc.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0782","page":79,"kind":"answer","cn":"春节的时候，差不多家家都贴“福”字。","py":"chūn jié de shí hou， chà bù duō jiā jiā dōu tiē “fú” zì.","vi":"Dịp Tết, hầu như nhà nào cũng dán chữ Phúc.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0783","page":79,"kind":"answer","cn":"人们把“福”字倒着贴，是因为“福倒了”和“福到了”听起来一样，表示幸福到了。","py":"rén men bǎ “fú” zì dào zhe tiē， shìyīn wèi “fú dào le” hé “fú dào le” tīng qǐ lái yī yàng， biǎo shìxìng fú dào le.","vi":"Người ta dán ngược vì “Phúc đảo” nghe giống “Phúc đến”, tượng trưng hạnh phúc đã tới.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0784","page":79,"kind":"answer","cn":"麦克听了以后，打算买一些“福”字，倒着贴在门上、床上、桌子上、椅子上、沙发上、冰箱上、洗衣机上和空调上。","py":"mài kè tīng le yǐ hòu， dǎ suàn mǎi yī xiē “fú” zì， dào zhe tiē zài mén shàng, chuáng shàng, zhuō zǐ shàng, yǐ zǐ shàng, shā fā shàng, bīng xiāng shàng, xǐ yī jīshàng hé kōngdiào shàng.","vi":"Nghe xong, Mike định mua chữ Phúc để dán ngược trên cửa, giường, bàn, ghế, sofa, tủ lạnh, máy giặt và điều hòa.","label":"ĐÁP ÁN TÀI LIỆU"},{"id":"r0785","page":79,"kind":"answer","cn":"他希望幸福快点儿来找他。","py":"tā xī wàng xìng fú kuài diǎnér lái zhǎotā.","vi":"Anh ấy mong hạnh phúc sớm tìm đến mình.","label":"ĐÁP ÁN TÀI LIỆU"}],"vocab":[{"id":"v001","cn":"品尝","py":"pǐncháng","vi":"nếm, thưởng thức","page":4,"cat":"Từ vựng chính","recordId":"r0004"},{"id":"v002","cn":"特色","py":"tèsè","vi":"nét đặc sắc, đặc trưng","page":4,"cat":"Từ vựng chính","recordId":"r0005"},{"id":"v003","cn":"亲手","py":"qīnshǒu","vi":"đích thân, tự tay","page":4,"cat":"Từ vựng chính","recordId":"r0006"},{"id":"v004","cn":"最好","py":"zuì hǎo","vi":"tốt nhất (nên)","page":4,"cat":"Từ vựng chính","recordId":"r0007"},{"id":"v005","cn":"把","py":"bǎ","vi":"đem, lấy; giới từ trong câu chữ 把","page":4,"cat":"Từ vựng chính","recordId":"r0008"},{"id":"v006","cn":"它","py":"tā","vi":"nó (đồ vật/con vật)","page":4,"cat":"Từ vựng chính","recordId":"r0009"},{"id":"v007","cn":"布置","py":"bùzhì","vi":"bố trí, sắp xếp, trang trí","page":4,"cat":"Từ vựng chính","recordId":"r0010"},{"id":"v008","cn":"会场","py":"huìchǎng","vi":"hội trường; địa điểm tổ chức sự kiện","page":4,"cat":"Từ vựng chính","recordId":"r0011"},{"id":"v009","cn":"管理员","py":"guǎnlǐyuán","vi":"nhân viên quản lý","page":4,"cat":"Từ vựng chính","recordId":"r0012"},{"id":"v010","cn":"管理","py":"guǎnlǐ","vi":"quản lý","page":4,"cat":"Từ vựng chính","recordId":"r0013"},{"id":"v011","cn":"告诉","py":"gàosu","vi":"nói cho biết 要去住的房间，让服务员搬箱子到房间去。","promptPy":"nǐ zài lǚ guǎn， yào qù zhù de fángjiān， ràng fú wù yuán bānxiāng zǐ dào fángjiān qù.","promptVi":"Yêu cầu: dùng 把 nói theo tình huống.","answer":"请帮我把箱子搬到房间里去。","answerPy":"qǐng bāng wǒ bǎ xiāng zǐ bāndào fángjiān lǐ qù.","answerVi":"Bạn ở khách sạn, nhờ nhân viên: Làm ơn giúp tôi chuyển vali vào phòng.","answerLabel":"ĐÁP ÁN TỪ FILE","recordId":"r0469","answerRecordId":"r0470"},{"id":"e085","page":46,"type":"open","label":"Tình huống 4","prompt":"你想买一个手机，让营业员拿给你看看。","promptPy":"nǐ xiǎng mǎi yī gè shǒu jī， ràng yíng yè yuán nágěi nǐ kàn kàn.","promptVi":"Yêu cầu: dùng 把 nói theo tình huống.","answer":"请把那个手机拿给我看看。","answerPy":"qǐng bǎ nà gè shǒu jīnágěi wǒ kàn kàn.","answerVi":"Bạn muốn mua điện thoại: Phiền anh/chị đưa chiếc điện thoại kia cho tôi xem.","answerLabel":"ĐÁP ÁN TỪ FILE","recordId":"r0472","answerRecordId":"r0473"},{"id":"e086","page":46,"type":"open","label":"Tình huống 5","prompt":"玛丽要去医院看安娜，你想请玛丽带一束鲜花儿给她。","promptPy":"mǎ lì yào qù yī yuàn kàn ān nà， nǐ xiǎng qǐng mǎ lì dài yī shù xiān huā ér gěi tā.","promptVi":"Yêu cầu: dùng 把 nói theo tình huống.","answer":"玛丽，请你把这束鲜花带给安娜，好吗？","answerPy":"mǎ lì， qǐng nǐ bǎ zhè shù xiān huā dài gěi ān nà， hǎo ma？","answerVi":"Mary đến bệnh viện thăm Anna: Mary, bạn mang bó hoa này cho Anna giúp tôi nhé?","answerLabel":"ĐÁP ÁN TỪ FILE","recordId":"r0475","answerRecordId":"r0476"},{"id":"e087","page":46,"type":"open","label":"Tình huống 6","prompt":"在出租车里，你告诉司机在你的宿舍门口停车。","promptPy":"zài chū zū chē lǐ， nǐ gào sù sī jīzài nǐ de sù shě mén kǒu tíng chē.","promptVi":"Yêu cầu: dùng 把 nói theo tình huống.","answer":"师傅，请把车停在我宿舍门口。","answerPy":"shī fù， qǐng bǎ chē tíng zài wǒ sù shě mén kǒu.","answerVi":"Bạn đang đi taxi: Bác tài, xin hãy dừng xe ở cửa ký túc xá của tôi.","answerLabel":"ĐÁP ÁN TỪ FILE","recordId":"r0478","answerRecordId":"r0479"},{"id":"e088","page":53,"type":"open","label":"Câu 1","prompt":"圣诞节和新年快到了，他们班准备干什么？联欢晚会有什么活动？","promptPy":"shèng dàn jié hé xīn nián kuài dào le， tā men bānzhǔn bèi gàn shén me？ lián huān wǎn huì yǒu shén me huódòng？","promptVi":"Giáng sinh và năm mới sắp đến, lớp họ định làm gì? Buổi liên hoan có hoạt động gì?","answer":"他们打算举行一个联欢晚会。活动有：唱中文歌、用汉语讲故事、表演节目、品尝各国的特色菜。","answerPy":"tā men dǎ suàn jǔ xíng yī gè lián huān wǎn huì. huódòng yǒu： chàng zhōng wén gē, yònghàn yǔ jiǎng gù shì, biǎo yǎn jié mù, pǐn cháng gè guó de tèsè cài.","answerVi":"Họ định tổ chức liên hoan, hát tiếng Trung, kể chuyện bằng tiếng Hán, biểu diễn và thưởng thức món ăn đặc trưng các nước.","answerLabel":"ĐÁP ÁN TỪ FILE","recordId":"r0503","answerRecordId":"r0504"},{"id":"e089","page":53,"type":"open","label":"Câu 2","prompt":"玛丽有什么建议？","promptPy":"mǎ lì yǒu shén me jiàn yì？","promptVi":"Mary đề xuất gì?","answer":"玛丽建议借一个大教室，把它布置成会场。","answerPy":"mǎ lì jiàn yì jiè yī gè dà jiào shì， bǎ tā bù zhìchéng huì chǎng.","answerVi":"Cô ấy đề nghị mượn một lớp lớn và bố trí thành hội trường.","answerLabel":"ĐÁP ÁN TỪ FILE","recordId":"r0506","answerRecordId":"r0507"},{"id":"e090","page":53,"type":"open","label":"Câu 3","prompt":"李美英为什么要把音响搬到教室里来？","promptPy":"lǐ měi yīng wèi shén me yào bǎ yīn xiǎng bāndào jiào shì lǐ lái？","promptVi":"Vì sao Lý Mỹ Anh chuyển loa vào phòng?","answer":"因为她要和几个同学唱歌、跳舞。","answerPy":"yīn wèi tā yào hé jǐ gè tóng xué chàng gē, tiào wǔ.","answerVi":"Vì cô ấy sẽ hát, nhảy cùng một vài bạn.","answerLabel":"ĐÁP ÁN TỪ FILE","recordId":"r0509","answerRecordId":"r0510"},{"id":"e091","page":53,"type":"open","label":"Câu 4","prompt":"爱德华买了什么树？他们怎么装饰那棵树的？","promptPy":"ài dé huá mǎi le shén me shù？ tā men zěn me zhuāng shì nà kē shù de？","promptVi":"Edward mua cây gì? Họ trang trí thế nào?","answer":"爱德华买了一棵圣诞树。他们把它摆在教室前边，用彩灯和彩带把它装饰得很漂亮。","answerPy":"ài dé huá mǎi le yī kē shèng dàn shù. tā men bǎ tā bǎi zài jiào shì qián biān， yòngcǎi dēnghé cǎi dài bǎ tā zhuāng shì dé hěn piào liàng.","answerVi":"Anh ấy mua cây thông Noel, họ đặt trước lớp rồi trang trí bằng đèn màu và ruy băng.","answerLabel":"ĐÁP ÁN TỪ FILE","recordId":"r0512","answerRecordId":"r0513"},{"id":"e092","page":54,"type":"open","label":"Câu 5","prompt":"安娜的生日是几月几号？他们打算给她什么惊喜？","promptPy":"ān nà de shēng rì shìjǐ yuè jǐ hào？ tā men dǎ suàn gěi tā shén me jīng xǐ？","promptVi":"Sinh nhật Anna ngày mấy? Mọi người định gây bất ngờ gì?","answer":"安娜的生日是十二月二十五号。同学们给她准备了一份生日礼物和一个蛋糕，打算在晚会上送给她。","answerPy":"ān nà de shēng rì shìshí èr yuè èr shí wǔ hào. tóng xué men gěi tā zhǔn bèi le yī fèn shēng rì lǐwùhé yī gè dàn gāo， dǎ suàn zài wǎn huì shàng sòng gěi tā.","answerVi":"Ngày 25/12; các bạn định tặng quà và bánh sinh nhật ở buổi liên hoan.","answerLabel":"ĐÁP ÁN TỪ FILE","recordId":"r0515","answerRecordId":"r0516"},{"id":"e093","page":54,"type":"open","label":"Câu 6","prompt":"老师觉得他们布置得怎么样？","promptPy":"lǎo shī jué de tā men bù zhìdé zěn me yàng？","promptVi":"Giáo viên thấy họ trang trí thế nào?","answer":"老师觉得他们把教室布置得真漂亮。","answerPy":"lǎo shī jué de tā men bǎ jiào shì bù zhìdé zhēn piào liàng.","answerVi":"Thầy/cô thấy lớp được trang trí rất đẹp.","answerLabel":"ĐÁP ÁN TỪ FILE","recordId":"r0518","answerRecordId":"r0519"},{"id":"e094","page":54,"type":"open","label":"Câu 7","prompt":"晚会几点开始？","promptPy":"wǎn huì jǐ diǎnkāi shǐ？","promptVi":"Buổi liên hoan bắt đầu lúc mấy giờ?","answer":"晚会明天晚上六点钟开始。","answerPy":"wǎn huì míng tiān wǎn shàng liù diǎnzhōng kāi shǐ.","answerVi":"6 giờ tối ngày mai.","answerLabel":"ĐÁP ÁN TỪ FILE","recordId":"r0521","answerRecordId":"r0522"},{"id":"e095","page":56,"type":"open","label":"Câu 1","prompt":"春节前，王老师和夫人要布置什么地方？","promptPy":"chūn jié qián， wáng lǎo shī hé fū rén yào bù zhìshén me de fāng？","promptVi":"Trước Tết hai vợ chồng thầy Vương trang trí nơi nào?","answer":"春节前，王老师和夫人高老师要布置他们的家。","answerPy":"chūn jié qián， wáng lǎo shī hé fū rén gāo lǎo shī yào bù zhìtā men de jiā.","answerVi":"Họ trang trí nhà mình.","answerLabel":"ĐÁP ÁN TỪ FILE","recordId":"r0535","answerRecordId":"r0536"},{"id":"e096","page":56,"type":"open","label":"Câu 2","prompt":"王老师想把那幅画挂在哪里？","promptPy":"wáng lǎo shī xiǎng bǎ nà fú huàguà zài nǎ lǐ？","promptVi":"Thầy Vương muốn treo tranh ở đâu?","answer":"王老师想把那幅画挂在中间。","answerPy":"wáng lǎo shī xiǎng bǎ nà fú huàguà zài zhōng jiān.","answerVi":"Ở chính giữa.","answerLabel":"ĐÁP ÁN TỪ FILE","recordId":"r0538","answerRecordId":"r0539"},{"id":"e097","page":56,"type":"open","label":"Câu 3","prompt":"高老师把水仙花摆在哪里？王老师觉得把水仙花摆在哪里好？","promptPy":"gāo lǎo shī bǎ shuǐ xiān huā bǎi zài nǎ lǐ？ wáng lǎo shī jué de bǎ shuǐ xiān huā bǎi zài nǎ lǐ hǎo？","promptVi":"Cô Cao đặt hoa ở đâu? Thầy Vương thấy nên đặt ở đâu?","answer":"高老师把水仙花摆在卧室里。王老师觉得摆在客厅里比较好。","answerPy":"gāo lǎo shī bǎ shuǐ xiān huā bǎi zài wò shì lǐ. wáng lǎo shī jué de bǎi zài kè tīng lǐ bǐ jiào hǎo.","answerVi":"Cô Cao đặt ở phòng ngủ; thầy Vương thấy phòng khách tốt hơn.","answerLabel":"ĐÁP ÁN TỪ FILE","recordId":"r0541","answerRecordId":"r0542"},{"id":"e098","page":56,"type":"open","label":"Câu 4","prompt":"他们打算在门上贴什么？","promptPy":"tā men dǎ suàn zài mén shàng tiē shén me？","promptVi":"Họ định dán gì lên cửa?","answer":"他们打算在门上贴对联和“福”字。","answerPy":"tā men dǎ suàn zài mén shàng tiē duì lián hé “fú” zì.","answerVi":"Câu đối và chữ Phúc.","answerLabel":"ĐÁP ÁN TỪ FILE","recordId":"r0544","answerRecordId":"r0545"},{"id":"e099","page":56,"type":"open","label":"Câu 5","prompt":"王老师把对联写错了什么字？","promptPy":"wáng lǎo shī bǎ duì lián xiě cuò le shén me zì？","promptVi":"Thầy Vương viết nhầm chữ nào?","answer":"王老师把“兴”字写成了“旺”字。","answerPy":"wáng lǎo shī bǎ “xìng” zì xiě chéng le “wàng” zì.","answerVi":"Viết chữ 兴 thành 旺.","answerLabel":"ĐÁP ÁN TỪ FILE","recordId":"r0547","answerRecordId":"r0548"},{"id":"e100","page":58,"type":"open","label":"Câu 1","prompt":"门上贴的是什么字？","promptPy":"mén shàng tiē de shìshén me zì？","promptVi":"Dán chữ gì trên cửa?","answer":"门上贴的是“福”字。","answerPy":"mén shàng tiē de shì“fú” zì.","answerVi":"Chữ Phúc.","answerLabel":"ĐÁP ÁN TỪ FILE","recordId":"r0563","answerRecordId":"r0564"},{"id":"e101","page":58,"type":"open","label":"Câu 2","prompt":"麦克为什么不会念门上贴的“福”字？","promptPy":"mài kè wèi shén me bù huì niàn mén shàng tiē de “fú” zì？","promptVi":"Vì sao Mike không đọc được chữ Phúc trên cửa?","answer":"因为他没学过这个字，而且“福”字是倒着贴的。","answerPy":"yīn wèi tā méi xué guò zhè gè zì， ér qiě “fú” zì shìdào zhe tiē de.","answerVi":"Vì anh ấy chưa học chữ này, lại thấy chữ bị dán ngược.","answerLabel":"ĐÁP ÁN TỪ FILE","recordId":"r0566","answerRecordId":"r0567"},{"id":"e102","page":58,"type":"open","label":"Câu 3","prompt":"为什么人们把“福”字倒着贴呢？","promptPy":"wèi shén me rén men bǎ “fú” zì dào zhe tiē ne？","promptVi":"Vì sao người ta dán ngược chữ Phúc?","answer":"因为“福倒了”和“福到了”听起来一样，表示幸福和好运到了。","answerPy":"yīn wèi “fú dào le” hé “fú dào le” tīng qǐ lái yī yàng， biǎo shìxìng fú hé hǎo yùn dào le.","answerVi":"Vì hai cụm “Phúc đảo” và “Phúc đến” đồng âm, biểu thị phúc lành đã đến.","answerLabel":"ĐÁP ÁN TỪ FILE","recordId":"r0569","answerRecordId":"r0570"},{"id":"e103","page":58,"type":"open","label":"Câu 4","prompt":"听田芳解释后麦克打算干什么？","promptPy":"tīng tián fāng jiě shì hòu mài kè dǎ suàn gàn shén me？","promptVi":"Sau khi nghe giải thích, Mike định làm gì?","answer":"麦克打算买一些“福”字来，把它倒着贴在门上、床上、桌子上、椅子上、沙发上、冰箱上、洗衣机上和空调上。","answerPy":"mài kè dǎ suàn mǎi yī xiē “fú” zì lái， bǎ tā dào zhe tiē zài mén shàng, chuáng shàng, zhuō zǐ shàng, yǐ zǐ shàng, shā fā shàng, bīng xiāng shàng, xǐ yī jīshàng hé kōngdiào shàng.","answerVi":"Mua chữ Phúc rồi dán ngược lên rất nhiều đồ vật trong nhà.","answerLabel":"ĐÁP ÁN TỪ FILE","recordId":"r0572","answerRecordId":"r0573"},{"id":"e104","page":60,"type":"open","label":"Câu 1","prompt":"爸爸劝儿子什么？为什么？","promptPy":"bàbàquàn ér zǐ shén me？ wèi shén me？","promptVi":"Bố khuyên con điều gì và tại sao?","answer":"爸爸劝儿子不要把头伸到窗外去，因为这样很危险。","answerPy":"bàbàquàn ér zǐ bù yào bǎ tóu shēn dào chuāng wài qù， yīn wèi zhè yàng hěn wēi xiǎn.","answerVi":"Đừng thò đầu ra ngoài cửa sổ vì rất nguy hiểm.","answerLabel":"ĐÁP ÁN TỪ FILE","recordId":"r0584","answerRecordId":"r0585"},{"id":"e105","page":60,"type":"open","label":"Câu 2","prompt":"儿子听爸爸的话吗？","promptPy":"ér zǐ tīng bàbàde huà ma？","promptVi":"Con có nghe lời bố không?","answer":"没有，儿子没有听爸爸的话，还是把头伸到窗外。","answerPy":"méi yǒu， ér zǐ méi yǒu tīng bàbàde huà， hái shìbǎ tóu shēn dào chuāng wài.","answerVi":"Không, cậu bé vẫn thò đầu ra ngoài.","answerLabel":"ĐÁP ÁN TỪ FILE","recordId":"r0587","answerRecordId":"r0588"},{"id":"e106","page":60,"type":"open","label":"Câu 3","prompt":"为什么爸爸把儿子的帽子摘下来？结果呢？","promptPy":"wèi shén me bàbàbǎ ér zǐ de mào zǐ zhāi xià lái？ jié guǒ ne？","promptVi":"Vì sao bố tháo mũ của con? Kết quả?","answer":"爸爸想让儿子不要把头伸到窗外，就悄悄地摘下他的帽子。结果儿子把爸爸的帽子扔到窗外了。","answerPy":"bàbàxiǎng ràng ér zǐ bù yào bǎ tóu shēn dào chuāng wài， jiù qiāo qiāo de zhāi xià tā de mào zǐ. jié guǒ ér zǐ bǎ bàbàde mào zǐ rēng dào chuāng wài le.","answerVi":"Bố muốn dạy con không thò đầu ra ngoài; cuối cùng con lại ném mũ của bố ra ngoài.","answerLabel":"ĐÁP ÁN TỪ FILE","recordId":"r0590","answerRecordId":"r0591"},{"id":"e107","page":60,"type":"open","label":"Câu 4","prompt":"通过上面的短文可见儿子的性格怎么样？","promptPy":"tōng guò shàng miàn de duǎnwén kě jiàn ér zǐ de xìng gézěn me yàng？","promptVi":"Qua truyện, tính cách đứa con thế nào?","answer":"儿子很调皮，也很天真。他相信吹一口气就能让帽子回来。","answerPy":"ér zǐ hěn diào pí， yě hěn tiān zhēn. tā xiāngxìn chuī yī kǒu qì jiù néng ràng mào zǐ huí lái.","answerVi":"Tinh nghịch và ngây thơ, tin rằng thổi hơi là mũ sẽ quay lại.","answerLabel":"ĐÁP ÁN TỪ FILE","recordId":"r0593","answerRecordId":"r0594"},{"id":"e113","page":65,"type":"open","label":"Bài dịch đoạn văn","prompt":"Đoạn 1: Cuối tuần trước, tôi dọn dẹp phòng. Trong phòng có mỗi thứ một ít, quần áo, sách và đồ dùng đều để lung tung. Tôi hoàn toàn không muốn vứt đồ đi, vì có một số thứ sau này vẫn dùng đến.\n\nĐoạn 2: Tôi vừa dọn một lúc thì tìm thấy chiếc điện thoại cũ đã mất từ lâu. Không ngờ, nó vẫn dùng được. Tôi nghĩ còn về chiếc điện thoại này, có lẽ tôi nên giữ lại. Vừa sạc điện thoại, tôi vừa dọn tiếp, cuối cùng mất cả buổi sáng mới xong.","promptPy":"","promptVi":"Đoạn 1: Cuối tuần trước, tôi dọn dẹp phòng. Trong phòng có mỗi thứ một ít, quần áo, sách và đồ dùng đều để lung tung. Tôi hoàn toàn không muốn vứt đồ đi, vì có một số thứ sau này vẫn dùng đến.\n\nĐoạn 2: Tôi vừa dọn một lúc thì tìm thấy chiếc điện thoại cũ đã mất từ lâu. Không ngờ, nó vẫn dùng được. Tôi nghĩ còn về chiếc điện thoại này, có lẽ tôi nên giữ lại. Vừa sạc điện thoại, tôi vừa dọn tiếp, cuối cùng mất cả buổi sáng mới xong.","answer":"上个周末，我收拾房间。\n房间里各种东西都有一点儿，衣服、书和生活用品都放得乱七八糟。\n我一点儿也不想把东西扔掉，因为有些东西以后还用得着。\n我收拾着收拾着，找到了一个丢了很久的旧手机。\n不料，它还可以用。\n我想，至于这个手机，我可能还是应该留着。\n一边给手机充电，一边继续收拾，最后花了一个上午才收拾完。","answerPy":"shàng gè zhōu mò， wǒ shōu shífángjiān.\nfángjiān lǐ gè zhǒng dōng xi dōu yǒu yī diǎnér， yī fú, shū hé shēng huóyòngpǐn dōu fàngdé luàn qī bā zāo.\nwǒ yī diǎnér yě bù xiǎng bǎ dōng xi rēng diào， yīn wèi yǒu xiē dōng xi yǐ hòu hái yòngdé zhe.\nwǒ shōu shízhe shōu shízhe， zhǎodào le yī gè diū le hěn jiǔ de jiù shǒu jī.\nbù liào， tā hái kě yǐ yòng.\nwǒ xiǎng， zhì yú zhè gè shǒu jī， wǒ kě néng hái shìyīng gāi liú zhe.\nyī biān gěi shǒu jīchōng diàn， yī biān jì xùshōu shí， zuì hòu huā le yī gè shàng wǔ cái shōu shíwán.","answerVi":"Cuối tuần trước tôi dọn phòng.\nTrong phòng thứ gì cũng có một ít; quần áo, sách và đồ sinh hoạt đều bày bừa lung tung.\nTôi hoàn toàn không muốn vứt đồ, vì một số thứ sau này vẫn còn dùng tới.\nTôi đang dọn dẹp thì tìm được chiếc điện thoại cũ đã mất lâu rồi.\nKhông ngờ nó vẫn dùng được.\nTôi nghĩ, riêng chiếc điện thoại này, có lẽ mình vẫn nên giữ lại.\nTôi vừa sạc điện thoại vừa tiếp tục dọn, cuối cùng mất cả buổi sáng mới xong.","answerLabel":"BẢN DỊCH MẪU","recordId":"r0622","answerRecordId":"r0622"},{"id":"e114","page":68,"type":"open","label":"Bài dịch đoạn văn","prompt":"ĐỀ GỐC — Đoạn 1: Sau khi tốt nghiệp, tôi bắt đầu đi tìm việc. Tôi chuẩn bị một bản sơ yếu lý lịch và nộp cho một công ty. Quy mô công ty không lớn nhưng sự cạnh tranh rất gay gắt vì có rất nhiều người muốn ứng tuyển. Tôi đã bỏ ra rất nhiều thời gian để chuẩn bị và quyết tâm cố gắng.\n\nĐỀ GỐC — Đoạn 2: Hôm qua, tôi đi xe điện đến công ty để phỏng vấn. Lúc đầu, tôi hơi căng thẳng, nhưng tôi cố gắng hít thở sâu để thả lỏng bản thân. Người phỏng vấn hỏi tôi rất nhiều câu hỏi về vấn đề hóa đơn của hàng hóa. Tôi cố gắng trả lời, thấy tôi phản ứng rất nhanh người phỏng vấn mỉm cười. Phỏng vấn xong, tôi nhìn lại và cảm thấy mình đã cố gắng hết sức và nhẹ nhõm hơn.\n\nĐỀ GỐC — Đoạn 3: Sau đó, tôi và một người bạn mới quen đi ăn ở một quán ăn gần công ty. Chúng tôi vừa ăn vừa nói chuyện, nói mãi mà vẫn chưa muốn về. Giả sử hôm nay không đi phỏng vấn, có lẽ chúng tôi đã không có một ngày đáng nhớ như vậy. Còn tương lai thế nào thì bây giờ chưa cần nghĩ đến.","promptPy":"","promptVi":"ĐỀ GỐC — Đoạn 1: Sau khi tốt nghiệp, tôi bắt đầu đi tìm việc. Tôi chuẩn bị một bản sơ yếu lý lịch và nộp cho một công ty. Quy mô công ty không lớn nhưng sự cạnh tranh rất gay gắt vì có rất nhiều người muốn ứng tuyển. Tôi đã bỏ ra rất nhiều thời gian để chuẩn bị và quyết tâm cố gắng.\n\nĐỀ GỐC — Đoạn 2: Hôm qua, tôi đi xe điện đến công ty để phỏng vấn. Lúc đầu, tôi hơi căng thẳng, nhưng tôi cố gắng hít thở sâu để thả lỏng bản thân. Người phỏng vấn hỏi tôi rất nhiều câu hỏi về vấn đề hóa đơn của hàng hóa. Tôi cố gắng trả lời, thấy tôi phản ứng rất nhanh người phỏng vấn mỉm cười. Phỏng vấn xong, tôi nhìn lại và cảm thấy mình đã cố gắng hết sức và nhẹ nhõm hơn.\n\nĐỀ GỐC — Đoạn 3: Sau đó, tôi và một người bạn mới quen đi ăn ở một quán ăn gần công ty. Chúng tôi vừa ăn vừa nói chuyện, nói mãi mà vẫn chưa muốn về. Giả sử hôm nay không đi phỏng vấn, có lẽ chúng tôi đã không có một ngày đáng nhớ như vậy. Còn tương lai thế nào thì bây giờ chưa cần nghĩ đến.","answer":"毕业以后，我开始找工作。\n我准备了一份简历，把它交给了一家公司。\n这家公司的规模不大，但是竞争很激烈，因为有很多人想来应聘。\n为了做好准备，我付出了很多时间，并下定决心努力奋斗。\n昨天，我坐电车去公司参加面试。\n刚开始我有点儿紧张，但是我努力深呼吸，让自己放松下来。\n面试官问了我很多关于商品发票的问题。\n我认真回答，他看到我反应很快，就笑了。\n面试结束后，我回顾了一下，觉得自己已经尽了最大的努力，也轻松多了。\n后来，我和一个刚认识的朋友去公司附近的一家饭馆吃饭。\n我们一边吃一边聊天，聊着聊着都不想回去了。\n假如今天没有来参加面试，也许我们就不会有这么难忘的一天。\n至于将来会怎么样，现在还用不着想。","answerPy":"bì yè yǐ hòu， wǒ kāi shǐ zhǎogōng zuò.\nwǒ zhǔn bèi le yī fèn jiǎn lì， bǎ tā jiāo gěi le yī jiā gōng sī.\nzhè jiā gōng sī de guī mó bù dà， dàn shìjìng zhēng hěn jī liè， yīn wèi yǒu hěn duō rén xiǎng lái yīng pìn.\nwèi le zuò hǎo zhǔn bèi， wǒ fù chū le hěn duō shí jiān， bìng xià dìng jué xīn nǔ lì fèn dòu.\nzuótiān， wǒ zuò diàn chē qù gōng sī cān jiā miàn shì.\ngāng kāi shǐ wǒ yǒu diǎnér jǐn zhāng， dàn shìwǒ nǔ lì shēn hū xī， ràng zì jǐ fàngsōngxià lái.\nmiàn shì guān wèn le wǒ hěn duō guān yú shāng pǐn fā piàode wèn tí.\nwǒ rèn zhēn huí dá， tā kàn dào wǒ fǎn yīng hěn kuài， jiù xiào le.\nmiàn shì jié shù hòu， wǒ huí gù le yī xià， jué de zì jǐ yǐ jīng jǐn le zuì dà de nǔ lì， yě qīng sōngduō le.\nhòu lái， wǒ hé yī gè gāng rèn shí de péng you qù gōng sī fù jìn de yī jiā fàn guǎn chī fàn.\nwǒ men yī biān chī yī biān liáo tiān， liáo zhe liáo zhe dōu bù xiǎng huí qù le.\njiǎ rú jīn tiān méi yǒu lái cān jiā miàn shì， yě xǔ wǒ men jiù bù huì yǒu zhè me nán wàng de yī tiān.\nzhì yú jiāng lái huì zěn me yàng， xiàn zài hái yòngbù zhe xiǎng.","answerVi":"Sau khi tốt nghiệp, tôi bắt đầu tìm việc.\nTôi chuẩn bị một bản CV rồi nộp cho một công ty.\nQuy mô công ty không lớn nhưng cạnh tranh rất gay gắt, vì rất nhiều người muốn ứng tuyển.\nĐể chuẩn bị chu đáo, tôi đã dành rất nhiều thời gian và quyết tâm nỗ lực.\nHôm qua tôi đi tàu điện đến công ty tham gia phỏng vấn.\nBan đầu tôi hơi căng thẳng, nhưng cố gắng hít thở sâu để thư giãn.\nNgười phỏng vấn hỏi tôi rất nhiều câu về hóa đơn hàng hóa.\nTôi cố gắng trả lời; thấy tôi phản ứng nhanh, người phỏng vấn mỉm cười.\nSau buổi phỏng vấn tôi nhìn lại, cảm thấy mình đã cố hết sức và nhẹ nhõm hơn nhiều.\nSau đó tôi đi ăn cùng một người bạn mới quen tại quán gần công ty.\nChúng tôi vừa ăn vừa trò chuyện, nói mãi vẫn chưa muốn về.\nGiả sử hôm nay không đi phỏng vấn, có lẽ chúng tôi đã không có ngày đáng nhớ như vậy.\nCòn tương lai thế nào thì hiện giờ chưa cần nghĩ tới.","answerLabel":"BẢN DỊCH MẪU","recordId":"r0650","answerRecordId":"r0650"},{"id":"e108","page":73,"type":"open","label":"","prompt":"人们常说“机会只留给有准备的人”，你是怎么看的？","promptPy":"rén men cháng shuō “jīhuì zhǐ liú gěi yǒu zhǔn bèi de rén”， nǐ shìzěn me kàn de？","promptVi":"Người ta thường nói “Cơ hội chỉ dành cho những người có chuẩn bị”, bạn nghĩ thế nào?","answer":"我同意“机会只留给有准备的人”这句话。","answerPy":"wǒ tóng yì “jīhuì zhǐ liú gěi yǒu zhǔn bèi de rén” zhè jù huà.","answerVi":"Tôi đồng ý với câu “Cơ hội chỉ dành cho người có chuẩn bị”.","answerLabel":"ĐÁP ÁN TỪ FILE","recordId":"r0702","answerRecordId":"r0717"},{"id":"e109","page":75,"type":"open","label":"","prompt":"你常用电脑做什么？","promptPy":"nǐ cháng yòngdiàn nǎo zuò shén me？","promptVi":"Bạn thường dùng máy tính để làm gì?","answer":"我每天都会用电脑，因为电脑对我的学习和工作很有帮助。","answerPy":"wǒ měi tiān dōu huì yòngdiàn nǎo， yīn wèi diàn nǎo duì wǒ de xué xí hé gōng zuò hěn yǒu bāng zhù.","answerVi":"Ngày nào tôi cũng dùng máy tính, vì máy tính rất hữu ích cho học tập và công việc.","answerLabel":"ĐÁP ÁN TỪ FILE","recordId":"r0727","answerRecordId":"r0729"},{"id":"e115","page":76,"type":"open","label":"Bài dịch đoạn văn","prompt":"ĐỀ GỐC — Đoạn 1: Trong các ngày lễ ở Việt Nam, tôi thích nhất là Tết. Tết là thời gian để tất cả mọi người sum họp bên nhau. Mọi người sẽ được nghỉ khoảng một tuần, người lớn không phải đi làm, trẻ nhỏ cũng không phải đi học.\n\nĐỀ GỐC — Đoạn 2: Trước khi nghỉ Tết, người người nhà nhà đều đi chợ, đi siêu thị, chuẩn bị nhiều thứ và trang trí nhà cửa. Bố tôi thường trồng nhiều hoa ở trong sân. Mẹ cũng thường mua quần áo mới cho chúng tôi.\n\nĐỀ GỐC — Đoạn 3: Đường phố trang trí vô cùng đẹp. Ngày Tết, cả nhà cùng nhau đến nhà họ hàng chúc Tết, ăn cơm, nói chuyện. Trẻ con được nhận tiền mừng tuổi. Không khí vô cùng náo nhiệt.","promptPy":"","promptVi":"ĐỀ GỐC — Đoạn 1: Trong các ngày lễ ở Việt Nam, tôi thích nhất là Tết. Tết là thời gian để tất cả mọi người sum họp bên nhau. Mọi người sẽ được nghỉ khoảng một tuần, người lớn không phải đi làm, trẻ nhỏ cũng không phải đi học.\n\nĐỀ GỐC — Đoạn 2: Trước khi nghỉ Tết, người người nhà nhà đều đi chợ, đi siêu thị, chuẩn bị nhiều thứ và trang trí nhà cửa. Bố tôi thường trồng nhiều hoa ở trong sân. Mẹ cũng thường mua quần áo mới cho chúng tôi.\n\nĐỀ GỐC — Đoạn 3: Đường phố trang trí vô cùng đẹp. Ngày Tết, cả nhà cùng nhau đến nhà họ hàng chúc Tết, ăn cơm, nói chuyện. Trẻ con được nhận tiền mừng tuổi. Không khí vô cùng náo nhiệt.","answer":"在越南的各种节日中，我最喜欢春节。\n春节是大家团聚在一起的时候。\n人们一般可以休息一个星期左右，大人不用上班，小孩子也不用上学。\n过春节以前，家家户户都去市场和超市买东西，准备很多东西，还把家里布置得很漂亮。\n爸爸常常在院子里种很多花。\n妈妈也常常给我们买新衣服。\n街道上也布置得非常漂亮。\n春节的时候，我们一家人一起去亲戚家拜年、吃饭、聊天。\n孩子们可以收到压岁钱。\n到处都非常热闹。","answerPy":"zài yuè nán de gè zhǒng jié rì zhōng， wǒ zuì xǐ huān chūn jié.\nchūn jié shìdà jiā tuán jù zài yī qǐ de shí hou.\nrén men yī bān kě yǐ xiū xīyī gè xīng qī zuǒ yòu， dà rén bù yòngshàng bān， xiǎo hái zi yě bù yòngshàng xué.\nguò chūn jié yǐ qián， jiā jiā hù hù dōu qù shì chǎng hé chāo shì mǎi dōng xi， zhǔn bèi hěn duō dōng xi， hái bǎ jiā lǐ bù zhìdé hěn piào liàng.\nbàbàcháng cháng zài yuàn zǐ lǐ zhǒng hěn duō huā.\nmā mā yě cháng cháng gěi wǒ men mǎi xīn yī fú.\njiē dào shàng yě bù zhìdé fēi cháng piào liàng.\nchūn jié de shí hou， wǒ men yī jiā rén yī qǐ qù qīn qī jiā bài nián, chī fàn, liáo tiān.\nhái zǐ men kě yǐ shōu dào yā suì qián.\ndào chù dōu fēi cháng rènào.","answerVi":"Trong các ngày lễ ở Việt Nam, tôi thích Tết nhất.\nTết là thời gian mọi người sum họp bên nhau.\nMọi người thường nghỉ khoảng một tuần; người lớn không đi làm, trẻ nhỏ không đi học.\nTrước Tết, nhà nhà đi chợ, siêu thị mua sắm, chuẩn bị nhiều thứ và trang trí nhà cửa rất đẹp.\nBố thường trồng nhiều hoa trong sân.\nMẹ cũng thường mua quần áo mới cho chúng tôi.\nĐường phố cũng được trang trí rất đẹp.\nNgày Tết, cả gia đình đến thăm họ hàng chúc Tết, ăn cơm và trò chuyện.\nTrẻ con có thể nhận tiền mừng tuổi.\nKhắp nơi đều vô cùng náo nhiệt.","answerLabel":"BẢN DỊCH MẪU","recordId":"r0745","answerRecordId":"r0745"},{"id":"e110","page":77,"type":"open","label":"","prompt":"回答问题后，叙述课文一。","promptPy":"huí dá Điền một trong bốn từ: 在 / 到 / 给 / 成."},{"t":"đáp án","text":"ĐÁP ÁN  我把她送到机场就回来了。"},{"t":"py","text":"wǒ bǎ tā sòng dào jīchǎng jiù huí lái le."},{"t":"vn","text":"Tôi đưa cô ấy đến sân bay rồi về ngay."},{"t":"note","text":"Câu 4"},{"t":"đề","text":"ĐỀ  把这幅画挂……那儿不太好。"},{"t":"py","text":"bǎ zhè fú huàguà……nà ér bù tài hǎo."},{"t":"vn","text":"Điền một trong bốn từ: 在 / 到 / 给 / 成."},{"t":"đáp án","text":"ĐÁP ÁN  把这幅画挂在那儿不太好。"},{"t":"py","text":"bǎ zhè fú huàguà zài nà ér bù tài hǎo."},{"t":"vn","text":"Treo bức tranh này ở đó không hay lắm."},{"t":"note","text":"Câu 5"},{"t":"đề","text":"ĐỀ  把这张桌子搬……外屋去吧。"},{"t":"py","text":"bǎ zhè zhāng zhuō zǐ bān……wài wū qù ba."},{"t":"vn","text":"Điền một trong bốn từ: 在 / 到 / 给 / 成."},{"t":"đáp án","text":"ĐÁP ÁN  把这张桌子搬到外屋去吧。"},{"t":"py","text":"bǎ zhè zhāng zhuō zǐ bāndào wài wū qù ba."},{"t":"vn","text":"Hãy chuyển chiếc bàn này ra phòng ngoài."},{"t":"note","text":"Câu 6"},{"t":"đề","text":"ĐỀ  你把我的护照放……哪儿了？"},{"t":"py","text":"nǐ bǎ wǒ de hù zhào fàng……nǎ ér le？"},{"t":"vn","text":"Điền một trong bốn từ: 在 / 到 / 给 / 成."},{"t":"đáp án","text":"ĐÁP ÁN  你把我的护照放在哪儿了？"},{"t":"py","text":"nǐ bǎ wǒ de hù zhào fàngzài nǎ ér le？"},{"t":"vn","text":"Bạn để hộ chiếu của tôi ở đâu rồi?"},{"t":"note","text":"Câu 7"},{"t":"đề","text":"ĐỀ  “眼睛”的“睛”左边是“目”，你把它写……“日”了。"},{"t":"py","text":"“yǎnjīng” de “jīng” zuǒ biān shì“mù”， nǐ bǎ tā xiě……“rì” le."},{"t":"vn","text":"Điền một trong bốn từ: 在 / 到 / 给 / 成."},{"t":"đáp án","text":"ĐÁP ÁN  “眼睛”的“睛”左边是“目”，你把它写成“日”了。"},{"t":"py","text":"“yǎnjīng” de “jīng” zuǒ biān shì“mù”， nǐ bǎ tā xiě chéng “rì” le."},{"t":"vn","text":"Chữ 睛 trong 眼睛 có bộ 目 ở bên trái, bạn lại viết thành 日 rồi."},{"t":"note","text":"Câu 8"},{"t":"đề","text":"ĐỀ  我的发音还不太好，常常把“是不是”说……“四不四”。"},{"t":"py","text":"wǒ de fā yīn hái bù tài hǎo， cháng cháng bǎ “shìbù shì” shuō……“sì bù sì”."},{"t":"vn","text":"Điền một trong bốn từ: 在 / 到 / 给 / 成."},{"t":"đáp án","text":"ĐÁP ÁN  我的发音还不太好，常常把“是不是”说成“四不四”。"},{"t":"py","text":"wǒ de fā yīn hái bù tài hǎo， cháng cháng bǎ “shìbù shì” shuō chéng “sì bù sì”."},{"t":"vn","text":"Phát âm của tôi chưa tốt, thường phát âm 是不是 thành 四不四."}],"42":[{"t":"cn","text":"例：我把自行车放在门口了。"},{"t":"py","text":"lì： wǒ bǎ zì xíng chē fàngzài mén kǒu le."},{"t":"vn","text":"Ví dụ: Tôi đã để xe đạp ở cửa."},{"t":"cn","text":"你把自行车放在哪儿了？"},{"t":"py","text":"nǐ bǎ zì xíng chē fàngzài nǎ ér le？"},{"t":"vn","text":"Bạn đã để xe đạp ở đâu?"},{"t":"note","text":"Câu 1"},{"t":"đề","text":"ĐỀ  我把钥匙放在大衣口袋里了。"},{"t":"py","text":"wǒ bǎ yào shi fàngzài dà yī kǒu dài lǐ le."},{"t":"vn","text":"Đề gốc (từ được gạch chân thể hiện trên slide)."},{"t":"đáp án","text":"ĐÁP ÁN  你把钥匙放在哪儿了？"},{"t":"py","text":"nǐ bǎ yào shi fàngzài nǎ ér le？"},{"t":"vn","text":"Bạn đã để chìa khóa ở đâu? (Hỏi vị trí: trong túi áo khoác.)"},{"t":"note","text":"Câu 2"},{"t":"đề","text":"ĐỀ  我把那本书借给玛丽了。"},{"t":"py","text":"wǒ bǎ nà běnshū jiè gěi mǎ lì le."},{"t":"vn","text":"Đề gốc (từ được gạch chân thể hiện trên slide)."},{"t":"đáp án","text":"ĐÁP ÁN  你把那本书借给谁了？"},{"t":"py","text":"nǐ bǎ nà běnshū jiè gěi shéi le？"},{"t":"vn","text":"Bạn cho ai mượn quyển sách ấy? (Hỏi Mary.)"},{"t":"note","text":"Câu 3"},{"t":"đề","text":"ĐỀ  她已经把礼物寄给男朋友了。"},{"t":"py","text":"tā yǐ jīng bǎ lǐwùjì gěi nán péng you le."},{"t":"vn","text":"Đề gốc (từ được gạch chân thể hiện trên slide)."},{"t":"đáp án","text":"ĐÁP ÁN  她已经把礼物寄给谁了？"},{"t":"py","text":"tā yǐ jīng bǎ lǐwùjì gěi shéi le？"},{"t":"vn","text":"Cô ấy đã gửi quà cho ai? (Hỏi bạn trai.)"},{"t":"note","text":"Câu 4"},{"t":"đề","text":"ĐỀ  她打算把买来的画挂在宿舍的墙上。"},{"t":"py","text":"tā dǎ suàn bǎ mǎi lái de huàguà zài sù shě de qiáng shàng."},{"t":"vn","text":"Đề gốc (từ được gạch chân thể hiện trên slide)."},{"t":"đáp án","text":"ĐÁP ÁN  她打算把买来的画挂在哪儿？"},{"t":"py","text":"tā dǎ suàn bǎ mǎi lái de huàguà zài nǎ ér？"},{"t":"vn","text":"Cô ấy định treo bức tranh vừa mua ở đâu? (Hỏi tường ký túc xá.)"},{"t":"note","text":"Câu 5"},{"t":"đề","text":"ĐỀ  麦克还没把这封信翻译成英文呢。"},{"t":"py","text":"
