 shù xiān huā dài gěi ān nà， hǎo ma？"},{"t":"vn","text":"Mary đến bệnh viện thăm Anna: Mary, bạn mang bó hoa này cho Anna giúp tôi nhé?"},{"t":"note","text":"Tình huống 6"},{"t":"đề","text":"ĐỀ  在出租车里，你告诉司机在你的宿舍门口停车。"},{"t":"py","text":"zài chū zū chē lǐ， nǐ gào sù sī jīzài nǐ de sù shě mén kǒu tíng chē."},{"t":"vn","text":"Yêu cầu: dùng 把 nói theo tình huống."},{"t":"đáp án","text":"ĐÁP ÁN  师傅，请把车停在我宿舍门口。"},{"t":"py","text":"shī fù， qǐng bǎ chē tíng zài wǒ sù shě mén kǒu."},{"t":"vn","text":"Bạn đang đi taxi: Bác tài, xin hãy dừng xe ở cửa ký túc xá của tôi."}],"47":[{"t":"note","text":"1. Quay video đọc và dịch trước 3 bài khóa (trang 50–52, 55, 57)."},{"t":"note","text":"2. Làm toàn bộ bài tập trong slide, viết tay hoặc đánh máy, sau đó quay video đọc bài."},{"t":"note","text":"3. Quay video duet trả lời các câu hỏi TikTok."},{"t":"note","text":"Đã kèm lời giải các bài tập trên trang 34–46 và lời giải đọc hiểu ở các trang 53, 54, 56, 58, 60 trong tài liệu này; những yêu cầu quay video là nhiệm vụ thực hành cá nhân."}],"48":[{"t":"cn","text":"第二讲：课文＋翻译＋HSKK四级"},{"t":"py","text":"dìèr jiǎng： kè wén＋fānyì＋HSKK sì jí"},{"t":"vn","text":"Buổi thứ hai: Bài khóa, luyện dịch và HSKK cấp 4."}],"49":[{"t":"cn","text":"第一部分：课文"},{"t":"py","text":"dìyī bù fēn： kè wén"},{"t":"vn","text":"Phần thứ nhất: Bài khóa."}],"50":[{"t":"cn","text":"（一）我们把教室布置成了会场。"},{"t":"py","text":"（yī） wǒ men bǎ jiào shì bù zhìchéng le huì chǎng."},{"t":"vn","text":"(I) Chúng tôi trang trí phòng học thành hội trường."},{"t":"cn","text":"圣诞节和新年快到了，我们班准备在圣诞节前举行一个联欢晚会，请老师们也来参加。"},{"t":"py","text":"shèng dàn jié hé xīn nián kuài dào le， wǒ men bānzhǔn bèi zài shèng dàn jié qián jǔ xíng yī gè lián huān wǎn huì， qǐng lǎo shī men yě lái cān jiā."},{"t":"vn","text":"Giáng sinh và năm mới sắp đến, lớp chúng tôi định tổ chức một buổi liên hoan trước Giáng sinh, đồng thời mời các thầy cô đến tham dự."},{"t":"cn","text":"晚会上我们要唱中文歌，用汉语讲故事，表演节目，品尝各国的特色菜。"},{"t":"py","text":"wǎn huì shàng wǒ men yào chàng zhōng wén gē， yònghàn yǔ jiǎng gù shì， biǎo yǎn jié mù， pǐn cháng gè guó de tèsè cài."},{"t":"vn","text":"Trong buổi liên hoan, chúng tôi sẽ hát các bài hát tiếng Trung, kể chuyện bằng tiếng Hán, biểu diễn các tiết mục và thưởng thức món ăn đặc trưng của các nước."},{"t":"cn","text":"班长要求我们那天把自己亲手做的菜带到晚会上来，让大家品尝。"},{"t":"py","text":"bānzhǎng yào qiú wǒ men nà tiān bǎ zì jǐ qīn shǒu zuò de cài dài dào wǎn huì shàng lái， ràng dà jiā pǐn cháng."},{"t":"vn","text":"Lớp trưởng yêu cầu hôm đó mỗi người mang món ăn do chính mình nấu đến liên hoan để mọi người cùng nếm thử."},{"t":"cn","text":"玛丽说：“我们最好借一个大教室，把它布置成会场。”"},{"t":"py","text":"mǎ lì shuō：“wǒ men zuì hǎo jiè yī gè dà jiào shì， bǎ tā bù zhìchéng huì chǎng.”"},{"t":"vn","text":"Mary nói: “Tốt nhất chúng ta nên mượn một phòng học lớn rồi bố trí thành hội trường.”"},{"t":"cn","text":"前天，我们找到管理员，告诉了她借教室的事，她答应把那个大教室借给我们。"},{"t":"py","text":"qián tiān， wǒ men zhǎodào guǎn lǐ yuán， gào sù le tā jiè jiào shì de shì， tā dá yīng bǎ nà gè dà jiào shì jiè gěi wǒ men."},{"t":"vn","text":"Hôm kia, chúng tôi tìm gặp người quản lý để trình bày việc mượn phòng học. Cô ấy đã đồng ý cho chúng tôi mượn phòng học lớn đó."},{"t":"cn","text":"昨天下午服务员把教室打扫了一下儿，把门和窗户也都擦得干干净净的。"},{"t":"py","text":"zuótiān xià wǔ fú wù yuán bǎ jiào shì dǎ sǎole yī xià ér， bǎ mén hé chuāng hù yě dōu cā dé gàn gàn jìng jìng de."},{"t":"vn","text":"Chiều hôm qua, nhân viên phục vụ đã dọn dẹp lớp học, lau cả cửa ra vào lẫn cửa sổ sạch sẽ tinh tươm."}],"51":[{"t":"cn","text":"我们把桌子摆成了一个大圆圈，爱德华把“圣诞——新年快乐”几个大字贴在了黑板上。"},{"t":"py","text":"wǒ men bǎ zhuō zǐ bǎi chéng le yī gè dà yuán quān， ài dé huá bǎ “shèng dàn——xīn nián kuài lè” jǐ gè dà zì tiē zài le hēi bǎnshàng."},{"t":"vn","text":"Chúng tôi xếp các bàn thành một vòng tròn lớn. Edward dán dòng chữ lớn “Giáng sinh – Chúc mừng năm mới” lên bảng đen."},{"t":"cn","text":"李美英说，晚会上她要和几个同学唱歌、跳舞，所以把音响也搬到教室里来了。"},{"t":"py","text":"lǐ měi yīng shuō， wǎn huì shàng tā yào hé jǐ gè tóng xué chàng gē, tiào wǔ， suǒ yǐ bǎ yīn xiǎng yě bāndào jiào shì lǐ lái le."},{"t":"vn","text":"Lý Mỹ Anh nói rằng tại buổi liên hoan cô ấy sẽ hát và nhảy cùng một vài bạn học, vì thế cô ấy cũng chuyển thiết bị âm thanh vào lớp."},{"t":"cn","text":"爱德华昨天从商店买回来一棵圣诞树，我们把它摆在了教室的前边，用彩灯和彩带把它装饰得非常漂亮。"},{"t":"py","text":"ài dé huá zuótiān cóng shāng diàn mǎi huí lái yī kē shèng dàn shù， wǒ men bǎ tā bǎi zài le jiào shì de qián biān， yòngcǎi dēnghé cǎi dài bǎ tā zhuāng shì dé fēi cháng piào liàng."},{"t":"vn","text":"Hôm qua Edward mua về một cây thông Giáng sinh từ cửa hàng. Chúng tôi đặt nó ở phía trước lớp, trang trí rất đẹp bằng đèn màu và những dải ruy băng."},{"t":"cn","text":"安娜是我们班最小的同学，她的生日正好是十二月二十五号，所以同学们还为她准备了一份生日礼物和一个生日蛋糕。"},{"t":"py","text":"ān nà shìwǒ men bānzuì xiǎo de tóng xué， tā de shēng rì zhèng hǎo shìshí èr yuè èr shí wǔ hào， suǒ yǐ tóng xué men hái wèi tā zhǔn bèi le yī fèn shēng rì lǐwùhé yī gè shēng rì dàn gāo."},{"t":"vn","text":"Anna là bạn nhỏ tuổi nhất lớp; sinh nhật của cô ấy đúng ngày 25 tháng 12, vì vậy các bạn đã chuẩn bị cả quà sinh nhật lẫn bánh sinh nhật cho cô ấy."},{"t":"cn","text":"但是我们还没把这事告诉她，我们想，到晚会上再把生日礼物拿出来送给她，给她一个惊喜，让她在中国过一个快乐的生日。"},{"t":"py","text":"dàn shìwǒ men hái méi bǎ zhè shì gào sù tā， wǒ men xiǎng， dào wǎn huì shàng zài bǎ shēng rì lǐwùnáchū lái sòng gěi tā， gěi tā yī gè jīng xǐ， ràng tā zài zhōng guó guò yī gè kuài lè de shēng rì."},{"t":"vn","text":"Nhưng chúng tôi vẫn chưa nói cho Anna biết. Chúng tôi định tới buổi liên hoan mới mang quà ra tặng, tạo bất ngờ để cô ấy có một sinh nhật vui vẻ tại Trung Quốc."}],"52":[{"t":"cn","text":"我们把教室布置好以后，请老师来看了看，老师高兴地说：“你们把教室布置得真漂亮！”"},{"t":"py","text":"wǒ men bǎ jiào shì bù zhìhǎo yǐ hòu， qǐng lǎo shī lái kàn le kàn， lǎo shī gāo xìng de shuō：“nǐ men bǎ jiào shì bù zhìdé zhēn piào liàng！”"},{"t":"vn","text":"Sau khi trang trí lớp xong, chúng tôi mời giáo viên đến xem. Thầy/cô vui vẻ nói: “Các em trang trí lớp đẹp thật đấy!”"},{"t":"cn","text":"为了开好这个联欢会，同学们都认真地做了准备。"},{"t":"py","text":"wèi le kāi hǎo zhè gè lián huān huì， tóng xué men dōu rèn zhēn de zuò le zhǔn bèi."},{"t":"vn","text":"Để tổ chức thật tốt buổi liên hoan này, tất cả học sinh đều chuẩn bị rất nghiêm túc."},{"t":"cn","text":"明天晚上六点钟，我们的晚会就要开始了，欢迎大家来参加。"},{"t":"py","text":"míng tiān wǎn shàng liù diǎnzhōng， wǒ men de wǎn huì jiù yào kāi shǐ le， huān yíng dà jiā lái cān jiā."},{"t":"vn","text":"Buổi liên hoan sẽ bắt đầu lúc 6 giờ tối ngày mai, rất hoan nghênh mọi người đến tham dự."}],"53":[{"t":"đề","text":"ĐỀ  读课文并回答下面的问题。"},{"t":"py","text":"dú kè wén bìng huí dá xià miàn de wèn tí."},{"t":"vn","text":"Đọc bài khóa và trả lời các câu hỏi sau."},{"t":"note","text":"Câu 1"},{"t":"đề","text":"ĐỀ  圣诞节和新年快到了，他们班准备干什么？联欢晚会有什么活动？"},{"t":"py","text":"shèng dàn jié hé xīn nián kuài dào le， tā men bānzhǔn bèi gàn shén me？ lián huān wǎn huì yǒu shén me huódòng？"},{"t":"vn","text":"Giáng sinh và năm mới sắp đến, lớp họ định làm gì? Buổi liên hoan có hoạt động gì?"},{"t":"đáp án","text":"ĐÁP ÁN  他们打算举行一个联欢晚会。活动有：唱中文歌、用汉语讲故事、表演节目、品尝各国的特色菜。"},{"t":"py","text":"tā men dǎ suàn jǔ xíng yī gè lián huān wǎn huì. huódòng yǒu： chàng zhōng wén gē, yònghàn yǔ jiǎng gù shì, biǎo yǎn jié mù, pǐn cháng gè guó de tèsè cài."},{"t":"vn","text":"Họ định tổ chức liên hoan, hát tiếng Trung, kể chuyện bằng tiếng Hán, biểu diễn và thưởng thức món ăn đặc trưng các nước."},{"t":"note","text":"Câu 2"},{"t":"đề","text":"ĐỀ  玛丽有什么建议？"},{"t":"py","text":"mǎ lì yǒu shén me jiàn yì？"},{"t":"vn","text":"Mary đề xuất gì?"},{"t":"đáp án","text":"ĐÁP ÁN  玛丽建议借一个大教室，把它布置成会场。"},{"t":"py","text":"mǎ lì jiàn yì jiè yī gè dà jiào shì， bǎ tā bù zhìchéng huì chǎng."},{"t":"vn","text":"Cô ấy đề nghị mượn một lớp lớn và bố trí thành hội trường."},{"t":"note","text":"Câu 3"},{"t":"đề","text":"ĐỀ  李美英为什么要把音响搬到教室里来？"},{"t":"py","text":"lǐ měi yīng wèi shén me yào bǎ yīn xiǎng bāndào jiào shì lǐ lái？"},{"t":"vn","text":"Vì sao Lý Mỹ Anh chuyển loa vào phòng?"},{"t":"đáp án","text":"ĐÁP ÁN  因为她要和几个同学唱歌、跳舞。"},{"t":"py","text":"yīn wèi tā yào hé jǐ gè tóng xué chàng gē, tiào wǔ."},{"t":"vn","text":"Vì cô ấy sẽ hát, nhảy cùng một vài bạn."},{"t":"note","text":"Câu 4"},{"t":"đề","text":"ĐỀ  爱德华买了什么树？他们怎么装饰那棵树的？"},{"t":"py","text":"ài dé huá mǎi le shén me shù？ tā men zěn me zhuāng shì nà kē shù de？"},{"t":"vn","text":"Edward mua cây gì? Họ trang trí thế nào?"},{"t":"đáp án","text":"ĐÁP ÁN  爱德华买了一棵圣诞树。他们把它摆在教室前边，用彩灯和彩带把它装饰得很漂亮。"},{"t":"py","text":"ài dé huá mǎi le yī kē shèng dàn shù. tā men bǎ tā bǎi zài jiào shì qián biān， yòngcǎi dēnghé cǎi dài bǎ tā zhuāng shì dé hěn piào liàng."},{"t":"vn","text":"Anh ấy mua cây thông Noel, họ đặt trước lớp rồi trang trí bằng đèn màu và ruy băng."}],"54":[{"t":"note","text":"Câu 5"},{"t":"đề","text":"ĐỀ  安娜的生日是几月几号？他们打算给她什么惊喜？"},{"t":"py","text":"ān nà de shēng rì shìjǐ yuè jǐ hào？ tā men dǎ suàn gěi tā shén me jīng xǐ？"},{"t":"vn","text":"Sinh nhật Anna ngày mấy? Mọi người định gây bất ngờ gì?"},{"t":"đáp án","text":"ĐÁP ÁN  安娜的生日是十二月二十五号。同学们给她准备了一份生日礼物和一个蛋糕，打算在晚会上送给她。"},{"t":"py","text":"ān nà de shēng rì shìshí èr yuè èr shí wǔ hào. tóng xué men gěi tā zhǔn bèi le yī fèn shēng rì lǐwùhé yī gè dàn gāo， dǎ suàn zài wǎn huì shàng sòng gěi tā."},{"t":"vn","text":"Ngày 25/12; các bạn định tặng quà và bánh sinh nhật ở buổi liên hoan."},{"t":"note","text":"Câu 6"},{"t":"đề","text":"ĐỀ  老师觉得他们布置得怎么样？"},{"t":"py","text":"lǎo shī jué de tā men bù zhìdé zěn me yàng？"},{"t":"vn","text":"Giáo viên thấy họ trang trí thế nào?"},{"t":"đáp án","text":"ĐÁP ÁN  老师觉得他们把教室布置得真漂亮。"},{"t":"py","text":"lǎo shī jué de tā men bǎ jiào shì bù zhìdé zhēn piào liàng."},{"t":"vn","text":"Thầy/cô thấy lớp được trang trí rất đẹp."},{"t":"note","text":"Câu 7"},{"t":"đề","text":"ĐỀ  晚会几点开始？"},{"t":"py","text":"wǎn huì jǐ diǎnkāi shǐ？"},{"t":"vn","text":"Buổi liên hoan bắt đầu lúc mấy giờ?"},{"t":"đáp án","text":"ĐÁP ÁN  晚会明天晚上六点钟开始。"},{"t":"py","text":"wǎn huì míng tiān wǎn shàng liù diǎnzhōng kāi shǐ."},{"t":"vn","text":"6 giờ tối ngày mai."}],"55":[{"t":"cn","text":"（二）把对联贴在大门两边。"},{"t":"py","text":"（èr） bǎ duì lián tiē zài dà mén liǎng biān."},{"t":"vn","text":"(II) Dán câu đối ở hai bên cửa chính."},{"t":"cn","text":"（春节前，王老师和夫人高老师也在布置他们的家。）"},{"t":"py","text":"（chūn jié qián， wáng lǎo shī hé fū rén gāo lǎo shī yě zài bù zhìtā men de jiā.）"},{"t":"vn","text":"(Trước Tết, thầy Vương và vợ là cô Cao cũng đang trang trí nhà.)"},{"t":"cn","text":"高老师：哎，这幅画挂在什么地方比较好？"},{"t":"py","text":"gāo lǎo shī： āi， zhè fú huàguà zài shén me de fāngbǐ jiào hǎo？"},{"t":"vn","text":"Cô Cao: Này, treo bức tranh này ở đâu thì đẹp hơn nhỉ?"},{"t":"cn","text":"王老师：我想把它挂在中间。对了，小林还没把水仙花送来吧？"},{"t":"py","text":"wáng lǎo shī： wǒ xiǎng bǎ tā guà zài zhōng jiān. duì le， xiǎo lín hái méi bǎ shuǐ xiān huā sòng lái ba？"},{"t":"vn","text":"Thầy Vương: Tôi muốn treo nó ở giữa. À đúng rồi, Tiểu Lâm vẫn chưa mang hoa thủy tiên đến phải không?"},{"t":"cn","text":"高老师：已经送来了，我把它摆在卧室里了。你来看，开得可好了。"},{"t":"py","text":"gāo lǎo shī： yǐ jīng sòng lái le， wǒ bǎ tā bǎi zài wò shì lǐ le. nǐ lái kàn， kāi dé kě hǎo le."},{"t":"vn","text":"Cô Cao: Mang tới rồi, tôi đặt trong phòng ngủ. Ông đến xem đi, hoa nở đẹp lắm."},{"t":"cn","text":"王老师：把它摆在客厅里比较好。我把“福”字贴在门上吧。"},{"t":"py","text":"wáng lǎo shī： bǎ tā bǎi zài kè tīng lǐ bǐ jiào hǎo. wǒ bǎ “fú” zì tiē zài mén shàng ba."},{"t":"vn","text":"Thầy Vương: Đặt trong phòng khách thì đẹp hơn. Để tôi dán chữ “Phúc” lên cửa nhé."},{"t":"cn","text":"高老师：把你写的对联也贴上去吧。"},{"t":"py","text":"gāo lǎo shī： bǎ nǐ xiě de duì lián yě tiē shàng qù ba."},{"t":"vn","text":"Cô Cao: Dán cả đôi câu đối ông viết lên nữa đi."},{"t":"cn","text":"（读对联）“新年新春吉祥，百行百业……”"},{"t":"py","text":"（dú duì lián）“xīn nián xīn chūn jí xiáng， bǎi háng bǎi yè……”"},{"t":"vn","text":"(Đọc câu đối): “Năm mới xuân mới cát tường, trăm ngành trăm nghề…”"},{"t":"cn","text":"你是不是把“兴”字也写成“旺”字了？"},{"t":"py","text":"nǐ shìbù shìbǎ “xìng” zì yě xiě chéng “wàng” zì le？"},{"t":"vn","text":"Có phải ông đã viết nhầm chữ “兴” (hưng) thành chữ “旺” (vượng) rồi không?"},{"t":"cn","text":"王老师：哦，可不是嘛，写错了。"},{"t":"py","text":"wáng lǎo shī： ó， kě bù shìma， xiě cuò le."},{"t":"vn","text":"Thầy Vương: Ồ, đúng thật, tôi viết sai rồi."},{"t":"cn","text":"应该是“新年新春吉祥，百行百业兴旺”。"},{"t":"py","text":"yīng gāi shì“xīn nián xīn chūn jí xiáng， bǎi háng bǎi yè xīng wàng”."},{"t":"vn","text":"Phải là: “Tân niên tân xuân cát tường, bách hành bách nghiệp hưng vượng”."}],"56":[{"t":"note","text":"Câu 1"},{"t":"đề","text":"ĐỀ  春节前，王老师和夫人要布置什么地方？"},{"t":"py","text":"chūn jié qián， wáng lǎo shī hé fū rén yào bù zhìshén me de fāng？"},{"t":"vn","text":"Trước Tết hai vợ chồng thầy Vương trang trí nơi nào?"},{"t":"đáp án","text":"ĐÁP ÁN  春节前，王老师和夫人高老师要布置他们的家。"},{"t":"py","text":"chūn jié qián， wáng lǎo shī hé fū rén gāo lǎo shī yào bù zhìtā men de jiā."},{"t":"vn","text":"Họ trang trí nhà mình."},{"t":"note","text":"Câu 2"},{"t":"đề","text":"ĐỀ  王老师想把那幅画挂在哪里？"},{"t":"py","text":"wáng lǎo shī xiǎng bǎ nà fú huàguà zài nǎ lǐ？"},{"t":"vn","text":"Thầy Vương muốn treo tranh ở đâu?"},{"t":"đáp án","text":"ĐÁP ÁN  王老师想把那幅画挂在中间。"},{"t":"py","text":"wáng lǎo shī xiǎng bǎ nà fú huàguà zài zhōng jiān."},{"t":"vn","text":"Ở chính giữa."},{"t":"note","text":"Câu 3"},{"t":"đề","text":"ĐỀ  高老师把水仙花摆在哪里？王老师觉得把水仙花摆在哪里好？"},{"t":"py","text":"gāo lǎo shī bǎ shuǐ xiān huā bǎi zài nǎ lǐ？ wáng lǎo shī jué de bǎ shuǐ xiān huā bǎi zài nǎ lǐ hǎo？"},{"t":"vn","text":"Cô Cao đặt hoa ở đâu? Thầy Vương thấy nên đặt ở đâu?"},{"t":"đáp án","text":"ĐÁP ÁN  高老师把水仙花摆在卧室里。王老师觉得摆在客厅里比较好。"},{"t":"py","text":"gāo lǎo shī bǎ shuǐ xiān huā bǎi zài wò shì lǐ. wáng lǎo shī jué de bǎi zài kè tīng lǐ bǐ jiào hǎo."},{"t":"vn","text":"Cô Cao đặt ở phòng ngủ; thầy Vương thấy phòng khách tốt hơn."},{"t":"note","text":"Câu 4"},{"t":"đề","text":"ĐỀ  他们打算在门上贴什么？"},{"t":"py","text":"tā men dǎ suàn zài mén shàng tiē shén me？"},{"t":"vn","text":"Họ định dán gì lên cửa?"},{"t":"đáp án","text":"ĐÁP ÁN  他们打算在门上贴对联和“福”字。"},{"t":"py","text":"tā men dǎ suàn zài mén shàng tiē duì lián hé “fú” zì."},{"t":"vn","text":"Câu đối và chữ Phúc."},{"t":"note","text":"Câu 5"},{"t":"đề","text":"ĐỀ  王老师把对联写错了什么字？"},{"t":"py","text":"wáng lǎo shī bǎ duì lián xiě cuò le shén me zì？"},{"t":"vn","text":"Thầy Vương viết nhầm chữ nào?"},{"t":"đáp án","text":"ĐÁP ÁN  王老师把“兴”字写成了“旺”字。"},{"t":"py","text":"wáng lǎo shī bǎ “xìng” zì xiě chéng le “wàng” zì."},{"t":"vn","text":"Viết chữ 兴 thành 旺."}],"57":[{"t":"cn","text":"（三）为什么把“福”字倒着贴在门上呢？"},{"t":"py","text":"（sān） wèi shén me bǎ “fú” zì dào zhe tiē zài mén shàng ne？"},{"t":"vn","text":"(III) Tại sao lại dán ngược chữ “Phúc” lên cửa?"},{"t":"cn","text":"（麦克看见王老师家门上贴着对联，就问田芳……）"},{"t":"py","text":"（mài kè kàn jiàn wáng lǎo shī jiā mén shàng tiē zhe duì lián， jiù wèn tián fāng……）"},{"t":"vn","text":"(Mike thấy câu đối dán trên cửa nhà thầy Vương, liền hỏi Điền Phương…)"},{"t":"cn","text":"麦克：田芳，这就是你说的对联吗？"},{"t":"py","text":"mài kè： tián fāng， zhè jiù shìnǐ shuō de duì lián ma？"},{"t":"vn","text":"Mike: Điền Phương, đây chính là câu đối mà bạn từng nói phải không?"},{"t":"cn","text":"田芳：是啊。"},{"t":"py","text":"tián fāng： shìa."},{"t":"vn","text":"Điền Phương: Đúng vậy."},{"t":"cn","text":"麦克：门上这个字怎么念？"},{"t":"py","text":"mài kè： mén shàng zhè gè zì zěn me niàn？"},{"t":"vn","text":"Mike: Chữ này trên cửa đọc thế nào?"},{"t":"cn","text":"田芳：你仔细看看，认识不认识？"},{"t":"py","text":"tián fāng： nǐ zǐ xì kàn kàn， rèn shí bù rèn shí？"},{"t":"vn","text":"Điền Phương: Bạn nhìn kỹ xem, có nhận ra không?"},{"t":"cn","text":"麦克：没学过。"},{"t":"py","text":"mài kè： méi xué guò."},{"t":"vn","text":"Mike: Tôi chưa học chữ này."},{"t":"cn","text":"田芳：这不是幸福的“福”字吗？"},{"t":"py","text":"tián fāng： zhè bù shìxìng fú de “fú” zì ma？"},{"t":"vn","text":"Điền Phương: Đây chẳng phải chữ “Phúc” trong từ “hạnh phúc” sao?"},{"t":"cn","text":"过春节的时候，差不多家家都贴“福”字。"},{"t":"py","text":"guò chūn jié de shí hou， chà bù duō jiā jiā dōu tiē “fú” zì."},{"t":"vn","text":"Dịp Tết Nguyên đán, hầu như nhà nào cũng dán chữ “Phúc”."},{"t":"cn","text":"麦克：这是幸福的“福”字？为什么把“福”字倒着贴在门上呢？"},{"t":"py","text":"mài kè： zhè shìxìng fú de “fú” zì？ wèi shén me bǎ “fú” zì dào zhe tiē zài mén shàng ne？"},{"t":"vn","text":"Mike: Đây là chữ “Phúc” trong “hạnh phúc” ư? Tại sao lại dán ngược lên cửa?"},{"t":"cn","text":"田芳：这样，人们一看见就会说“福倒了”，听声音就是“福到了”。"},{"t":"py","text":"tián fāng： zhè yàng， rén men yī kàn jiàn jiù huì shuō “fú dào le”， tīng shēng yīn jiù shì“fú dào le”."},{"t":"vn","text":"Điền Phương: Như vậy khi thấy, người ta sẽ nói “Phúc bị đảo ngược”, nghe đồng âm thành “Phúc đã đến”."},{"t":"cn","text":"麦克：哦，那我也去买一些“福”字来，把它倒着贴在门上、床上、桌子上、椅子上、沙发上、冰箱上、洗衣机上、空调上……等着幸福来找我。"},{"t":"py","text":"mài kè： ó， nà wǒ yě qù mǎi yī xiē “fú” zì lái， bǎ tā dào zhe tiē zài mén shàng, chuáng shàng, zhuō zǐ shàng, yǐ zǐ shàng, shā fā shàng, bīng xiāng shàng, xǐ yī jīshàng, kōngdiào shàng……děng zhe xìng fú lái zhǎowǒ."},{"t":"vn","text":"Mike: Ồ, thế tôi cũng đi mua một ít chữ “Phúc”, dán ngược trên cửa, giường, bàn, ghế, sofa, tủ lạnh, máy giặt, điều hòa… rồi chờ hạnh phúc tìm tới tôi."},{"t":"note","text":"Giải thích văn hóa: 倒 (dào, đảo ngược) đồng âm với 到 (dào, đến), vì vậy “福倒了” gợi âm “福到了”, mang ý nghĩa phúc lành đã tới."}],"58":[{"t":"note","text":"Câu 1"},{"t":"đề","text":"ĐỀ  门上贴的是什么字？"},{"t":"py","text":"mén shàng tiē de shìshén me zì？"},{"t":"vn","text":"Dán chữ gì trên cửa?"},{"t":"đáp án","text":"ĐÁP ÁN  门上贴的是“福”字。"},{"t":"py","text":"mén shàng tiē de shì“fú” zì."},{"t":"vn","text":"Chữ Phúc."},{"t":"note","text":"Câu 2"},{"t":"đề","text":"ĐỀ  麦克为什么不会念门上贴的“福”字？"},{"t":"py","text":"mài kè wèi shén me bù huì niàn mén shàng tiē de “fú” zì？"},{"t":"vn","text":"Vì sao Mike không đọc được chữ Phúc trên cửa?"},{"t":"đáp án","text":"ĐÁP ÁN  因为他没学过这个字，而且“福”字是倒着贴的。"},{"t":"py","text":"yīn wèi tā méi xué guò zhè gè zì， ér qiě “fú” zì shìdào zhe tiē de."},{"t":"vn","text":"Vì anh ấy chưa học chữ này, lại thấy chữ bị dán ngược."},{"t":"note","text":"Câu 3"},{"t":"đề","text":"ĐỀ  为什么人们把“福”字倒着贴呢？"},{"t":"py","text":"wèi shén me rén men bǎ “fú” zì dào zhe tiē ne？"},{"t":"vn","text":"Vì sao người ta dán ngược chữ Phúc?"},{"t":"đáp án","text":"ĐÁP ÁN  因为“福倒了”和“福到了”听起来一样，表示幸福和好运到了。"},{"t":"py","text":"yīn wèi “fú dào le” hé “fú dào le” tīng qǐ lái yī yàng， biǎo shìxìng fú hé hǎo yùn dào le."},{"t":"vn","text":"Vì hai cụm “Phúc đảo” và “Phúc đến” đồng âm, biểu thị phúc lành đã đến."},{"t":"note","text":"Câu 4"},{"t":"đề","text":"ĐỀ  听田芳解释后麦克打算干什么？"},{"t":"py","text":"tīng tián fāng jiě shì hòu mài kè dǎ suàn gàn shén me？"},{"t":"vn","text":"Sau khi nghe giải thích, Mike định làm gì?"},{"t":"đáp án","text":"ĐÁP ÁN  麦克打算买一些“福”字来，把它倒着贴在门上、床上、桌子上、椅子上、沙发上、冰箱上、洗衣机上和空调上。"},{"t":"py","text":"mài kè dǎ suàn mǎi yī xiē “fú” zì lái， bǎ tā dào zhe tiē zài mén shàng, chuáng shàng, zhuō zǐ shàng, yǐ zǐ shàng, shā fā shàng, bīng xiāng shàng, xǐ yī jīshàng hé kōngdiào shàng."},{"t":"vn","text":"Mua chữ Phúc rồi dán ngược lên rất nhiều đồ vật trong nhà."}],"59":[{"t":"cn","text":"爸爸带着三岁的儿子坐火车去看奶奶。"},{"t":"py","text":"bàbàdài zhe sān suì de ér zǐ zuò huǒchē qù kàn nǎi nǎi."},{"t":"vn","text":"Bố đưa con trai ba tuổi đi tàu hỏa thăm bà nội."},{"t":"cn","text":"在火车上，儿子喜欢把头伸到窗外去。"},{"t":"py","text":"zài huǒchē shàng， ér zǐ xǐ huān bǎ tóu shēn dào chuāng wài qù."},{"t":"vn","text":"Trên tàu, cậu bé thích thò đầu ra ngoài cửa sổ."},{"t":"cn","text":"爸爸对他说：“儿子，小心点儿，别把头伸到窗外去。”"},{"t":"py","text":"bàbàduì tā shuō：“ér zǐ， xiǎo xīn diǎnér， bié bǎ tóu shēn dào chuāng wài qù.”"},{"t":"vn","text":"Bố nói: “Con trai, cẩn thận một chút, đừng thò đầu ra ngoài cửa sổ.”"},{"t":"cn","text":"可是男孩不听爸爸的话，还是把头伸到窗外。"},{"t":"py","text":"kě shìnán hái bù tīng bàbàde huà， hái shìbǎ tóu shēn dào chuāng wài."},{"t":"vn","text":"Nhưng cậu bé không nghe lời, vẫn cứ thò đầu ra ngoài."},{"t":"cn","text":"这时爸爸悄悄地把儿子的帽子摘了下来，放在自己身后，然后对他说：“你看，风把你的帽子刮跑了。”"},{"t":"py","text":"zhè shí bàbàqiāo qiāo de bǎ ér zǐ de mào zǐ zhāi le xià lái， fàngzài zì jǐ shēn hòu， rán hòu duì tā shuō：“nǐ kàn， fēng bǎ nǐ de mào zǐ guā pǎo le.”"},{"t":"vn","text":"Lúc ấy, bố lặng lẽ tháo mũ của con đặt sau lưng mình rồi nói: “Con nhìn kìa, gió thổi bay mũ con rồi.”"},{"t":"cn","text":"儿子急得哭了，哭着要他的帽子。"},{"t":"py","text":"ér zǐ jí dé kū le， kū zhe yào tā de mào zǐ."},{"t":"vn","text":"Cậu bé cuống lên khóc, vừa khóc vừa đòi mũ."},{"t":"cn","text":"爸爸说：“好，你对着窗口吹一口气，帽子就回来了。”"},{"t":"py","text":"bàbàshuō：“hǎo， nǐ duì zhe chuāng kǒu chuī yī kǒu qì， mào zǐ jiù huí lái le.”"},{"t":"vn","text":"Bố nói: “Được rồi, con thổi một hơi về phía cửa sổ thì chiếc mũ sẽ quay lại.”"},{"t":"cn","text":"儿子就对着窗口吹了一口气，爸爸很快把帽子戴到他的头上。"},{"t":"py","text":"ér zǐ jiù duì zhe chuāng kǒu chuī le yī kǒu qì， bàbàhěn kuài bǎ mào zǐ dài dào tā de tóu shàng."},{"t":"vn","text":"Cậu bé thổi một hơi về phía cửa sổ; bố nhanh chóng đội mũ lại lên đầu con."},{"t":"cn","text":"儿子笑了，他想，这太有意思了，就一下子把爸爸的帽子摘了下来，扔到车窗外边去了，然后高兴地对爸爸说：“爸爸，快！现在该你吹气了。”"},{"t":"py","text":"ér zǐ xiào le， tā xiǎng， zhè tài yǒu yì si le， jiù yī xià zǐ bǎ bàbàde mào zǐ zhāi le xià lái， rēng dào chē chuāng wài biān qù le， rán hòu gāo xìng de duì bàbàshuō：“bàbà， kuài！ xiàn zài gāi nǐ chuī qì le.”"},{"t":"vn","text":"Cậu bé cười, nghĩ chuyện này thật thú vị. Thế là cậu tháo ngay mũ của bố, ném ra ngoài cửa sổ tàu, rồi vui vẻ nói: “Bố, nhanh lên! Bây giờ đến lượt bố thổi đấy!”"}],"60":[{"t":"note","text":"Câu 1"},{"t":"đề","text":"ĐỀ  爸爸劝儿子什么？为什么？"},{"t":"py","text":"bàbàquàn ér zǐ shén me？ wèi shén me？"},{"t":"vn","text":"Bố khuyên con điều gì và tại sao?"},{"t":"đáp án","text":"ĐÁP ÁN  爸爸劝儿子不要把头伸到窗外去，因为这样很危险。"},{"t":"py","text":"bàbàquàn ér zǐ bù yào bǎ tóu shēn dào chuāng wài qù， yīn wèi zhè yàng hěn wēi xiǎn."},{"t":"vn","text":"Đừng thò đầu ra ngoài cửa sổ vì rất nguy hiểm."},{"t":"note","text":"Câu 2"},{"t":"đề","text":"ĐỀ  儿子听爸爸的话吗？"},{"t":"py","text":"ér zǐ tīng bàbàde huà ma？"},{"t":"vn","text":"Con có nghe lời bố không?"},{"t":"đáp án","text":"ĐÁP ÁN  没有，儿子没有听爸爸的话，还是把头伸到窗外。"},{"t":"py","text":"méi yǒu， ér zǐ méi yǒu tīng bàbàde huà， hái shìbǎ tóu shēn dào chuāng wài."},{"t":"vn","text":"Không, cậu bé vẫn thò đầu ra ngoài."},{"t":"note","text":"Câu 3"},{"t":"đề","text":"ĐỀ  为什么爸爸把儿子的帽子摘下来？结果呢？"},{"t":"py","text":"wèi shén me bàbàbǎ ér zǐ de mào zǐ zhāi xià lái？ jié guǒ ne？"},{"t":"vn","text":"Vì sao bố tháo mũ của con? Kết quả?"},{"t":"đáp án","text":"ĐÁP ÁN  爸爸想让儿子不要把头伸到窗外，就悄悄地摘下他的帽子。结果儿子把爸爸的帽子扔到窗外了。"},{"t":"py","text":"bàbàxiǎng ràng ér zǐ bù yào bǎ tóu shēn dào chuāng wài， jiù qiāo qiāo de zhāi xià tā de mào zǐ. jié guǒ ér zǐ bǎ bàbàde mào zǐ rēng dào chuāng wài le."},{"t":"vn","text":"Bố muốn dạy con không thò đầu ra ngoài; cuối cùng con lại ném mũ của bố ra ngoài."},{"t":"note","text":"Câu 4"},{"t":"đề","text":"ĐỀ  通过上面的短文可见儿子的性格怎么样？"},{"t":"py","text":"tōng guò shàng miàn de duǎnwén kě jiàn ér zǐ de xìng gézěn me yàng？"},{"t":"vn","text":"Qua truyện, tính cách đứa con thế nào?"},{"t":"đáp án","text":"ĐÁP ÁN  儿子很调皮，也很天真。他相信吹一口气就能让帽子回来。"},{"t":"py","text":"ér zǐ hěn diào pí， yě hěn tiān zhēn. tā xiāngxìn chuī yī kǒu qì jiù néng ràng mào zǐ huí lái."},{"t":"vn","text":"Tinh nghịch và ngây thơ, tin rằng thổi hơi là mũ sẽ quay lại."}],"61":[{"t":"cn","text":"第二部分：翻译"},{"t":"py","text":"dìèr bù fēn： fānyì"},{"t":"vn","text":"Phần thứ hai: Luyện dịch."}],"62":[{"t":"từ mới","text":"TỪ MỚI  各"},{"t":"py","text":"gè"},{"t":"vn","text":"mỗi, từng, các"},{"t":"cn","text":"指在某个范围内的所有个体，用在名词或量词前。"},{"t":"py","text":"zhǐ zài mǒu gè fàn wéi nèi de suǒ yǒu gè tǐ， yòngzài míng cí huò liàng cí qián."},{"t":"vn","text":"Chỉ tất cả các cá thể trong một phạm vi; đặt trước danh từ hoặc lượng từ."},{"t":"cn","text":"请各位快上车，我们马上就要出发了。"},{"t":"py","text":"qǐng gè wèi kuài shàng chē， wǒ men mǎ shàng jiù yào chū fā le."},{"t":"vn","text":"Mời mọi người lên xe nhanh, chúng ta sắp xuất phát rồi."},{"t":"cn","text":"一点儿也不／没……"},{"t":"py","text":"yī diǎnér yě bù／méi……"},{"t":"vn","text":"Một chút cũng không…; hoàn toàn không…"},{"t":"cn","text":"我对这个工作一点儿也不了解。"},{"t":"py","text":"wǒ duì zhè gè gōng zuò yī diǎnér yě bù le jiě."},{"t":"vn","text":"Tôi hoàn toàn không hiểu gì về công việc này."},{"t":"cn","text":"你说的这件事我一点儿也不知道。"},{"t":"py","text":"nǐ shuō de zhè jiàn shì wǒ yī diǎnér yě bù zhī dào."},{"t":"vn","text":"Tôi hoàn toàn không biết chuyện bạn nói."} ","text":"ĐỀ GỐC — Đoạn 1: Sau khi tốt nghiệp, tôi bắt đầu đi tìm việc. Tôi chuẩn bị một bản sơ yếu lý lịch và nộp cho một công ty. Quy mô công ty không lớn nhưng sự cạnh tranh rất gay gắt vì có rất nhiều người muốn ứng tuyển. Tôi đã bỏ ra rất nhiều thời gian để chuẩn bị và quyết tâm cố gắng."},{"t":"note","text":"ĐỀ GỐC — Đoạn 2: Hôm qua, tôi đi xe điện đến công ty để phỏng vấn. Lúc đầu, tôi hơi căng thẳng, nhưng tôi cố gắng hít thở sâu để thả lỏng bản thân. Người phỏng vấn hỏi tôi rất nhiều câu hỏi về vấn đề hóa đơn của hàng hóa. Tôi cố gắng trả lời, thấy tôi phản ứng rất nhanh người phỏng vấn mỉm cười. Phỏng vấn xong, tôi nhìn lại và cảm thấy mình đã cố gắng hết sức và nhẹ nhõm hơn."},{"t":"note","text":"ĐỀ GỐC — Đoạn 3: Sau đó, tôi và một người bạn mới quen đi ăn ở một quán ăn gần công ty. Chúng tôi vừa ăn vừa nói chuyện, nói mãi mà vẫn chưa muốn về. Giả sử hôm nay không đi phỏng vấn, có lẽ chúng tôi đã không có một ngày đáng nhớ như vậy. Còn tương lai thế nào thì bây giờ chưa cần nghĩ đến."},{"t":"note","text":"Bài dịch mẫu — Đoạn 1"},{"t":"đáp án","text":"ĐÁP ÁN  毕业以后，我开始找工作。"},{"t":"py","text":"bì yè yǐ hòu， wǒ kāi shǐ zhǎogōng zuò."},{"t":"vn","text":"Sau khi tốt nghiệp, tôi bắt đầu tìm việc."},{"t":"đáp án","text":"ĐÁP ÁN  我准备了一份简历，把它交给了一家公司。"},{"t":"py","text":"wǒ zhǔn bèi le yī fèn jiǎn lì， bǎ tā jiāo gěi le yī jiā gōng sī."},{"t":"vn","text":"Tôi chuẩn bị một bản CV rồi nộp cho một công ty."},{"t":"đáp án","text":"ĐÁP ÁN  这家公司的规模不大，但是竞争很激烈，因为有很多人想来应聘。"},{"t":"py","text":"zhè jiā gōng sī de guī mó bù dà， dàn shìjìng zhēng hěn jī liè， yīn wèi yǒu hěn duō rén xiǎng lái yīng pìn."},{"t":"vn","text":"Quy mô công ty không lớn nhưng cạnh tranh rất gay gắt, vì rất nhiều người muốn ứng tuyển."},{"t":"đáp án","text":"ĐÁP ÁN  为了做好准备，我付出了很多时间，并下定决心努力奋斗。"},{"t":"py","text":"wèi le zuò hǎo zhǔn bèi， wǒ fù chū le hěn duō shí jiān， bìng xià dìng jué xīn nǔ lì fèn dòu."},{"t":"vn","text":"Để chuẩn bị chu đáo, tôi đã dành rất nhiều thời gian và quyết tâm nỗ lực."},{"t":"n const SFX=(()=>{
 const KEY='hsk-classroom-sfx-enabled-v1';
 let on=true,ctx=null;
 try{on=localStorage.getItem(KEY)!=='off';}catch(_){}
 function toggle(){on=!on;try{localStorage.setItem(KEY,on?'on':'off');}catch(_){}return on;}
 function play(result){
  if(!on)return;
  try{
   const Audio=window.AudioContext||window.webkitAudioContext;
   if(!Audio)return;
   if(!ctx)ctx=new Audio();
   if(ctx.state==='suspended')ctx.resume().catch(()=>{});
   const t=ctx.currentTime+.012;
   function note(freq,delay,duration,volume,type='sine',endFreq=0){
    const osc=ctx.createOscillator(),gain=ctx.createGain(),at=t+delay;
    osc.type=type;osc.frequency.setValueAtTime(freq,at);
    if(endFreq)osc.frequency.exponentialRampToValueAtTime(endFreq,at+duration*.85);
    gain.gain.setValueAtTime(.0001,at);
    gain.gain.exponentialRampToValueAtTime(Math.min(0.17,volume*3),at+.018);
    gain.gain.exponentialRampToValueAtTime(.0001,at+duration);
    osc.connect(gain);gain.connect(ctx.destination);
    osc.start(at);osc.stop(at+duration+.03);
   }
   if(result==='correct'||result==='right'){
    note(523.25,0,.19,.047);
    note(659.25,.085,.20,.045);
    note(783.99,.18,.28,.052);
   }else if(result==='wrong'){
    note(365,0,.30,.041,'triangle',245);
    note(235,.17,.28,.028,'sine',170);
   }
  }catch(_){/* Never stop study if audio is unavailable. */}
 }
 return {get enabled(){return on;},toggle,play};
})();

function memoryShuffle(array){for(let i=array.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[array[i],array[j]]=[array[j],array[i]];}return array;}
function memoryPrepare(){
 const d=U.memoryMode==='hanzi'?memoryBank().filter(x=>/^[\p{Script=Han}]+$/u.test(x.cn)):memoryBank();const verified=x=>U.memoryMode==='hanzi'?P.hzMemory[x.id]?.lastCorrect===true:isWordVerified(x.id);const remaining=memoryShuffle(d.filter(x=>!verified(x))),passed=memoryShuffle(d.filter(x=>verified(x)));
 U.mcqOrder=[...remaining,...passed].slice(0,10).map(x=>x.id);
 U.mcqIndex=0;U.mcqOptions={};U.mcqAnswered={};U.mcqFinished=false;U.hzDraft='';
 saveMemorySession();
}
function memoryNorm(x){return normSearch(x).replace(/[^a-z0-9\u00c0-\u1eff]+/gi,' ').trim();}
function memoryClash(a,b){
 const aa=memoryNorm(a),bb=memoryNorm(b);
 if(!aa||!bb||aa===bb||aa.includes(bb)||bb.includes(aa))return true;
 const common=(s)=>new Set(s.split(/\s+/).filter(w=>w.length>2&&!['cai','mot','con','cho','voi','theo','trong','duoc','lam','nguoi','nhung','hoac','dung'].includes(w)));
 const A=common(aa),B=common(bb);
 let match=0;for(const w of A)if(B.has(w))match++;
 return match>0&&match/Math.max(1,Math.min(A.size,B.size))>=0.72;
}
function memoryOptions(v){
 if(U.mcqOptions[v.id])return U.mcqOptions[v.id];
 const pool=D.vocab.filter(x=>x.id!==v.id&&x.cn!==v.cn&&x.vi&&!memoryClash(v.vi,x.vi));
 memoryShuffle(pool);
 pool.sort((a,b)=>(a.cat===v.cat?-5:0)+Math.abs(a.vi.length-v.vi.length)*.04-(b.cat===v.cat?-5:0)-Math.abs(b.vi.length-v.vi.length)*.04);
 const picks=[v];
 for(const x of pool){if(picks.every(y=>!memoryClash(y.vi,x.vi))){picks.push(x);if(picks.length===4)break;}}
 if(picks.length<4){for(const x of D.vocab){if(picks.length===4)break;if(x.id!==v.id&&x.vi&&!picks.some(y=>y.vi===x.vi))picks.push(x);}}
 const opts=memoryShuffle(picks.map(x=>({id:x.id,vi:x.vi})));
 U.mcqOptions[v.id]=opts;
 saveMemorySession();
 return opts;
}
function memoryChoose(selectedId){
 if(U.mcqFinished)return;
 const id=U.mcqOrder[U.mcqIndex],v=D.vocab.find(x=>x.id===id);
 if(!v||U.mcqAnswered[id]||!memoryOptions(v).some(x=>x.id===selectedId))return;
 const good=selectedId===id,prev=P.memory[id]||{};SFX.play(good?'correct':'wrong');
 U.mcqAnswered[id]={selected:selectedId,correct:good};
 P.memory[id]={attempts:(prev.attempts||0)+1,correct:(prev.correct||0)+(good?1:0),wrong:(prev.wrong||0)+(good?0:1),lastCorrect:good,lastAt:new Date().toISOString()};
 P.vocab[id]={...(P.vocab[id]||{}),status:good?'known':'review',lastReviewed:new Date().toISOString()};
 saveMemorySession();tracked();render();
}
function memoryNext(){
 if(U.mcqOrder.length===0)return;
 if(U.mcqIndex>=U.mcqOrder.length-1){
  if(!U.mcqFinished){
   U.mcqFinished=true;
   const right=Object.values(U.mcqAnswered).filter(x=>x.correct).length,key=memorySessionKey(),old=P.studyHistory[key]||{};
   P.studyHistory[key]={correct:right,total:U.mcqOrder.length,best:Math.max(right,old.best||0),rounds:(old.rounds||0)+1,completedAt:new Date().toISOString()};
  }
 }else{U.mcqIndex++;}
 saveMemorySession();render();
}

function hzNorm(x){return String(x||'').normalize('NFKC').replace(/[\s\u3000，,。.!?？！、;；:：“”"'‘’（）()【】\[\]{}〈〉《》·]/g,'');}
function hzStage(i){const h=P.studyHistory['hanzi:unit:'+i],q=P.studySessions['hanzi:unit:'+i];return (h?'Gõ Hán: '+h.correct+'/'+h.total+' đúng':'')+(q&&!q.finished?' · đang làm '+Object.keys(q.answered||{}).length+'/'+q.order.length:'');}
function hzCheck(){
 const id=U.mcqOrder[U.mcqIndex],v=D.vocab.find(x=>x.id===id);
 if(U.mcqFinished||!v||U.mcqAnswered[id])return;
 const raw=String(document.getElementById('hzInput')?.value??U.hzDraft??'').trim(),value=hzNorm(raw);
 if(!value){message('Bạn cần nhập chữ Hán trước khi chấm.');return;}
 if(!/^[\p{Script=Han}]+$/u.test(value)){message('Chỉ nhập chữ Hán, không chấp nhận pinyin.');return;}
 const good=value===hzNorm(v.cn),p=P.hzMemory[id]||{};
 U.mcqAnswered[id]={correct:good,typed:raw};U.hzDraft=raw;
 P.hzMemory[id]={attempts:(p.attempts||0)+1,correct:(p.correct||0)+(good?1:0),wrong:(p.wrong||0)+(good?0:1),lastCorrect:good,lastAt:new Date().toISOString()};
 P.vocab[id]={...(P.vocab[id]||{}),status:good?'known':'review',lastReviewed:new Date().toISOString()};
 SFX.play(good?'correct':'wrong');saveMemorySession();tracked();render();
}
function hzBody(){

 if(hit.dataset.vocab){setVocab(hit.dataset.vocab,hit.dataset.status);return}
 if(hit.dataset.cfilter){U.cardFilter=hit.dataset.cfilter;U.cardShuffle=false;U.cardOrder=[];U.cardIndex=0;U.cardFlipped=false;render();return}
 if(hit.dataset.grammar){U.grammarTab=Number(hit.dataset.grammar);render();return}
 if(hit.dataset.qfilter){U.quizFilter=hit.dataset.qfilter;U.quizIndex=0;U.quizResult=null;U.quizDraft='';render();return}
 if(hit.dataset.qmode){U.quizMode=hit.dataset.qmode;U.quizFilter='all';U.quizIndex=0;U.quizResult=null;U.quizDraft='';render();return}
 if(hit.dataset.qsave){setQuiz(hit.dataset.qid,hit.dataset.qtype,hit.dataset.qsave);return}
 if(hit.dataset.speak){speak(hit.dataset.speak);return}
 if(hit.dataset.act&&acts[hit.dataset.act]){acts[hit.dataset.act]();return}
});
document.addEventListener('input',ev=>{if(ev.target.id==='searchVocab'){U.search=ev.target.value;U.vocabPage=0;const pane=document.getElementById('vocab-results');if(pane)pane.outerHTML=vocabList();}else if(ev.target.id==='quizDraft'){U.quizDraft=ev.target.value;saveStudyView();}else if(ev.target.id==='hzInput'){U.hzDraft=ev.target.value;saveMemorySession();}});
document.addEventListener('submit',ev=>{if(ev.target?.id==='hzForm'){ev.preventDefault();hzCheck();}});
document.addEventListener('change',ev=>{if(ev.target.id==='readerGroup'){U.readerGroup=ev.target.value;render()}});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.id==='gotoPage'){gotoPage(ev.target.value);return}if(U.tab==='cards'&&!['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)){if(U.memoryMode==='choice'){if(/^[1-4]$/.test(ev.key)&&!U.mcqFinished){const id=U.mcqOrder[U.mcqIndex],v=D.vocab.find(x=>x.id===id);if(v){const options=memoryOptions(v),picked=options[Number(ev.key)-1];if(picked){ev.preventDefault();memoryChoose(picked.id)}}}else if(ev.key==='Enter'&&!U.mcqFinished&&U.mcqAnswered[U.mcqOrder[U.mcqIndex]]){ev.preventDefault();memoryNext()}}else if(U.memoryMode==='flashcard'){if(ev.key==='ArrowRight'){ev.preventDefault();advanceCards(1)}if(ev.key==='ArrowLeft'){ev.preventDefault();advanceCards(-1)}if(ev.key===' '){ev.preventDefault();U.cardFlipped=!U.cardFlipped;render()}}}});
window.addEventListener('hashchange',()=>{const section=location.hash.replace('#','');if(mainSections.some(a=>a[0]===section)&&U.tab!==section){U.tab=section;render()}});
let incoming=location.hash.replace('#','');if(mainSections.some(a=>a[0]===incoming))U.tab=incoming;
render();
})();

  </script>
</body>
