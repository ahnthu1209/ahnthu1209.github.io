a phần, tổng cộng 5 câu."},{"t":"cn","text":"1听后复述（2 题）"},{"t":"py","text":"1 tīng hòu fù shù （ 2 tí ）"},{"t":"vn","text":"1. Nghe rồi thuật lại (hai câu)."},{"t":"cn","text":"2看图说话（1 题）"},{"t":"py","text":"2 kàn tú shuō huà （ 1 tí ）"},{"t":"vn","text":"2. Nhìn tranh rồi nói (một câu)."},{"t":"cn","text":"3回答问题（2 题）"},{"t":"py","text":"3 huí dá wèn tí （ 2 tí ）"},{"t":"vn","text":"3. Trả lời câu hỏi (hai câu)."},{"t":"cn","text":"二、全部考试约20 分钟（含准备时间10 分钟）。"},{"t":"py","text":"èr, quán bù kǎo shì yuē 2 0 fēn zhōng （ hán zhǔn bèi shí jiān 1 0 fēn zhōng ）."},{"t":"vn","text":"Phần II: Tổng thời gian thi khoảng 20 phút, gồm 10 phút chuẩn bị."}],"79":[{"t":"cn","text":"第一部分"},{"t":"py","text":"dì yī bù fēn"},{"t":"vn","text":"Phần thứ nhất."},{"t":"cn","text":"第1-2题：听后复述（每题40秒）"},{"t":"py","text":"dì 1 - 2 tí: tīng hòu fù shù （ měi tí 4 0 miǎo ）"},{"t":"vn","text":"Câu 1–2: Nghe và thuật lại (mỗi câu 40 giây)."}],"80":[{"t":"cn","text":"第二部分"},{"t":"py","text":"dì èr bù fēn"},{"t":"vn","text":"Phần thứ hai."},{"t":"cn","text":"第3题：看图说话（2分钟）"},{"t":"py","text":"dì 3 tí: kàn tú shuō huà （ 2 fēn zhōng ）"},{"t":"vn","text":"Câu 3: Nhìn tranh nói (2 phút)."}],"81":[{"t":"cn","text":"一、开头：大学生活"},{"t":"py","text":"yī, kāi tóu: dà xué shēng huó"},{"t":"vn","text":"I. Mở đầu: cuộc sống đại học."},{"t":"cn","text":"大学生活→重要的时光"},{"t":"py","text":"dà xué shēng huó → zhòng yào de shí guāng"},{"t":"vn","text":"Cuộc sống đại học → quãng thời gian quan trọng."},{"t":"cn","text":"学习知识→认识朋友→为未来做准备"},{"t":"py","text":"xué xí zhī shí → rèn shí péng yǒu → wèi wèi lái zuò zhǔn bèi"},{"t":"vn","text":"Học kiến thức → kết bạn → chuẩn bị cho tương lai."},{"t":"cn","text":"二、主体：故事发展"},{"t":"py","text":"èr, zhǔ tǐ: gù shì fā zhǎn"},{"t":"vn","text":"II. Thân bài: diễn biến câu chuyện."},{"t":"cn","text":"①大学期间：一起学习"},{"t":"py","text":"① dà xué qī jiān: yì qǐ xué xí"},{"t":"vn","text":"(1) Trong những năm đại học: cùng học tập."},{"t":"cn","text":"几个好朋友→一起学习"},{"t":"py","text":"jǐ gè hǎo péng yǒu → yì qǐ xué xí"},{"t":"vn","text":"Một vài người bạn thân → cùng học tập."},{"t":"cn","text":"看书、讨论、互相帮助"},{"t":"py","text":"kàn shū, tǎo lùn, hù xiāng bāng zhù"},{"t":"vn","text":"Đọc sách, thảo luận, giúp đỡ nhau."},{"t":"cn","text":"努力完成学业"},{"t":"py","text":"nǔ lì wán chéng xué yè"},{"t":"vn","text":"Nỗ lực hoàn thành việc học."},{"t":"cn","text":"②几年以后：顺利毕业"},{"t":"py","text":"② jǐ nián yǐ hòu: shùn lì bì yè"},{"t":"vn","text":"(2) Vài năm sau: tốt nghiệp thuận lợi."},{"t":"cn","text":"几年努力→终于毕业"},{"t":"py","text":"jǐ nián nǔ lì → zhōng yú bì yè"},{"t":"vn","text":"Nỗ lực nhiều năm → cuối cùng tốt nghiệp."},{"t":"cn","text":"穿毕业服→扔毕业帽"},{"t":"py","text":"chuān bì yè fú → rēng bì yè mào"},{"t":"vn","text":"Mặc áo tốt nghiệp → tung mũ tốt nghiệp."},{"t":"cn","text":"开心、激动"},{"t":"py","text":"kāi xīn, jī dòng"},{"t":"vn","text":"Vui vẻ, xúc động."},{"t":"cn","text":"③毕业以后：一起庆祝"},{"t":"py","text":"③ bì yè yǐ hòu: yì qǐ qìng zhù"},{"t":"vn","text":"(3) Sau tốt nghiệp: cùng ăn mừng."},{"t":"cn","text":"一起吃饭、喝饮料"},{"t":"py","text":"yì qǐ chī fàn, hē yǐn liào"},{"t":"vn","text":"Cùng ăn uống."},{"t":"cn","text":"聊天、回忆大学生活"},{"t":"py","text":"liáo tiān, huí yì dà xué shēng huó"},{"t":"vn","text":"Trò chuyện, nhớ lại cuộc sống đại học."},{"t":"cn","text":"对未来充满希望"},{"t":"py","text":"duì wèi lái chōng mǎn xī wàng"},{"t":"vn","text":"Tràn đầy hy vọng về tương lai."},{"t":"cn","text":"三、结尾：感受"},{"t":"py","text":"sān, jiē wěi: gǎn shòu"},{"t":"vn","text":"III. Kết bài: cảm nhận."},{"t":"cn","text":"大学生活→有辛苦，也有快乐"},{"t":"py","text":"dà xué shēng huó → yǒu xīn kǔ, yě yǒu kuài lè"},{"t":"vn","text":"Cuộc sống đại học → có vất vả, cũng có niềm vui."},{"t":"cn","text":"收获→友情、成长、知识"},{"t":"py","text":"shōu huò → yǒu qíng, chéng zhǎng, zhī shí"},{"t":"vn","text":"Nhận được → tình bạn, sự trưởng thành, kiến thức."},{"t":"cn","text":"珍惜大学时光"},{"t":"py","text":"zhēn xī dà xué shí guāng"},{"t":"vn","text":"Trân trọng những năm tháng đại học."}],"82":[{"t":"cn","text":"大学生活是人生中非常重要的一段时光。在大学里，我们可以学习知识，也可以认识很多好朋友。"},{"t":"py","text":"dà xué shēng huó shì rén shēng zhōng fēi cháng zhòng yào de yí duàn shí guāng. zài dà xué lǐ, wǒ men kě yǐ xué xí zhī shí, yě kě yǐ rèn shí hěn duō hǎo péng yǒu."},{"t":"vn","text":"Cuộc sống đại học là một khoảng thời gian rất quan trọng trong đời người. Ở trường đại học, chúng ta có thể học kiến thức và quen biết nhiều người bạn tốt."},{"t":"cn","text":"小王、小李和小张是大学同学，也是好朋友。上大学的时候，他们经常一起学习，看书、讨论问题，遇到困难就互相帮助。虽然学习很辛苦，但是他们一直很努力。"},{"t":"py","text":"xiǎo wáng, xiǎo lǐ hé xiǎo zhāng shì dà xué tóng xué, yě shì hǎo péng yǒu. shàng dà xué de shí hou, tā men jīng cháng yì qǐ xué xí, kàn shū, tǎo lùn wèn tí, yù dào kùn nán jiù hù xiāng bāng zhù. suī rán xué xí hěn xīn kǔ, dàn shì tā men yì zhí hěn nǔ lì."},{"t":"vn","text":"Tiểu Vương, Tiểu Lý và Tiểu Trương là bạn học đại học, cũng là bạn thân. Khi học đại học, họ thường cùng học, đọc sách, bàn luận vấn đề; gặp khó khăn thì giúp đỡ nhau. Dù học hành vất vả, họ vẫn luôn nỗ lực."},{"t":"cn","text":"几年以后，他们终于毕业了。毕业那天，大家穿着毕业服，高兴地把毕业帽扔向空中。他们都非常开心，也为自己的努力感到骄傲。"},{"t":"py","text":"jǐ nián yǐ hòu, tā men zhōng yú bì yè le. bì yè nà tiān, dà jiā chuān zhe bì yè fú, gāo xìng de bǎ bì yè mào rēng xiàng kōng zhōng. tā men dōu fēi cháng kāi xīn, yě wèi zì jǐ de nǔ lì gǎn dào jiāo ào."},{"t":"vn","text":"Vài năm sau, cuối cùng họ tốt nghiệp. Trong ngày tốt nghiệp, mọi người mặc áo cử nhân, vui vẻ tung mũ lên trời. Ai cũng rất vui và tự hào về những cố gắng của mình."},{"t":"cn","text":"毕业以后，他们一起吃饭、喝饮料，聊天，还回忆了以前的大学生活。虽然以后可能会去不同的地方，但是他们都对未来充满希望。"},{"t":"py","text":"bì yè yǐ hòu, tā men yì qǐ chī fàn, hē yǐn liào, liáo tiān, hái huí yì le yǐ qián de dà xué shēng huó. suī rán yǐ hòu kě néng huì qù bù tóng de dì fang, dàn shì tā men dōu duì wèi lái chōng mǎn xī wàng."},{"t":"vn","text":"Sau lễ tốt nghiệp, họ cùng ăn, uống nước, trò chuyện và ôn lại những ngày đại học. Tuy sau này có thể đi đến những nơi khác nhau, họ đều đầy hy vọng vào tương lai."},{"t":"cn","text":"我觉得大学生活虽然有辛苦，但是也有很多快乐。我们不仅学到了知识，还收获了珍贵的友情。这是一段值得珍惜的时光。"},{"t":"py","text":"wǒ jué de dà xué shēng huó suī rán yǒu xīn kǔ, dàn shì yě yǒu hěn duō kuài lè. wǒ men bù jǐn xué dào le zhī shí, hái shōu huò le zhēn guì de yǒu qíng. zhè shì yí duàn zhí dé zhēn xī de shí guāng."},{"t":"vn","text":"Tôi nghĩ cuộc sống đại học có những lúc vất vả nhưng cũng có rất nhiều niềm vui. Chúng ta không chỉ học được kiến thức mà còn có được những tình bạn quý giá. Đó là khoảng thời gian đáng trân trọng."}],"83":[{"t":"cn","text":"一、开头：我觉得周末是我们放松自己、安排生活的好时间。"},{"t":"py","text":"yī, kāi tóu: wǒ jué de zhōu mò shì wǒ men fàng sōng zì jǐ, ān pái shēng huó de hǎo shí jiān."},{"t":"vn","text":"I. Mở đầu: Tôi nghĩ cuối tuần là lúc để thư giãn và sắp xếp cuộc sống."},{"t":"cn","text":"二、主体"},{"t":"py","text":"èr, zhǔ tǐ"},{"t":"vn","text":"II. Thân bài."},{"t":"cn","text":"上午：起床 → 吃早饭→ 学习→ 做作业…"},{"t":"py","text":"shàng wǔ: qǐ chuáng → chī zǎo fàn → xué xí → zuò zuò yè …"},{"t":"vn","text":"Buổi sáng: thức dậy, ăn sáng, học và làm bài tập."},{"t":"cn","text":"下午:出去→ 聊天→ 放松…"},{"t":"py","text":"xià wǔ: chū qù → liáo tiān → fàng sōng …"},{"t":"vn","text":"Buổi chiều: ra ngoài, trò chuyện, thư giãn."},{"t":"cn","text":"晚上：做家务→ 吃晚饭→ 早睡…"},{"t":"py","text":"wǎn shàng: zuò jiā wù → chī wǎn fàn → zǎo shuì …"},{"t":"vn","text":"Buổi tối: làm việc nhà, ăn tối, ngủ sớm."},{"t":"cn","text":"三、结尾"},{"t":"py","text":"sān, jiē wěi"},{"t":"vn","text":"III. Kết bài."},{"t":"cn","text":"我觉得……既可以休息，也可以学习，让我觉得很充实。"},{"t":"py","text":"wǒ jué de … … jì kě yǐ xiū xī, yě kě yǐ xué xí, ràng wǒ jué de hěn chōng shí."},{"t":"vn","text":"Tôi nghĩ ... vừa có thể nghỉ ngơi vừa có thể học tập, khiến tôi cảm thấy rất ý nghĩa."},{"t":"cn","text":"4周末你一般是怎么安排的？（2分钟）"},{"t":"py","text":"4 zhōu mò nǐ yī bān shì zěn me ān pái de? （ 2 fēn zhōng ）"},{"t":"vn","text":"Câu 4: Cuối tuần bạn thường sắp xếp thời gian như thế nào? (2 phút)"},{"t":"label","text":"TRẢ LỜI MẪU"},{"t":"acn","text":"周末我一般会安排学习、休息和运动。星期六早上，我通常七点半起床，吃完早饭以后学两个小时的汉语，然后做作业。下午，我喜欢和朋友出去喝咖啡、聊天，有时候也去公园散步。星期天上午，我会收拾房间，洗衣服，下午看看书或者运动。晚上，我和家人一起吃饭，然后准备下周的计划。我觉得这样的安排既能让我好好休息，也能让我继续学习，周末过得很充实。"},{"t":"apy","text":"zhōu mòwǒ yī bān huì ān pái xué xí, xiū xīhé yùn dòng. xīng qī liù zǎoshàng， wǒ tōng cháng qī diǎnbàn qǐ chuáng， chī wán zǎofàn yǐ hòu xué liǎng gè xiǎo shí de hàn yǔ， rán hòu zuò zuò yè. xià wǔ， wǒ xǐ huān hé péng yǒu chū qù hē kā fēi, liáo tiān， yǒu shí hòu yě qù gōng yuán sàn bù. xīng qī tiān shàng wǔ， wǒ huì shōu shífángjiān， xǐ yī fú， xià wǔ kàn kàn shū huò zhě yùn dòng. wǎn shàng， wǒ hé jiā rén yī qǐ chī fàn， rán hòu zhǔn bèi xià zhōu de jì huà. wǒ jué dé zhè yàng de ān pái jì néng ràng wǒ hǎo hǎo xiū xī， yě néng ràng wǒ jì xùxué xí， zhōu mòguò dé hěn chōng shí."},{"t":"avn","text":"Cuối tuần tôi thường sắp xếp thời gian học, nghỉ và vận động. Sáng thứ Bảy tôi thường dậy lúc 7 giờ 30, ăn sáng xong học tiếng Trung hai tiếng rồi làm bài tập. Buổi chiều, tôi thích đi uống cà phê, trò chuyện với bạn, đôi khi đi dạo công viên. Sáng Chủ nhật tôi dọn nhà, giặt quần áo; chiều đọc sách hoặc tập thể dục. Tối tôi ăn cơm cùng gia đình rồi chuẩn bị kế hoạch tuần tới. Tôi thấy cách sắp xếp này vừa giúp nghỉ ngơi, vừa giúp tiếp tục học tập, khiến cuối tuần rất ý nghĩa."},{"t":"cn","text":"第三部分"},{"t":"py","text":"dì sān bù fēn"},{"t":"vn","text":"Phần thứ ba."},{"t":"cn","text":"第3-4题：回答问题。"},{"t":"py","text":"dì 3 - 4 tí: huí dá wèn tí."},{"t":"vn","text":"Câu 3–4: Trả lời câu hỏi."}],"84":[{"t":"vn","text":"Trang này trong PDF gốc chỉ có nội dung tiếng Việt; giữ nguyên thứ tự nội dung ở ảnh phía trên."},{"t":"image-text","text":"BTVN 11.2"},{"t":"image-text","text":"1. BTVN là quay video làm câu 3 (tả tranh) và câu 5 (lập dàn ý và quay nói), mỗi câu nói trong vòng 2 phút. Lưu ý quay video nhìn thấy mặt"},{"t":"image-text","text":"2. BT thêm: Làm BT dịch thêm + quay video nói tóm tắt bài khoá bằng tiếng Trung"},{"t":"image-text","text":"3. Chép và học trước slide bài tiếp theo"}],"85":[{"t":"cn","text":"5父亲或母亲过生日时，你想送他（她）什么礼物？（2分钟）"},{"t":"py","text":"5 fù qīn huò mǔ qīn guò shēng rì shí, nǐ xiǎng sòng tā （ tā ） shén me lǐ wù? （ 2 fēn zhōng ）"},{"t":"vn","text":"Câu 5: Khi bố hoặc mẹ sinh nhật, bạn muốn tặng ông/bà món quà gì? (2 phút)."},{"t":"label","text":"TRẢ LỜI MẪU"},{"t":"acn","text":"妈妈过生日的时候，我想送她一份特别的礼物。我打算先买一束她喜欢的花，再亲手做一张生日卡片，写上我对她的感谢。除此以外，我还想陪妈妈一起吃饭，因为平时她很忙，我们很少有时间坐下来好好聊天。如果有机会，我希望带她去一个安静、风景漂亮的地方旅行，让她放松一下。我觉得礼物不一定要很贵，最重要的是心意和陪伴。希望妈妈每天都健康、开心，也希望以后我能有更多时间陪她。"},{"t":"apy","text":"mā mā guò shēng rì de shí hòu， wǒ xiǎng sòng tā yī fèn tèbié de lǐwù. wǒ dǎ suàn xiān mǎi yī shù tā xǐ huān de huā， zài qīn shǒu zuò yī zhāng shēng rì kǎ piàn， xiě shàng wǒ duì tā de gǎn xiè. chú cǐ yǐ wài， wǒ hái xiǎng péi mā mā yī qǐ chī fàn， yīn wèi píng shí tā hěn máng， wǒ men hěn shǎo yǒu shí jiān zuò xià lái hǎo hǎo liáo tiān. rú guǒ yǒu jīhuì， wǒ xī wàng dài tā qù yī gè ān jìng, fēng jǐngpiào liàng de de fānglǚ xíng， ràng tā fàngsōngyī xià. wǒ jué dé lǐwùbù yī dìng yào hěn guì， zuì zhòng yào de shìxīn yì hé péi bàn. xī wàng mā mā měi tiān dōu jiàn kāng, kāi xīn， yě xī wàng yǐ hòu wǒ néng yǒu gèng duō shí jiān péi tā."},{"t":"avn","text":"Vào sinh nhật mẹ, tôi muốn tặng mẹ món quà đặc biệt. Tôi định mua bó hoa mẹ thích và tự tay làm thiệp sinh nhật để viết lời cảm ơn. Tôi còn muốn cùng mẹ ăn một bữa cơm vì ngày thường mẹ rất bận, chúng tôi ít có thời gian ngồi trò chuyện. Nếu có cơ hội, tôi muốn đưa mẹ đi du lịch đến một nơi yên tĩnh, phong cảnh đẹp để mẹ thư giãn. Tôi nghĩ món quà không cần đắt, quan trọng nhất là tấm lòng và sự đồng hành. Tôi mong mẹ luôn khỏe mạnh, vui vẻ và tôi có thể dành thêm nhiều thời gian bên mẹ."}],"86":[{"t":"cn","text":"舒适"},{"t":"py","text":"shū shì"},{"t":"vn","text":"Thoải mái."},{"t":"cn","text":"居民"},{"t":"py","text":"jū mín"},{"t":"vn","text":"Cư dân."},{"t":"cn","text":"教育"},{"t":"py","text":"jiào yù"},{"t":"vn","text":"Giáo dục."},{"t":"cn","text":"污染"},{"t":"py","text":"wū rǎn"},{"t":"vn","text":"Ô nhiễm."}],"87":[{"t":"cn","text":"住在城市的好处之一是需要的东西都离家很近：商店、超市、学校、医院和别的地方。"},{"t":"py","text":"zhù zài chéng shì de hǎo chù zhī yī shì xū yào de dōng xi dōu lí jiā hěn jìn: shāng diàn, chāo shì, xué xiào, yī yuàn hé bié de dì fang."},{"t":"vn","text":"Một trong những lợi ích của việc sống ở thành phố là những thứ ta cần đều ở gần nhà: cửa hàng, siêu thị, trường học, bệnh viện và nhiều nơi khác."},{"t":"cn","text":"另外，城市地生活也更舒适。而且，如果你是城市居民，你可以选择更好的学校和更高的教育质量。这里有很多娱乐设施，比如电影院、水上公园、博物馆和体育设施。"},{"t":"py","text":"lìng wài, chéng shì de shēng huó yě gèng shū shì. ér qiě, rú guǒ nǐ shì chéng shì jū mín, nǐ kě yǐ xuǎn zé gèng hǎo de xué xiào hé gèng gāo de jiào yù zhì liàng. zhè lǐ yǒu hěn duō yú lè shè shī, bǐ rú diàn yǐng yuàn, shuǐ shàng gōng yuán, bó wù guǎn hé tǐ yù shè shī."},{"t":"vn","text":"Ngoài ra, cuộc sống thành phố cũng thoải mái hơn. Hơn nữa, nếu là cư dân thành thị, bạn có thể chọn trường học tốt hơn và chất lượng giáo dục cao hơn. Ở đây có nhiều cơ sở giải trí như rạp chiếu phim, công viên nước, bảo tàng và các cơ sở thể thao."},{"t":"cn","text":"但是，住在城市也有一些不利的。城市里的空气污染很严重。"},{"t":"py","text":"dàn shì, zhù zài chéng shì yě yǒu yì xiē bù lì de. chéng shì lǐ de kōng qì wū rǎn hěn yán zhòng."},{"t":"vn","text":"Tuy nhiên, sống ở thành phố cũng có một số bất lợi. Ô nhiễm không khí ở thành phố rất nghiêm trọng. Dân số thành thị quá đông nên cũng thường xuyên xảy ra tắc đường."},{"t":"cn","text":"城市人口过多所以也经常堵车。"},{"t":"py","text":"chéng shì rén kǒu guò duō suǒ yǐ yě jīng cháng dǔ chē."},{"t":"vn","text":"Dân số thành phố quá đông nên thường xuyên xảy ra tắc đường."}],"88":[{"t":"cn","text":"叙述课文1："},{"t":"py","text":"xù shù kè wén 1:"},{"t":"vn","text":"Thuật lại bài khóa 1."},{"t":"cn","text":"•秋天。。。做客"},{"t":"py","text":"• qiū tiān... zuò kè"},{"t":"vn","text":"Mùa thu... đến nhà làm khách."},{"t":"cn","text":"•等车的人。。。打的"},{"t":"py","text":"• děng chē de rén... dǎ dī"},{"t":"vn","text":"Người đợi xe... đi taxi."},{"t":"cn","text":"•田芳。。。。四合院。。。红枣。。。甜"},{"t":"py","text":"• tián fāng.... sì hé yuàn... hóng zǎo... tián"},{"t":"vn","text":"Điền Phương... nhà tứ hợp viện... táo đỏ... ngọt."},{"t":"cn","text":"•四合院。。。越来越。。"},{"t":"py","text":"• sì hé yuàn... yuè lái yuè.."},{"t":"vn","text":"Nhà tứ hợp viện... ngày càng ít."},{"t":"cn","text":"•大楼。。漂亮。。搬走"},{"t":"py","text":"• dà lóu.. piào liàng.. bān zǒu"},{"t":"vn","text":"Nhà cao tầng... đẹp hơn... chuyển đi."},{"t":"label","text":"BÀI TÓM TẮT MẪU"},{"t":"acn","text":"秋天的一天，田芳请张东、玛丽和麦克到她家做客。等车的人越来越多了，田芳建议大家打的去。玛丽看见前边开过来一辆空车，就说坐那辆车。田芳家住在四合院里，院子里种着一棵大枣树，树上结着很多很甜的红枣。现在城市里的大楼越盖越多，住宅小区越建越漂亮，住四合院的人越来越少了。田芳虽然舍不得离开小院，但是也希望早点儿搬进现代化的楼房。"},{"t":"apy","text":"qiū tiān de yī tiān， tián fāng qǐng zhāng dōng, mǎ lì hé mài kè dào tā jiā zuò kè. děng chē de rén yuè lái yuè duō le， tián fāng jiàn yì dà jiā dǎ de qù. mǎ lì kàn jiàn qián biān kāi guò lái yī liàng kōngchē， jiù shuō zuò nà liàng chē. tián fāng jiā zhù zài sì hé yuàn lǐ， yuàn zǐ lǐ zhòng zhe yī kē dà zǎo shù， shù shàng jié zhe hěn duō hěn tián de hóng zǎo. xiàn zài chéng shì lǐ de dà lóuyuè gài yuè duō， zhù zhái xiǎo qū yuè jiàn yuè piào liàng， zhù sì hé yuàn de rén yuè lái yuè shǎo le. tián fāng suī rán shě bù dé líkāi xiǎo yuàn， dàn shìyě xī wàng zǎodiǎnér bānjìn xiàn dài huà de lóufáng."},{"t":"avn","text":"Một ngày mùa thu, Điền Phương mời Trương Đông, Mary và Mike đến nhà chơi. Người chờ xe ngày càng đông nên cô đề nghị đi taxi. Mary nhìn thấy một chiếc taxi trống chạy từ phía trước tới và đề nghị đi chiếc đó. Nhà Điền Phương là tứ hợp viện, trong sân có một cây táo tàu lớn với nhiều quả rất ngọt. Hiện nay nhà cao tầng và khu dân cư xây ngày càng nhiều, càng đẹp, nên người ở tứ hợp viện ngày càng ít. Dù không nỡ rời sân nhà nhỏ, Điền Phương vẫn mong sớm chuyển đến một tòa nhà hiện đại."}],"89":[{"t":"cn","text":"叙述课文2："},{"t":"py","text":"xù shù kè wén 2:"},{"t":"vn","text":"Thuật lại bài khóa 2."},{"t":"cn","text":"学了两个多月汉语了。……谈谈……"},{"t":"py","text":"xué le liǎng gè duō yuè hàn yǔ le. … … tán tán … …"},{"t":"vn","text":"Đã học tiếng Trung hơn hai tháng, chia sẻ cảm nghĩ."},{"t":"cn","text":"玛丽：气候 => 感冒"},{"t":"py","text":"mǎ lì: qì hòu = > gǎn mào"},{"t":"vn","text":"Mary: Khí hậu → bị cảm."},{"t":"cn","text":"麦克：汉语"},{"t":"py","text":"mài kè: hàn yǔ"},{"t":"vn","text":"Mike: Việc học tiếng Trung."},{"t":"cn","text":"玛丽：朋友"},{"t":"py","text":"mǎ lì: péng yǒu"},{"t":"vn","text":"Mary: Bạn bè."},{"t":"cn","text":"麦克：朋友越多……"},{"t":"py","text":"mài kè: péng yǒu yuè duō … …"},{"t":"vn","text":"Mike: Bạn bè càng nhiều càng tốt."},{"t":"cn","text":"山本：中国菜……=>胖"},{"t":"py","text":"shān běn: zhōng guó cài … … = > pàng"},{"t":"vn","text":"Yamamoto: Món Trung Quốc → tăng cân."},{"t":"cn","text":"麦克：生活/  打扮"},{"t":"py","text":"mài kè: shēng huó / dǎ ban"},{"t":"vn","text":"Mike: Cuộc sống, cách ăn diện."},{"t":"cn","text":"玛丽：圣诞节和新年……圣诞树"},{"t":"py","text":"mǎ lì: shèng dàn jié hé xīn nián … … shèng dàn shù"},{"t":"vn","text":"Mary: Giáng sinh, năm mới, cây thông."},{"t":"cn","text":"麦克：中国人过圣诞节？"},{"t":"py","text":"mài kè: zhōng guó rén guò shèng dàn jié?"},{"t":"vn","text":"Mike: Người Trung Quốc có đón Giáng sinh không?"},{"t":"cn","text":"老师：一般的……有的人……孩子们……不过，最大……"},{"t":"py","text":"lǎo shī: yī bān de … … yǒu de rén … … hái zǐ men … … bù guò, zuì dà … …"},{"t":"vn","text":"Thầy: Các gia đình thông thường..., có người..., trẻ em..., nhưng ngày lễ lớn nhất..."},{"t":"cn","text":"麦克：建议……"},{"t":"py","text":"mài kè: jiàn yì … …"},{"t":"vn","text":"Mike: Đề xuất tổ chức liên hoan."},{"t":"label","text":"BÀI TÓM TẮT MẪU"},{"t":"acn","text":"王老师请同学们谈谈学汉语两个多月以来的感想和体会。玛丽说，刚来北京的时候她不习惯气候，经常感冒，现在越来越习惯了。麦克觉得汉语越学越有意思，朋友也越来越多。山本很喜欢中国菜，越吃越胖。麦克觉得人们的生活越来越丰富，年轻人越来越会打扮。玛丽发现很多商店摆着圣诞树。王老师说，中国有些人过圣诞节，但是最大的节日还是春节。最后，麦克建议大家开一个新年联欢会，王老师同意了。"},{"t":"apy","text":"wáng lǎo shī qǐng tóng xué men tán tán xué hàn yǔ liǎng gè duō yuè yǐ lái de gǎn xiǎng hé tǐ huì. mǎ lì shuō， gāng lái běi jīng de shí hòu tā bù xí guànqì hòu， jīng cháng gǎn mào， xiàn zài yuè lái yuè xí guànle. mài kè jué dé hàn yǔ yuè xué yuè yǒu yì sī， péng yǒu yě yuè lái yuè duō. shān běnhěn xǐ huān zhōng guó cài， yuè chī yuè pàng. mài kè jué dé rén men de function vocabList(){let arr=D.vocab.filter(v=>{

<div class="nav-pages"><button class="btn small outline" data-act="vocabPrev" ${U.vocabPage<=0?'disabled':''}>← Trước</button><span>Trang ${U.vocabPage+1} / ${total}</span><button class="btn small outline" data-act="vocabNext" ${U.vocabPage>=total-1?'disabled':''}>Tiếp →</button></div></div>`}
function vocab(){return heading('01 · TỪ VỰNG','Kho từ vựng Bài 11','41 từ chính · 14 từ bổ sung · 48 cụm/mẫu câu đã được xác định từ tài liệu; không tách đoán từ từng câu văn.')+`<div class="toolbar"><label class="search">⌕ <input id="searchVocab" type="search" placeholder="Tìm chữ Hán, pinyin, nghĩa Việt hoặc số trang..." value="${attr(U.search)}" autocomplete="off"></label></div><div class="chips" style="margin-bottom:16px">${[['all','Tất cả'],['core','41 từ chính'],['extra','14 từ bổ sung'],['phrases','Cụm/mẫu câu'],['review','Cần ôn'],['known','Đã thuộc']].map(([id,name])=>`<button class="chip ${U.vocabFilter===id?'active':''}" data-vfilter="${id}">${e(name)}</button>`).join('')}</div>${vocabList()}`}
function cardDeck(){let deck=D.vocab.filter(v=>U.cardFilter==='all'||(U.cardFilter==='core'&&v.cat==='Từ vựng chính')||(U.cardFilter==='extra'&&v.cat==='Từ vựng bổ sung')||(U.cardFilter==='phrases'&&v.cat==='Cụm từ trong bài')||(U.cardFilter==='review'&&vstatus(v.id)==='review')||(U.cardFilter==='new'&&vstatus(v.id)!=='known'));
 if(U.cardShuffle&&U.cardOrder.length){const ids=U.cardOrder;deck.sort((a,b)=>ids.indexOf(a.id)-ids.indexOf(b.id))}

function memoryBank(){
 return D.vocab.filter(v=>v.cn&&v.vi&&(
 U.mcqFilter==='all'||
 (U.mcqFilter==='core'&&v.cat==='Từ vựng chính')||

 (U.mcqFilter==='review'&&vstatus(v.id)==='review')));
}
function memoryShuffle(array){for(let i=array.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[array[i],array[j]]=[array[j],array[i]];}return array;}
function memoryPrepare(){
 const ids=memoryShuffle(memoryBank().map(x=>x.id));
 U.mcqOrder=ids.slice(0,10);
 U.mcqIndex=0;U.mcqOptions={};U.mcqAnswered={};U.mcqFinished=false;
}
function memoryNorm(x){return normSearch(x).replace(/[^a-z0-9\u00c0-\u1eff]+/gi,' ').trim();}
function memoryClash(a,b){
 const aa=memoryNorm(a),bb=memoryNorm(b);
 if(!aa||!bb||aa===bb||aa.includes(bb)||bb.includes(aa))return true;
 const common=(s)=>new Set(s.split(/\s+/).filter(w=>w.length>2&&!['cai','mot','con','cho','voi','theo','trong','duoc','lam','nguoi','nhung','hoac','dung'].includes(w)));
 const A=common(aa),B=common(bb);
 let match=0;for(const w of A)if(B.has(w))match++;
 return match>0&&match/Math.max(1,Math.min(A.size,B.size))>=0.72;
}
function memoryOptions(v){
 if(U.mcqOptions[v.id])return U.mcqOptions[v.id];
 const pool=D.vocab.filter(x=>x.id!==v.id&&x.cn!==v.cn&&x.vi&&!memoryClash(v.vi,x.vi));
 memoryShuffle(pool);
 pool.sort((a,b)=>(a.cat===v.cat?-5:0)+Math.abs(a.vi.length-v.vi.length)*.04-(b.cat===v.cat?-5:0)-Math.abs(b.vi.length-v.vi.length)*.04);
 const picks=[v];
 for(const x of pool){if(picks.every(y=>!memoryClash(y.vi,x.vi))){picks.push(x);if(picks.length===4)break;}}
 if(picks.length<4){for(const x of D.vocab){if(picks.length===4)break;if(x.id!==v.id&&x.vi&&!picks.some(y=>y.vi===x.vi))picks.push(x);}}
 const opts=memoryShuffle(picks.map(x=>({id:x.id,vi:x.vi})));
 U.mcqOptions[v.id]=opts;
 return opts;
}
function memoryChoose(selectedId){
 if(U.mcqFinished)return;
 const id=U.mcqOrder[U.mcqIndex],word=D.vocab.find(x=>x.id===id);
 if(!word||U.mcqAnswered[id])return;
 if(!memoryOptions(word).some(x=>x.id===selectedId))return;
 const good=selectedId===id;
 U.mcqAnswered[id]={selected:selectedId,correct:good};
 const old=P.memory[id]||{};
 P.memory[id]={attempts:(old.attempts||0)+1,correct:(old.correct||0)+(good?1:0),wrong:(old.wrong||0)+(good?0:1),lastCorrect:good,lastAt:new Date().toISOString()};
 if(!good)P.vocab[id]={...(P.vocab[id]||{}),status:'review',lastReviewed:new Date().toISOString()};
 tracked();render();
}
function memoryNext(){
 if(U.mcqOrder.length===0)return;
 if(U.mcqIndex>=U.mcqOrder.length-1){U.mcqFinished=true;}else{U.mcqIndex++;}
 render();
}

  +'<p>Đúng '+right+' câu, cần xem lại '+(U.mcqOrder.length-right)+' câu. Từ trả lời sai đã được đưa vào “Từ khó” để bạn luyện lại.</p>'
  +'<div class="mcq-actions"><button class="btn primary" data-act="memoryRestart">Luyện lượt mới ↗</button><button class="btn outline" data-mfilter="review">Ôn từ khó ↺</button></div></div>';
 }else{

   +opts.map((opt,i)=>{
     const cls=saved?(opt.id===v.id?'correct':opt.id===saved.selected?'wrong':'dim'):'';
     return '<button type="button" class="mcq-option '+cls+'" data-mchoice="'+opt.id+'" '+(saved?'disabled':'')+' aria-label="Đáp án '+(i+1)+': '+attr(opt.vi)+'">'
      +'<span class="mcq-letter">'+String.fromCharCode(65+i)+'</span><span class="mcq-meaning">'+e(opt.vi)+'</span></button>';
    }).join('')+'</div><div class="mcq-answer-footer">';
  if(saved){body+='<div class="mcq-feedback '+(saved.correct?'':'wrong')+'" role="status">'
      +'<strong>'+(saved.correct?'✓ Chính xác!':'↺ Chưa đúng · đã thêm vào Từ khó')+'</strong>'
      +'<div>Đáp án nguồn: <strong>'+e(v.cn)+'</strong> · '+e(v.py)+' · <strong>'+e(v.vi)+'</strong></div>'

   }
   body+='</div></div><div class="mcq-bottom"><span class="mcq-mini">'+(saved?'Bấm “Câu tiếp theo” hoặc phím Enter.':'Chọn 1 ô hoặc nhấn phím 1, 2, 3, 4.')+'</span>'

 }
 const lifetime=Object.values(P.memory||{}),attempts=lifetime.reduce((s,x)=>s+(x.attempts||0),0),correct=lifetime.reduce((s,x)=>s+(x.correct||0),0);
 return heading('02 · GHI NHỚ','Chọn nghĩa đúng trong 4 ô','Nhìn chữ Hán, chọn 1 nghĩa tiếng Việt đúng. Các đáp án đều lấy từ từ vựng của chính bài đang học.')+memoryModeBar()+controls+body
 +'<div class="mcq-note">✦ Mỗi lượt tối đa 10 từ trong bộ '+e(U.mcqFilter==='review'?'Từ khó':'đã chọn')+'. Đã luyện '+lifetime.length+' từ, trả lời đúng '+correct+' / '+attempts+' lượt lựa chọn. Trả lời sai sẽ tự đưa từ vào danh sách ôn lại. Kết quả lưu riêng cho từng bài trên trình duyệt.</div>';

const grammarTopics=[
 {title:'Câu tồn hiện',cn:'存现句',pages:[28,29,30,31,32],note:'Theo trang 28–32: các mẫu có 有, 是, động từ + 着 hoặc 了 diễn tả sự tồn tại, xuất hiện hay mất đi. Tài liệu lưu ý đối tượng trong một số câu tồn hiện thường là đối tượng chưa xác định.'},
 {title:'Càng ngày càng',cn:'越来越',pages:[35],note:'Theo trang 35: 越来越 diễn tả sự thay đổi theo thời gian. Đọc kỹ các ví dụ về số lượng đơn hàng, chất lượng sản phẩm và số người học.'},
 {title:'Càng… càng…',cn:'越…越…',pages:[36,37],note:'Theo trang 36–37: 越…越… nêu sự thay đổi gắn với một điều kiện/hành động. Trang 37 ghi rõ không thêm 很 ngay sau 越 trong ví dụ “越看越喜欢”.'},
 {title:'Mẫu câu bổ trợ',cn:'说实话 · 终于 · 对于 · 而',pages:[69,70,71,72],note:'Các trang 69–72 đưa ra từ nối, cách diễn đạt và câu ví dụ. Giữ nguyên bản dịch/pinyin ở tài liệu để ôn tập.'}
];
function entriesForPages(pages,answers=false){return D.entries.filter(r=>pages.includes(r.page)&&(answers||r.kind!=='answer'));}
function entryHtml(r,{showPy=true,showVi=true,raw=false}={}){if(r.kind==='note')return `<article class="lesson-card"><span class="pill warn">Nội dung không ghép đủ 3 dòng · Trang ${pad(r.page)}</span><div class="lesson-vi">${e(r.vi)}</div></article>`;
 const correction=D.audit.find(a=>a.severity==='corrected'&&a.page===r.page&&r.cn.includes(a.source));
 let displayed=correction?r.cn.replace(correction.source,correction.suggested):r.cn;
 return `<article class="lesson-card"><div class="badge-line"><span class="pill ${r.kind==='answer'?'extra':''}">${r.kind==='answer'?'ĐÁP ÁN / MẪU':'NỘI DUNG TÀI LIỆU'}</span><span class="mini-note">Trang ${pad(r.page)} ${correction?'· Có hiệu đính':''}</span></div>${r.kind==='answer'?`<div class="answer-marker">${e(r.label||'Đáp án')}</div>`:''}<div class="lesson-cn han">${e(displayed)}</div>${correction?`<div class="mini-note">Bản gốc: ${e(correction.source)} · <button data-tab="audit" class="linkish">Xem hiệu đính</button></div>`:''}${showPy&&r.py?`<div class="lesson-py">${e(r.py)}</div>`:''}${showVi&&r.vi?`<div class="lesson-vi">${e(r.vi)}</div>`:''}<div style="margin-top:13px;display:flex;gap:7px"><button class="btn small outline" data-page="${r.page}">Xem trang gốc</button>${r.cn?`<button class="btn small soft" data-speak="${attr(displayed)}">♫ Nghe</button>`:''}</div></article>`}
function grammar(){const t=grammarTopics[U.grammarTab];const selected=entriesForPages(t.pages).filter(r=>r.kind==='content');return heading('03 · NGỮ PHÁP','Nắm vững cấu trúc','Học theo đúng ví dụ đã có trong tài liệu. Mỗi công thức đều có số trang để đối chiếu.')+`<div class="topic-tabs">${grammarTopics.map((x,i)=>`<button class="topic-btn ${i===U.grammarTab?'active':''}" data-grammar="${i}"><span class="han" style="font-size:17px;color:inherit">${e(x.cn)}</span><span>${e(x.title)}</span></button>`).join('')}</div><div class="info-card" style="margin-bottom:18px;background:#eef5f7;border-color:#d5e7ed"><div class="eyebrow" style="color:#4e8396">ĐIỂM NHỚ TỪ TÀI LIỆU · TRANG ${t.pages.join(', ')}</div><h3 class="han" style="font-size:26px;margin:10px 0">${e(t.cn)}</h3><p style="font-size:13px;color:#526a7b">${e(t.note)}</p><button class="btn small outline" data-page="${t.pages[0]}">Mở trang nguồn ↗</button></div><div class="section-line"><h2>Giải thích và ví dụ (${selected.length})</h2><span>Chữ Hán · pinyin · tiếng Việt</span></div><div class="lesson-list">${selected.map(r=>entryHtml(r)).join('')}</div>`}
const readerGroups=[['reading1','Bài khóa 1 · Đi taxi, đến chơi nhà'],['reading2','Bài khóa 2 · Cuộc sống thay đổi'],['reading3','Đọc điền từ & trả lời'],['translation','Luyện dịch'],['speaking','HSKK · Luyện nói']];
function reading(){const group=D.sections.find(s=>s.id===U.readerGroup)||D.sections.find(s=>s.id==='reading1');const rows=entriesForPages(group.pages,U.readerAnswers).filter(r=>r.kind!=='note'||r.vi);
return heading('04 · BÀI ĐỌC & NÓI','Đọc hiểu từng trang','Bám sát thứ tự câu của tài liệu. Bật hoặc ẩn pinyin / tiếng Việt để tự kiểm tra mức độ hiểu.')+`<div class="toolbar"><select class="select" id="readerGroup" aria-label="Chọn bài đọc">${readerGroups.map(([id,label])=>`<option value="${id}" ${U.readerGroup===id?'selected':''}>${e(label)}</option>`).join('')}</select><div class="chips"><button class="chip ${U.readerPy?'active':''}" data-act="readerPy">${U.readerPy?'✓ ':''}Pinyin</button><button class="chip ${U.readerVi?'active':''}" data-act="readerVi">${U.readerVi?'✓ ':''}Tiếng Việt</button><button class="chip ${U.readerAnswers?'active':''}" data-act="readerAnswers">${U.readerAnswers?'✓ ':''}Hiện đáp án</button></div></div><div class="reminder" style="margin:0 0 17px;background:#eff6f8;color:#45667a;border-color:#d9e9f0"><span class="symbol">◈</span><div><strong style="color:#43657a">Bản chữ từ trang ${group.pages[0]}–${group.pages.at(-1)}</strong>Để nghe, chọn nút ♫ ở từng đoạn. Các trang có đề nói theo tranh nhưng không có văn bản miêu tả tranh sẽ được đánh dấu thiếu dữ liệu thay vì tự tạo câu trả lời.</div></div><div class="lesson-list">${rows.map(r=>entryHtml(r,{showPy:U.readerPy,showVi:U.readerVi})).join('')}</div>`}
function translations(){return D.entries.filter(r=>r.kind==='content'&&r.cn.length>=11&&r.cn.length<130&&r.vi.length>=20&&r.py&&r.page>=6&&r.page<=42&&!/[.]{3,}|…/.test(r.cn)).map(r=>({id:'tx'+r.id,page:r.page,prompt:r.vi,promptVi:r.vi,answer:r.cn,answerPy:r.py,answerVi:r.vi,type:'translation',answerLabel:'CÂU GỐC TRONG TÀI LIỆU'}));}
const TX=translations();

 if(U.quizFilter!=='all'){

 U.quizIndex=Math.min(Math.max(0,U.quizIndex),Math.max(0,arr.length-1));return arr;}
function exerciseNote(x){if(U.quizMode!=='source')return `Bài luyện bổ sung: dịch từ tiếng Việt của chính câu gốc (trang ${pad(x.page)}). Có thể có bản dịch khác hợp lệ; công cụ chỉ đối chiếu với cách viết trong tài liệu.`;
 if([45].includes(x.page))return 'Gợi ý ngữ pháp từ trang 28–31: trong câu tồn hiện, động từ + 着 thường chỉ trạng thái đang tồn tại.';
 if([46].includes(x.page))return 'Gợi ý ngữ pháp từ trang 35: 越来越 dùng khi diễn tả sự thay đổi theo thời gian.';
 if([47].includes(x.page))return 'Gợi ý ngữ pháp từ trang 36–37: 越…越… diễn tả quan hệ “càng… càng…”, và ví dụ trang 37 lưu ý không chèn 很 ngay sau 越.';
 if([43,48].includes(x.page))return 'Hãy đối chiếu thứ tự thành phần câu với đáp án gốc. Có thể xem lại phần ngữ pháp trang 28–37.';
 if([49,67,85].includes(x.page))return 'Đây là lời giải mẫu từ nguồn. Những câu trả lời khác đúng ngữ pháp và đúng nội dung vẫn có thể được chấp nhận; hãy tự đánh giá hoặc nhờ giáo viên.';
 if([62,63,64,65].includes(x.page))return 'Bài điền từ theo đoạn văn; tài liệu cung cấp đáp án đánh số trong câu gốc. Hãy so với lời giải, không tự động chấm nguyên đoạn.';
 if(x.page===76)return 'Đây là bài luyện dịch đoạn văn: đề tiếng Việt được chép từ ảnh nguồn trang 76 và phần dịch chữ Hán có sẵn trong file Word. Đối chiếu lần lượt từng câu, không dùng chấm điểm máy cho cả đoạn.';
 if(x.page===66)return 'Câu hỏi đọc hiểu: đáp án nguồn dựa vào đoạn bài khóa ở trang 62–65. Có thể diễn đạt đúng bằng câu khác; hãy tự đối chiếu nội dung.';
 if(x.page===44)return 'Chọn từ/cấu trúc từ bảng cho sẵn ở trang 44. So lại với câu đầy đủ được cung cấp ở đáp án nguồn.';
 return 'Đối chiếu chữ Hán, pinyin và nghĩa tiếng Việt với bản gốc. Các câu có nhiều cách diễn đạt không nên chỉ dựa vào so khớp ký tự.';
}

iv>`:''}<div class="quiz-control" style="margin-top:11px"><button class="btn small soft" data-act="quizPy">${U.quizShowPy?'Ẩn':'Xem'} pinyin</button><button class="btn small soft" data-act="quizVi">${U.quizShowVi?'Ẩn':'Gợi ý'} tiếng Việt</button></div>`}<div class="divider"></div><div class="mini-note" style="margin-bottom:9px">CÂU TRẢ LỜI CỦA BẠN · ${manual?'Tự đối chiếu đáp án':'Gõ cả câu hoàn chỉnh để so với nguồn'}</div><textarea id="quizDraft" class="answer-box han" placeholder="Nhập câu trả lời bằng chữ Hán vào đây...">${e(U.quizDraft)}</textarea><div class="quiz-control" style="margin-top:13px"><button class="btn primary" data-act="quizCheck">${manual?'Xem lời giải mẫu':'Kiểm tra đáp án'}</button><button class="btn outline" data-act="quizReveal">Hiện đáp án</button><button class="btn small outline" data-act="quizClear">Xóa phần đã nhập</button></div>${U.quizResult?`<div class="answer-result ${U.quizResult==='right'?'':'no'} ${U.quizResult==='manual'?'neutral':''}"><strong>${U.quizResult==='right'?'✓ Trùng với đáp án gốc':U.quizResult==='wrong'?'Câu này chưa trùng đáp án gốc':'Lời giải tham khảo từ tài liệu'}</strong>${U.quizResult==='wrong'?'<p>Hãy xem chữ Hán, cấu trúc và vị trí từ. Hệ thống so khớp bản nguồn, không kết luận tất cả cách nói khác là sai.</p>':''}<div class="answer-cn han">${e(x.answer)}</div><div class="answer-py">${e(x.answerPy)}</div><div class="answer-vi">${e(x.answerVi)}</div><div class="divider" style="margin:13px 0"></div><strong>Vì sao / cần ghi nhớ</strong><p>${e(exerciseNote(x))}</p>${U.quizResult!=='right'?`<div class="quiz-control" style="margin-top:14px"><button class="btn small teal" data-qsave="correct" data-qid="${x.id}" data-qtype="${U.quizMode}">✓ Đã hiểu</button><button class="btn small bad" data-qsave="review" data-qid="${x.id}" data-qtype="${U.quizMode}">↺ Cần ôn thêm</button></div>`:''}</div>`:''}<div class="quiz-nav"><button class="btn outline" data-act="quizPrev" ${U.quizIndex===0?'disabled':''}>← Câu trước</button><span class="mini-note">${s==='correct'?'✓ Đã làm đúng':s==='review'?'↺ Cần ôn':'Chưa chấm'}</span><button class="btn outline" data-act="quizNext" ${U.quizIndex>=arr.length-1?'disabled':''}>Câu tiếp →</button></div></div>`:`<div class="empty">Không có câu nào trong bộ lọc này. Chọn một dạng bài khác.</div>`}<div class="reminder"><span class="symbol">☞</span><div><strong>Nguyên tắc chấm bài</strong>Chỉ có một câu so khớp với đáp án nguồn mới được hệ thống tự đánh dấu “trùng đáp án”. Câu đọc hiểu, câu nói, dịch nghĩa hoặc lời giải mẫu không bị phán sai chỉ vì dùng cách diễn đạt khác.</div></div>`}
function pageContent(){const arr=D.entries.filter(x=>x.page===U.page);return U.pageRaw?`<div class="lesson-card"><h3 style="margin-top:0">Bản chữ theo từng dòng nguồn · Trang ${pad(U.page)}</h3>${(D.rawPageLines[String(U.page)]||[]).map(x=>`<div class="raw-line"><div class="raw-mark">${e(x.t)}</div><div class="raw-content ${['cn','acn'].includes(x.t)?'han':''}">${e(x.text)}</div></div>`).join('')}</div>`:arr.map(r=>entryHtml(r,{showPy:U.pagePy,showVi:U.pageVi})).join('')}
function pages(){let s=heading('THƯ VIỆN TÀI LIỆU','89 trang nguyên bản chữ','Lần theo từng trang, giữ đúng thứ tự; chọn “Dòng nguồn” để xem nguyên văn, kể cả phần bị lệch cặp chữ Hán/pinyin/tiếng Việt.');const notes=D.audit.filter(x=>x.page===U.page);return s+`<div class="toolbar"><div class="source-nav"><button class="btn small outline" data-act="pagePrev" ${U.page===1?'disabled':''}>← Trước</button><label class="mini-note">Trang <input id="gotoPage" type="number" min="1" max="89" value="${U.page}"> / 89</label><button class="btn small outline" data-act="gotoPage">Đến trang</button><button class="btn small outline" data-act="pageNext" ${U.page===89?'disabled':''}>Sau →</button></div><div class="chips" style="margin-left:auto"><button class="chip ${U.pageRaw?'active':''}" data-act="pageRaw">Dòng nguồn</button><button class="chip ${U.pagePy?'active':''}" data-act="pagePy">Pinyin</button><button class="chip ${U.pageVi?'active':''}" data-act="pageVi">Tiếng Việt</button></div></div><div class="source-panel"><div><div class="info-card" style="margin-bottom:16px"><div class="eyebrow">TRANG ${pad(U.page)} / 89</div><h3 style="margin:8px 0">${e(pageName(U.page))}</h3><div class="mini-note">${D.entries.filter(x=>x.page===U.page).length} nhóm nội dung · Câu trích từ bản Word</div></div>${notes.map(n=>`<div class="reminder" style="margin:0 0 14px"><span class="symbol">⚑</span><div><strong>${n.severity==='corrected'?'Đã đề xuất hiệu đính':'Đang chờ đối chiếu'}</strong>${e(n.reason)}</div></div>`).join('')}<div class="lesson-list">${pageContent()}</div></div><aside class="source-side"><strong>Chọn nhanh trang</strong><p>Trang có gạch cam là trang có ghi chú cần đối chiếu. Bạn vẫn có thể xem bản chữ Hán gốc.</p><div class="page-tiles">${Array.from({length:89},(_,i)=>`<button class="page-tile ${U.page===i+1?'active':''} ${D.audit.some(a=>a.page===i+1)?'problem':''}" title="Trang ${i+1}" data-page="${i+1}">${i+1}</button>`).join('')}</div><div style="margin-top:14px"><button class="btn small soft" data-tab="audit">Xem kiểm tra nguồn ↗</button></div></aside></div>`}
function audit(){return heading('KIỂM SOÁT CHẤT LƯỢNG','Đối chiếu & hiệu đính','Giữ nguyên dữ liệu gốc, chỉ ghi nhận sửa chữa được xác minh; những chỗ còn thiếu không được tự hoàn thiện.')+`<div class="cards3">${stat('Trang trong file',D.meta.pages,'Đã nhận đủ các nhãn trang từ 01–89','▤')}${stat('Nhóm dữ liệu',D.meta.stats.entries,'Bao gồm nội dung, đáp án và chú thích','文')}${stat('Ghi chú cần kiểm tra',D.audit.length,'Có hiệu đính và các trường hợp thiếu nguồn','⚑')}</div><div class="section-line"><h2>Danh sách kiểm tra (${D.audit.length})</h2><span>Có số trang đối chiếu</span></div>${D.audit.map(a=>`<article class="audit-row"><div class="split"><h3>Trang ${pad(a.page)} · ${a.severity==='corrected'?'Hiệu đính có căn cứ':a.severity==='transcribed'?'Nội dung tiếng Việt chép từ ảnh':a.severity==='missing'?'Thiếu dữ liệu chữ':'Cần kiểm tra'}</h3><span class="pill ${a.severity==='corrected'?'ok':'warn'}">${a.severity==='corrected'?'Đề xuất sửa':a.severity==='transcribed'?'Đã đọc từ ảnh':'Chưa tự sửa'}</span></div><div class="mini-note">BẢN GỐC</div><div class="audit-block han">${e(a.source)}</div>${a.suggested?`<div class="mini-note" style="margin-top:14px">ĐỀ XUẤT HIỆU ĐÍNH</div><div class="audit-block good han">${e(a.suggested)}</div>`:''}<p>${e(a.reason)}</p><button class="btn small outline" data-page="${a.page}">Xem trang ${pad(a.page)} →</button></article>`).join('')}<div class="reminder"><span class="symbol">ℹ</span><div><strong>Giới hạn cần biết</strong>File đang dùng là bản Word được chuyển từ tài liệu gốc, không phải bản ghi âm của giáo viên. Một số cách ghi pinyin, lỗi cách và hình ảnh riêng của trang chưa được xác minh từng ký tự với PDF gốc. Các trường hợp chưa xác minh không được mặc định là đúng hoặc tự chấm sai.</div></div>`}
function backup(){const m=metaProgress();const saved=P.updatedAt?new Date(P.updatedAt).toLocaleString('vi-VN'):'Chưa có';return heading('DỮ LIỆU CÁ NHÂN','Lưu & khôi phục tiến độ','Tiến độ tự lưu trong trình duyệt. Để đổi máy hoặc điện thoại, hãy xuất file rồi nhập vào trình duyệt khác.')+`<div class="progress-grid"><section class="save-box"><span class="pill core">LƯU TRONG MÁY NÀY</span><h3 style="margin-top:16px">Tiến độ hiện tại</h3><p>${m.known} từ thuộc · ${m.review} từ cần ôn · ${m.attempted} câu đã làm<br>Đã lưu gần nhất: <strong>${e(saved)}</strong></p><div class="saving-message">Không cần tạo tài khoản. Dữ liệu được lưu bằng bộ nhớ trình duyệt (localStorage), không gửi lên Google Drive hay server.</div><button class="btn primary" style="margin-top:20px" data-act="export">↓ Xuất tiến độ (.json)</button></section><section class="save-box"><span class="pill extra">CHUYỂN THIẾT BỊ</span><h3 style="margin-top:16px">Nhập lại tiến độ</h3><p>Chọn tệp .json đã xuất từ website này. Việc nhập sẽ thay thế tiến độ của trình duyệt hiện tại.</p><input id="progressFile" type="file" accept=".json,application/json" style="width:100%;border:1px dashed #cbd7e0;padding:19px;border-radius:12px;background:#fafcfe;margin:5px 0 12px"><button class="btn outline" data-act="import">↑ Nhập tệp tiến độ</button>${U.importMessage?`<p>${e(U.importMessage)}</p>`:''}</section></div><div class="reminder"><span class="symbol">☁</span><div><strong>Triển khai online và đồng bộ</strong>Website có thể đưa lên hosting tĩnh và mở bằng link HTTPS. Tuy nhiên, để đồng bộ tự động tiến độ giữa nhiều thiết bị, cần bổ sung đăng nhập/cơ sở dữ liệu; phiên bản này có chức năng xuất/nhập JSON để chuyển an toàn, tránh hứa hẹn đồng bộ không có thật.</div></div>`}
function render(){let body={home,vocab,cards,grammar,reading,quiz,pages,audit,backup}[U.tab]?.()||home();document.getElementById('app').innerHTML=shell(body);document.title=`${mainSections.find(x=>x[0]===U.tab)?.[2]||'HSK4'} · HSK4 Classroom`}
function switchTab(s){U.tab=s;U.mobile=false;U.quizResult=null;history.replaceState(null,'','#'+s);render();window.scrollTo({top:0,behavior:'instant'})}
function advanceCards(i){const d=cardDeck();U.cardIndex=Math.min(d.length-1,Math.max(0,U.cardIndex+i));U.cardFlipped=false;render()}
function advanceQuiz(i){const arr=quizList();U.quizIndex=Math.min(arr.length-1,Math.max(0,U.quizIndex+i));U.quizDraft='';U.quizResult=null;render()}
function speak(text){if(!('speechSynthesis'in window)){message('Trình duyệt này không hỗ trợ đọc văn bản.');return}try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=.85;u.pitch=1;const voices=speechSynthesis.getVoices();const zh=voices.find(x=>/^zh[-_](CN|Hans)/i.test(x.lang))||voices.find(x=>/^zh/i.test(x.lang));if(zh)u.voice=zh;speechSynthesis.speak(u);if(!zh)message('Chưa tìm thấy giọng Trung phù hợp; âm thanh phụ thuộc trình duyệt.')}catch(_){message('Không phát được âm thanh trên thiết bị này.')}}
function gotoPage(n){n=Number(n);if(!Number.isInteger(n)||n<1||n>89){message('Vui lòng chọn trang từ 1 đến 89.');return}U.page=n;U.tab='pages';U.mobile=false;history.replaceState(null,'','#pages');render();window.scrollTo({top:0,behavior:'instant'})}
function quizCheck(reveal){const arr=quizList();const x=arr[U.quizIndex];if(!x)return;let val=document.getElementById('quizDraft')?.value||U.quizDraft;U.quizDraft=val;
 const manual=U.quizMode==='translation'||['open','answer'].includes(x.type);
 if(manual||reveal){U.quizResult='manual';render();return}
 if(!val.trim()){message('Bạn hãy nhập câu trả lời hoặc chọn “Hiện đáp án”.');return}
 const good=norm(val)===norm(x.answer);U.quizResult=good?'right':'wrong';if(good){const ob=P.quiz;ob[x.id]={status:'correct',lastAttempt:new Date().toISOString(),attempts:(ob[x.id]?.attempts||0)+1};tracked()}else{P.quiz[x.id]={status:'review',lastAttempt:new Date().toISOString(),attempts:(P.quiz[x.id]?.attempts||0)+1};tracked()}render();}
async function importData(){const input=document.getElementById('progressFile');if(!input?.files?.length){message('Hãy chọn tệp JSON trước.');return}try{let raw=JSON.parse(await input.files[0].text());if(raw?.app!=='HSK4_BAI11'||!raw.progress||typeof raw.progress!=='object'||Array.isArray(raw.progress))throw Error('Không đúng tệp tiến độ HSK4 Bài 11.');
 const data=raw.progress;for(const k of ['vocab','quiz','translations','activity']){if(!data[k]||typeof data[k]!=='object'||Array.isArray(data[k]))throw Error('Tệp thiếu phần '+k)}
 if(!confirm('Nhập tệp này sẽ thay thế tiến độ đã lưu trên trình duyệt. Tiếp tục?'))return;
 P={...load(),vocab:data.vocab,quiz:data.quiz,translations:data.translations,activity:data.activity,memory:data.memory&&typeof data.memory==='object'?data.memory:{},preferences:data.preferences||{}};persist();U.importMessage='Đã nhập tiến độ.';message('Khôi phục tiến độ thành công.');render();}catch(err){message('Không thể nhập: '+err.message)}}
function exportData(){const payload=JSON.stringify({app:'HSK4_BAI11',version:1,exportedAt:new Date().toISOString(),progress:P},null,2);const blob=new Blob([payload],{type:'application/json'});const link=document.createElement('a');const url=URL.createObjectURL(blob);link.href=url;link.download='HSK4_Bai11_TienDo_'+today()+'.json';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);message('Đã tạo file xuất tiến độ.');}
function shuffle(){const arr=cardDeck();const ids=arr.map(x=>x.id);for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]];}U.cardOrder=ids;U.cardShuffle=true;U.cardIndex=0;U.cardFlipped=false;render();message('Đã trộn thứ tự thẻ.');}
const acts={memoryRestart(){memoryPrepare();render()},memoryNext(){memoryNext()},mobile(){U.mobile=!U.mobile;render()},mobileClose(){U.mobile=false;render()},vocabPrev(){U.vocabPage=Math.max(0,U.vocabPage-1);render()},vocabNext(){U.vocabPage++;render()},shuffle,flip(){U.cardFlipped=!U.cardFlipped;render()},cardPrev(){advanceCards(-1)},cardNext(){advanceCards(1)},quizPrev(){advanceQuiz(-1)},quizNext(){advanceQuiz(1)},quizPy(){U.quizShowPy=!U.quizShowPy;render()},quizVi(){U.quizShowVi=!U.quizShowVi;render()},quizClear(){U.quizDraft='';U.quizResult=null;render()},quizReveal(){quizCheck(true)},quizCheck(){quizCheck(false)},readerPy(){U.readerPy=!U.readerPy;render()},readerVi(){U.readerVi=!U.readerVi;render()},readerAnswers(){U.readerAnswers=!U.readerAnswers;render()},pageRaw(){U.pageRaw=!U.pageRaw;render()},pagePy(){U.pagePy=!U.pagePy;render()},pageVi(){U.pageVi=!U.pageVi;render()},pagePrev(){gotoPage(U.page-1)},pageNext(){gotoPage(U.page+1)},gotoPage(){gotoPage(document.getElementById('gotoPage')?.value)},export:exportData,import:importData};
document.addEventListener('click',ev=>{const hit=ev.target.closest('[data-act],[data-tab],[data-page],[data-vfilter],[data-vocab],[data-cfilter],[data-grammar],[data-qfilter],[data-qmode],[data-qsave],[data-speak],[data-mmode],[data-mfilter],[data-mchoice]');if(!hit)return;
 if(hit.dataset.mmode){U.memoryMode=hit.dataset.mmode;render();return}
 if(hit.dataset.mfilter){U.mcqFilter=hit.dataset.mfilter;memoryPrepare();render();return}
 if(hit.dataset.mchoice){memoryChoose(hit.dataset.mchoice);return}
 if(hit.dataset.tab){switchTab(hit.dataset.tab);return}
 if(hit.dataset.page){gotoPage(hit.dataset.page);return}
 if(hit.dataset.vfilter){U.vocabFilter=hit.dataset.vfilter;U.vocabPage=0;render();return}
 if(hit.dataset.vocab){setVocab(hit.dataset.vocab,hit.dataset.status);return}
 if(hit.dataset.cfilter){U.cardFilter=hit.dataset.cfilter;U.cardShuffle=false;U.cardOrder=[];U.cardIndex=0;U.cardFlipped=false;render();return}
 if(hit.dataset.grammar){U.grammarTab=Number(hit.dataset.grammar);render();return}
 if(hit.dataset.qfilter){U.quizFilter=hit.dataset.qfilter;U.quizIndex=0;U.quizResult=null;U.quizDraft='';render();return}
 if(hit.dataset.qmode){U.quizMode=hit.dataset.qmode;U.quizFilter='all';U.quizIndex=0;U.quizResult=null;U.quizDraft='';render();return}
 if(hit.dataset.qsave){setQuiz(hit.dataset.qid,hit.dataset.qtype,hit.dataset.qsave);return}
 if(hit.dataset.speak){speak(hit.dataset.speak);return}
 if(hit.dataset.act&&acts[hit.dataset.act]){acts[hit.dataset.act]();return}
});
document.addEventListener('input',ev=>{if(ev.target.id==='searchVocab'){U.search=ev.target.value;U.vocabPage=0;const pane=document.getElementById('vocab-results');if(pane)pane.outerHTML=vocabList();}else if(ev.target.id==='quizDraft'){U.quizDraft=ev.target.value;}});
document.addEventListener('change',ev=>{if(ev.target.id==='readerGroup'){U.readerGroup=ev.target.value;render()}});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.id==='gotoPage'){gotoPage(ev.target.value);return}if(U.tab==='cards'&&!['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)){if(U.memoryMode==='choice'){if(/^[1-4]$/.test(ev.key)&&!U.mcqFinished){const id=U.mcqOrder[U.mcqIndex],v=D.vocab.find(x=>x.id===id);if(v){const options=memoryOptions(v),picked=options[Number(ev.key)-1];if(picked){ev.preventDefault();memoryChoose(picked.id)}}}else if(ev.key==='Enter'&&!U.mcqFinished&&U.mcqAnswered[U.mcqOrder[U.mcqIndex]]){ev.preventDefault();memoryNext()}}else{if(ev.key==='ArrowRight'){ev.preventDefault();advanceCards(1)}if(ev.key==='ArrowLeft'){ev.preventDefault();advanceCards(-1)}if(ev.key===' '){ev.preventDefault();U.cardFlipped=!U.cardFlipped;render()}}}});
window.addEventListener('hashchange',()=>{const section=location.hash.replace('#','');if(mainSections.some(a=>a[0]===section)&&U.tab!==section){U.tab=section;render()}});
let incoming=location.hash.replace('#','');if(mainSections.some(a=>a[0]===incoming))U.tab=incoming;
render();
})();

  </script>
</body>
</html>
