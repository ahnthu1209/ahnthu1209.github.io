<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2b1b14"><meta name="description" content="Thư mời The Ambassador of Selection · Solina Signature by Wyndham."><title>The Ambassador of Selection · Solina Signature by Wyndham</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#2b1b14}#invitation{position:relative;width:min(100%,480px);height:100dvh;margin:auto;overflow:hidden;box-shadow:0 30px 120px #0006}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#3b2418}#story{visibility:hidden}#opening{z-index:2;transition:opacity .28s ease}#opening.done{opacity:0;pointer-events:none}@media(prefers-reduced-motion:reduce){#opening{transition:none}}</style></head>
<body><main id="invitation" aria-label="Thư mời Solina"><iframe id="story" src="journey/index.html?v=welcome-clean-20261123" title="Hành trình Solina" allow="autoplay" tabindex="-1" inert></iframe><iframe id="opening" src="opening/index.html?v=bow-source-v2-20261123" title="Mở thiệp Solina" allow="autoplay"></iframe></main>
<audio id="background-piano" src="audio/solina-piano.mp3" preload="auto" loop></audio>
<script src="audio/mix.js"></script>
<script>
(()=>{
 const story=document.getElementById('story'),opening=document.getElementById('opening');
 let ready=false,bowFinished=false,started=false;
 function handoff(){
   if(!ready||!bowFinished||started)return;
   started=true;
   story.style.visibility='visible';
   opening.classList.add('done');
   const handoffDuration=matchMedia('(prefers-reduced-motion: reduce)').matches?0:300;
   setTimeout(()=>{
     opening.remove();
     story.removeAttribute('inert');
     story.removeAttribute('tabindex');
     story.focus();
     story.contentWindow.postMessage({type:'solina-start-doors'},location.origin);
   },handoffDuration);
 }
 addEventListener('message',e=>{
   if(e.origin!==location.origin)return;
   if(e.source===story.contentWindow&&e.data?.type==='solina-story-ready'){ready=true;handoff();}
   if(e.source===opening.contentWindow&&e.data?.type==='solina-bow-finished'){bowFinished=true;handoff();}
   if(e.source===opening.contentWindow&&e.data?.type==='solina-unlock-audio')story.contentWindow.postMessage(e.data,location.origin);
   if(e.source===story.contentWindow&&e.data?.type==='solina-replay')location.reload();
 });
})();
</script></body></html>
